<style>
:root{
  --ink:#0B0C0E; --panel:#131519; --panel2:#181B20; --sunk:#0E1114;
  --rule:#22262D; --rule2:#2C323A;
  --text:#DDE3EA; --dim:#8A929C; --faint:#5B636D;
  --amber:#E0A03A; --steel:#5C8CA8; --moss:#7C9A5E; --rust:#B4553A; --plum:#8A6FA8;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Roboto Mono',Menlo,'Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
  font-family:var(--mono);font-size:14px;overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
button:active{transform:scale(.99)}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}

/* ---------- type ---------- */
.disp{font-family:var(--sans);font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:8.5px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}

/* ---------- shell ---------- */
#app{min-height:100vh;min-height:100dvh}
.wrap{padding:0 var(--pad) 92px}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--ink) 78%,rgba(11,12,14,.86));
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 0;border-bottom:1px solid var(--rule);
  backdrop-filter:blur(8px)}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-family:var(--sans);font-weight:800;font-size:23px;letter-spacing:.22em;line-height:1}
.subline{font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-top:6px}
.streak{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;padding-top:2px}
.gear{padding:6px;margin:-6px -4px -6px 0;color:var(--faint)}

/* vitals — signature element */
.vitals{display:flex;gap:5px;margin-top:13px;padding-bottom:11px}
.vital{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.vtrack{width:100%;height:28px;background:#15181C;border:1px solid var(--rule);
  display:flex;align-items:flex-end;overflow:hidden}
.vfill{width:100%;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.vlab{font-size:7px;letter-spacing:.13em;color:var(--faint)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,12,14,.94);backdrop-filter:blur(14px);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 0 10px;position:relative;color:var(--faint);transition:color .2s}
nav button.on{color:var(--text)}
nav button .nl{font-size:7.5px;letter-spacing:.11em;font-weight:700}
nav button .mark{position:absolute;top:0;left:28%;right:28%;height:2px;background:transparent;transition:background .25s}
nav button.on .mark{background:var(--amber)}
nav button.on svg{color:var(--amber)}

/* ---------- primitives ---------- */
.sect{display:flex;align-items:center;gap:9px;margin:20px 0 11px;
  font-size:9px;letter-spacing:.2em;font-weight:700;color:var(--dim)}
.sect .line{flex:1;height:1px;background:var(--rule)}
.panel{background:var(--panel);border:1px solid var(--rule);position:relative;overflow:hidden;margin-bottom:13px}
.panel.acc{padding-left:3px}
.acc-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.hint{font-size:10.5px;color:var(--faint);line-height:1.55;margin:0 0 12px}
.note{padding:12px 13px;font-size:10.5px;color:var(--faint);line-height:1.55;border-top:1px solid var(--rule)}
.empty{padding:20px 14px;font-size:11px;color:var(--faint);line-height:1.6;text-align:center}
p.t{font-size:11.5px;color:var(--dim);line-height:1.65;margin:0 0 9px}
p.t b{color:var(--text);font-weight:700}

/* rows */
.row{display:flex;gap:11px;align-items:flex-start;width:100%;padding:12px 13px;
  text-align:left;border-bottom:1px solid var(--rule);transition:opacity .25s}
.row:last-child{border-bottom:none}
.row.done{opacity:.45}
.box{width:18px;height:18px;min-width:18px;border:1.5px solid #3C424A;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.row.done .lab{text-decoration:line-through}
.lab{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.det{font-size:10.5px;color:var(--dim);line-height:1.5}

/* ---------- timeline ---------- */
.tl{position:relative;padding:4px 0}
.tl:before{content:'';position:absolute;left:57px;top:10px;bottom:10px;width:1px;background:var(--rule)}
.ent{display:flex;gap:0;width:100%;text-align:left;padding:0;position:relative}
.ent .time{width:46px;min-width:46px;padding:11px 0 0 13px;font-size:10px;font-weight:700;
  color:var(--faint);letter-spacing:-.02em}
.ent .pip{width:22px;min-width:22px;display:flex;justify-content:center;padding-top:15px;position:relative;z-index:1}
.pipdot{width:9px;height:9px;border:1.5px solid var(--rule2);background:var(--ink);transition:all .2s}
.ent .meat{flex:1;padding:10px 13px 12px 4px;border-bottom:1px solid var(--rule);min-width:0}
.ent:last-child .meat{border-bottom:none}
.ent .etitle{font-size:12.5px;font-weight:600;line-height:1.3}
.ent .esub{font-size:10px;color:var(--faint);margin-top:3px;line-height:1.45}
.ent.locked .etitle{color:var(--dim);font-weight:500}
.ent.locked .pipdot{background:repeating-linear-gradient(45deg,var(--rule2),var(--rule2) 2px,transparent 2px,transparent 4px);border-color:var(--rule2)}
.ent.done .etitle{text-decoration:line-through;opacity:.5}
.ent.done .esub{opacity:.5}
.dur{font-size:9px;color:var(--faint);letter-spacing:.06em}
.chev{padding:12px 12px 0 0;color:var(--faint);transition:transform .25s}
.chev.open{transform:rotate(90deg)}
.subblocks{background:var(--sunk);border-bottom:1px solid var(--rule);
  animation:grow .3s ease both;overflow:hidden}
@keyframes grow{from{opacity:0;max-height:0}to{opacity:1;max-height:900px}}
.subblocks .row{padding-left:57px;border-bottom:1px solid #191D22}
.warn{margin:0;padding:11px 13px;background:#241B10;border-top:1px solid var(--rule);
  font-size:10.5px;color:var(--amber);line-height:1.5}

/* ---------- habits ---------- */
.habits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)}
.hab{background:var(--panel);padding:13px 6px 11px;display:flex;flex-direction:column;
  align-items:center;gap:7px;transition:background .2s}
.hab.on{background:var(--panel2)}
.habdot{width:20px;height:20px;border:1.5px solid #3C424A;display:flex;align-items:center;justify-content:center;transition:all .2s}
.hab .hl{font-size:8.5px;letter-spacing:.06em;color:var(--faint);text-align:center;line-height:1.3}
.hab.on .hl{color:var(--text)}

/* ---------- heat strip ---------- */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;padding:13px}
.heat.big{grid-template-columns:repeat(13,1fr);gap:4px}
.cell{aspect-ratio:1;background:#15181C;border:1px solid var(--rule);transition:background .3s}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:13px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f span{font-size:8.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
input,select,textarea{background:var(--sunk);border:1px solid var(--rule);padding:10px;
  font-size:13px;width:100%;outline:none;border-radius:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:54px;line-height:1.5;font-size:12px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 14px) 18px,calc(100% - 9px) 18px;background-size:5px 5px;background-repeat:no-repeat}
input[type=date],input[type=time]{min-height:40px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  background:var(--amber);color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.14em}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--rule)}
.btn.ghost:active{background:var(--panel2)}
.chips{display:flex;gap:6px;padding:12px 13px 2px;flex-wrap:wrap}
.chip{padding:7px 12px;border:1px solid var(--rule);font-size:10.5px;color:var(--faint);letter-spacing:.05em;transition:all .2s}
.chip.on{border-color:var(--amber);color:var(--text);background:var(--panel2)}

/* ---------- bars / stats ---------- */
.stand{padding:12px 13px;border-bottom:1px solid var(--rule)}
.stand:last-of-type{border-bottom:none}
.standtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:11.5px}
.bar{height:5px;background:var(--sunk);border:1px solid var(--rule)}
.barfill{height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:14px}
.stat{flex:1;background:var(--panel);padding:15px 6px;text-align:center}
.stat .v{font-family:var(--sans);font-weight:800;font-size:25px;line-height:1;margin-bottom:6px}
.stat .l{font-size:7.5px;letter-spacing:.11em;color:var(--faint)}
.macros{display:flex;gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.macro{flex:1;background:var(--panel);padding:14px 3px;text-align:center}
.macro .v{font-size:16px;font-weight:700;margin-bottom:4px}
.macro .l{font-size:7.5px;letter-spacing:.11em;color:var(--faint)}

/* ---------- accordions ---------- */
.ahead{display:flex;align-items:center;gap:11px;width:100%;padding:13px;background:var(--panel);
  border:1px solid var(--rule);text-align:left}
.ahead .an{flex:1;font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.abody{border:1px solid var(--rule);border-top:none;background:#101317;animation:fade .25s ease both}
.acc-group{margin-bottom:9px}

/* books */
.book{display:flex;gap:11px;width:100%;padding:12px 13px;text-align:left;border-bottom:1px solid var(--rule)}
.book:last-child{border-bottom:none}
.pip{width:16px;height:16px;min-width:16px;border:1.5px solid var(--faint);margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.bt{font-size:12.5px;font-weight:600;line-height:1.3}
.ba{font-size:10px;color:var(--faint);margin:3px 0 5px}
.bw{font-size:10.5px;color:var(--dim);line-height:1.5;margin-bottom:6px}
.bm{font-size:8px;letter-spacing:.11em}

/* skills */
.tiers{display:flex;gap:3px;padding:0 13px}
.tiers button{flex:1;height:8px;background:var(--rule);opacity:.55;transition:all .3s}
.tiers button.on{opacity:1}

/* misc */
.orders .o{display:flex;gap:13px;padding:13px;border-bottom:1px solid var(--rule)}
.orders .o:last-child{border-bottom:none}
.onum{font-family:var(--sans);font-weight:800;font-size:15px;color:var(--faint);min-width:20px}
.closing{padding:16px 15px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--amber);
  font-size:11.5px;color:var(--dim);line-height:1.75;margin-bottom:14px}
.cmt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--rule);font-size:11.5px}
.cmt:last-child{border-bottom:none}
.cmt .x{color:var(--faint);padding:4px;margin:-4px}
.spark{display:block;width:100%;height:120px}
.badge{font-size:8px;letter-spacing:.1em;padding:3px 6px;border:1px solid var(--rule);color:var(--faint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--rule2);padding:10px 16px;font-size:11px;z-index:50;
  animation:fade .2s ease both;pointer-events:none}

/* ---------- drill-through steps ---------- */
.brow{display:flex;align-items:stretch;border-bottom:1px solid #191D22}
.brow.done .lab{text-decoration:line-through;opacity:.55}
.brow.done .det{opacity:.5}
.bmain{flex:1;display:flex;gap:11px;align-items:flex-start;padding:12px 4px 12px 57px;text-align:left;min-width:0}
.chev.sm{padding:12px 14px;display:flex;align-items:center}
.steps{background:#0A0D10;border-bottom:1px solid #191D22;padding:11px 15px 13px 57px;animation:fade .22s ease both}
.step{display:flex;gap:10px;padding:5px 0;font-size:11px;color:var(--dim);line-height:1.55}
.stepdot{width:5px;height:5px;min-width:5px;background:var(--rule2);margin-top:6px}
.prognote{display:flex;gap:8px;margin-top:9px;padding:9px 11px;background:#151208;border:1px solid #2A2210;font-size:10.5px;color:var(--amber);line-height:1.5;align-items:flex-start}

/* ---------- food ---------- */
.fuelbar{display:flex;flex-direction:column;gap:9px;padding:13px}
.fb .fbtop{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-bottom:4px}
.foodlist{border-top:1px solid var(--rule)}
.foodpick{border-top:1px solid var(--rule);background:#101317;animation:fade .2s ease both}
.searchrow{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--rule)}
.searchrow input{border:none;background:none;padding:2px 0;font-size:13px}
.foodresults{max-height:290px;overflow-y:auto}
.fres{display:flex;align-items:stretch;border-bottom:1px solid #191D22}
.fresmain{flex:1;display:flex;align-items:center;gap:8px;padding:11px 8px 11px 13px;font-size:12px;min-width:0}
.fresmain:active{background:var(--panel2)}
.fresq{padding:0 13px;font-size:11px;color:var(--faint);border-left:1px solid #191D22}
.fresq:active{color:var(--amber)}

/* ---------- week map ---------- */
.wmap{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.wcol{flex:1;background:var(--panel);padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s}
.wcol.on{background:var(--panel2)}
.wcol.on .wlab{color:var(--amber)}
.wlab{font-size:8px;letter-spacing:.09em;color:var(--faint);font-weight:700}
.wtrack{position:relative;width:100%;max-width:22px;height:64px;background:var(--sunk);border:1px solid var(--rule)}
.wcol.on .wtrack{border-color:var(--rule2)}
.wbar{position:absolute;left:2px;right:2px;background:var(--steel);opacity:.85;min-height:3px}
.wnum{font-size:8.5px;color:var(--faint);height:10px}
.daylist{min-height:10px}
.cmt.tap{width:100%;text-align:left}
.cmt.tap:active{background:var(--panel2)}
.cmttime{color:var(--faint);min-width:104px;font-size:11px}
.editrow{background:#101317;border-bottom:1px solid var(--rule);animation:fade .2s ease both}
.addzone{border-top:1px solid var(--rule)}
.copyzone{border-top:1px solid var(--rule)}

/* ---------- recent entries table ---------- */
.tbl{font-size:11px}
.tr{display:grid;grid-template-columns:1.3fr 1fr .9fr .9fr .9fr .9fr 34px;align-items:center;padding:9px 13px;border-bottom:1px solid #191D22}
.tr:last-child{border-bottom:none}
.tr.th{font-size:8.5px;letter-spacing:.1em;color:var(--faint);border-bottom:1px solid var(--rule)}
.tr .x{justify-self:end}

/* ---------- toast upgrade ---------- */
.toast{opacity:0;transition:opacity .25s;animation:none}
.toast.show{opacity:1}


/* ---------- progression ---------- */
.rx{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em}
.rx.dim{color:var(--faint);font-weight:500}
.setlog{background:#0C0F13;border-bottom:1px solid #191D22;padding:12px 15px 13px 57px;animation:fade .2s ease both}
.setrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px;border-bottom:1px solid #14181D}
.setn{width:16px;font-size:9px;color:var(--faint)}
.setadd{display:flex;align-items:center;gap:8px;margin-top:10px}
.setadd input{width:76px;padding:9px;font-size:13px;text-align:center}
.setx{color:var(--faint);font-size:11px}
.setadd .chip{white-space:nowrap;padding:9px 13px}
.flagbtn{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--faint);letter-spacing:.06em;padding:4px 8px;border:1px solid var(--rule)}
.painnote{display:flex;gap:9px;padding:10px 11px;margin-bottom:11px;background:#1E1210;border:1px solid #3A2018;font-size:10.5px;color:var(--text);line-height:1.5;align-items:flex-start}
.unflag{display:block;margin-top:5px;font-size:9px;color:var(--rust);letter-spacing:.08em;text-decoration:underline}

/* ---------- banners ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;background:#1D1608;border:1px solid #3A2E10;padding:13px;margin-bottom:13px;font-size:11px;line-height:1.55;color:var(--dim)}
.banner b{color:var(--text)}
.banner.moss{background:#121A0F;border-color:#243318}
.banner.steel{background:#0F161C;border-color:#1C2A36}


/* ---------- day rail (drag calendar) ---------- */
.railwrap{position:relative;overflow:hidden;border:1px solid var(--rule);background:var(--panel);margin-bottom:2px}
.rail{position:relative;margin:10px 12px 10px 50px}
.rhour{position:absolute;left:-46px;right:0;border-top:1px solid #1B1E23;height:0}
.rhour span{position:absolute;left:0;top:-6px;width:40px;text-align:right;font-size:8px;color:var(--faint);padding-right:6px}
.rnow{position:absolute;left:-46px;right:0;height:1px;background:var(--amber);z-index:6}
.rnow:before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.rblk{position:absolute;left:2px;right:2px;background:var(--panel2);border-left:3px solid var(--rule2);
  padding:4px 8px;overflow:hidden;touch-action:none;border-radius:1px}
.rblk.lock{opacity:.5;background:repeating-linear-gradient(135deg,#181B20,#181B20 5px,#121417 5px,#121417 10px)}
.rblk.drag{cursor:grab}
.rblk.dragging{box-shadow:0 8px 22px rgba(0,0,0,.55);z-index:10;cursor:grabbing;opacity:.96}
.rblkT{font-size:9.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.rblkS{font-size:7.5px;color:var(--faint);margin-top:2px}
.railhint{display:flex;align-items:center;gap:6px;padding:8px 2px 15px;font-size:9.5px;color:var(--faint)}

/* ---------- commitment tag dots ---------- */
.tagdot{width:7px;height:7px;min-width:7px;border-radius:50%;margin-right:2px}

/* ---------- PR badges ---------- */
.setrow .award-inline{display:inline-flex}


/* ---------- day navigation ---------- */
.daynav{display:flex;align-items:center;margin:14px 0 10px}
.darrow{padding:10px 12px;color:var(--faint)}
.darrow:active{color:var(--text)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --------------------------------------------- storage (with migration) -- */
const KEY = 'forge.v1', OLDKEY = 'protocol.v2';
const mem = {};
const Store = {
  async load(){
    const tryKey = async k => {
      try{ if (window.storage){ const r = await window.storage.get(k); if (r&&r.value) return JSON.parse(r.value); } }catch(e){}
      try{ const v = localStorage.getItem(k); if (v) return JSON.parse(v); }catch(e){}
      return mem[k] ? JSON.parse(mem[k]) : null;
    };
    return (await tryKey(KEY)) || (await tryKey(OLDKEY));
  },
  async save(data){
    const s = JSON.stringify(data); mem[KEY]=s;
    try{ if (window.storage){ await window.storage.set(KEY, s); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, s); return true; }catch(e){ return false; }
  }
};

/* ============================================================ scheduler == */
const PREF = { morning:[330,600], midday:[660,900], evening:[990,1260] };

function subtract(free,s,e){
  const out=[];
  for (const iv of free){
    if (e<=iv[0]||s>=iv[1]){ out.push(iv); continue; }
    if (s>iv[0]) out.push([iv[0],s]);
    if (e<iv[1]) out.push([e,iv[1]]);
  }
  return out.filter(iv=>iv[1]-iv[0]>=10);
}
function place(free,dur,anchor,win){
  let best=null,bestCost=Infinity;
  for (const iv of free){
    if (iv[1]-iv[0]<dur) continue;
    let s = anchor!=null?clamp(anchor,iv[0],iv[1]-dur):iv[0];
    if (win){ s=clamp(s,Math.max(iv[0],win[0]),Math.max(iv[0],Math.min(iv[1]-dur,win[1]))); s=clamp(s,iv[0],iv[1]-dur); }
    let cost = anchor!=null?Math.abs(s-anchor):s;
    if (win){ const mid=(win[0]+win[1])/2; cost=Math.abs(s-mid)*(s>=win[0]&&s+dur<=win[1]?0.25:1); }
    if (cost<bestCost){ bestCost=cost; best=[s,s+dur]; }
  }
  return best;
}

function buildDay(key){
  const p=S.profile;
  const di = S.swap[key]!=null ? S.swap[key] : dowIdx(key);
  const def = WEEK[di];
  const wake=m2s(p.wake); let sleep=m2s(p.sleep); if(sleep<=wake) sleep+=1440;

  const fixed = [ ...(S.fixed[DOW[dowIdx(key)]]||[]), ...(S.extra[key]||[]) ]
    .map(c=>({s:m2s(c.s), e:m2s(c.e)<m2s(c.s)?m2s(c.e)+1440:m2s(c.e), l:c.l, t:c.t, fixed:true}))
    .sort((a,b)=>a.s-b.s);

  let free=[[wake,sleep]];
  const buf=+p.commute||0;
  for (const c of fixed) free=subtract(free,c.s-buf,c.e+buf);

  const out=[...fixed], missed=[], adapt=[], nudge=day(key).nudge;
  const physMin = fixed.filter(c=>c.t==='physical').reduce((a,c)=>a+(c.e-c.s),0);

  const add=(id,label,sub,dur,anchor,win,kind)=>{
    let slot=null;
    if (nudge[id]!=null){
      const s=nudge[id];
      if (free.some(iv=>s>=iv[0]&&s+dur<=iv[1])) slot=[s,s+dur];
    }
    if (!slot) slot=place(free,dur,anchor,win);

    if (kind==='meal' && anchor!=null){
      let host=null,hostStart=null,hostCost=Infinity;
      for (const c of fixed){
        if (c.e-c.s<150) continue;
        const s=clamp(anchor,c.s+20,c.e-20-dur);
        if (s<c.s+20||s+dur>c.e-20) continue;
        const cost=Math.abs(s-anchor);
        if (cost<hostCost){ hostCost=cost; host=c; hostStart=s; }
      }
      const slotCost = slot?Math.abs(slot[0]-anchor):Infinity;
      if (host && hostCost+25<slotCost){
        out.push({s:hostStart,e:hostStart+dur,l:label,id,kind,inside:true,
          sub:`During ${host.l.toLowerCase()} - pack it the night before`});
        return;
      }
    }
    if (!slot && kind==='train'){
      const short=Math.round(dur*0.55);
      slot=place(free,short,anchor,win);
      if (slot) missed.push(`Only ${short} minutes was free - cut the accessories, keep the main lifts or rounds.`);
    }
    if (!slot){ missed.push(`No room for ${label.toLowerCase()} today.`); return; }
    free=subtract(free,slot[0],slot[1]);
    out.push({s:slot[0],e:slot[1],l:label,sub,id,kind});
  };

  const trainWin=PREF[p.trainPref]||PREF.morning;
  let trainDur=def.dur;
  if (def.type==='engine' && physMin>=90){
    trainDur=Math.max(35,Math.round(def.dur*0.55));
    adapt.push(`Heavy tagged practice today (${physMin} min) already covers conditioning. Session trimmed to ${trainDur} min — mobility and core, not more cardio.`);
  } else if (def.type==='engine' && physMin>=45){
    trainDur=Math.max(30,Math.round(def.dur*0.45));
    adapt.push(`${physMin} minutes of tagged practice today already covers conditioning. Engine block trimmed to ${trainDur} min of core and mobility.`);
  }
  add('train',def.title,def.aim,trainDur,null,trainWin,'train');
  const tr=out.find(o=>o.id==='train');
  add('news','Daily intelligence','Markets, macro, one long piece. Twenty minutes, then stop.',20,wake+40,null,'mind');
  add('meal1','Meal 1','Protein-forward. Within 90 minutes of waking or of training.',30, tr&&tr.s<wake+180?tr.e+20:wake+75,null,'meal');
  add('meal2','Meal 2','Largest carb share on training days',30,750,null,'meal');
  add('meal3','Meal 3','Protein plus vegetables. Finish two hours before sleep.',35,1110,null,'meal');
  add('mind',MINDTASK[di].l,MINDTASK[di].d,35,null,[1020,sleep-90],'mind');
  add('review','Shutdown + review','Log the day, set tomorrow\'s one thing, screens off',20,sleep-50,null,'review');

  out.sort((a,b)=>a.s-b.s);
  return {def,di,entries:out,missed,adapt,wake,sleep};
}

function dayScore(k){

}

function nutrition(){

  const p=S.profile,kg=L.weight,cm=+p.height,age=+p.age||22;
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='m'?5:-161);

/* ========================================================== progression == */
function e1rm(w,r){ return r<=1 ? w : w*(1+r/30); }
function gymSessions(ex){
  return Object.keys(S.gym||{}).filter(k=>S.gym[k][ex]&&S.gym[k][ex].length).sort();
}
function sessionWork(ex,k){
  const E=EXS[ex], sets=S.gym[k][ex];
  const byW={};
  sets.forEach(s=>{ const key=Math.round(s.w*100)/100; (byW[key]=byW[key]||[]).push(s); });
  let qualW=null, overallTop=-Infinity;
  Object.keys(byW).forEach(key=>{
    const arr=byW[key], w=arr[0].w;
    if (w>overallTop) overallTop=w;
    const cnt=arr.filter(s=>s.r>=E.reps).length;
    if (cnt>=E.sets && (qualW==null||w>qualW)) qualW=w;
  });
  return { top: qualW!=null?qualW:overallTop, ok: qualW!=null };
}
function gymBest(ex){
  let best=null;
  for (const k of gymSessions(ex))
    for (const s of S.gym[k][ex]){
      const v = EXS[ex]&&EXS[ex].added ? s.w : e1rm(s.w,s.r);
      if (best==null||v>best) best=v;
    }
  return best;
}
/* best known strength for standards: manual body-log entry vs gym-derived */
function bestLift(k){
  const L=latestLog(), man=L?L[k]:null, gym=gymBest(k);
  if (man==null&&gym==null) return null;
  return Math.max(man??-1, gym??-1);
}

/* what should today's working weight be? returns kg + coaching state */
function daysSinceStart(){
  if(!S.meta||!S.meta.start) return 999;
  const [y,m,dd]=S.meta.start.split('-').map(Number), [ty,tm,td]=T.split('-').map(Number);
  return Math.round((new Date(ty,tm-1,td)-new Date(y,m-1,dd))/86400000);
}
function rampFactor(){
  const dse=daysSinceStart();
  if (dse<7)  return {f:0.70, label:'Ramp week 1 of 2 — loads intentionally held at 70%. Learning the movement pattern matters more than the weight this week.'};
  if (dse<14) return {f:0.85, label:'Ramp week 2 of 2 — 85% loads. Full intensity starts next week.'};
  return null;
}

function prescribe(ex){
  const E=EXS[ex]; if(!E) return null;
  let rx;
  if (deloadActive()){
    const base=bestLift(ex);
    rx = base==null ? {mode:'start'} : {mode:'deload', w:base*0.6, sets:3, reps:5};
  } else {
    const ss=gymSessions(ex);
    if (!ss.length){
      const man=latestLog()&&latestLog()[ex];
      rx = man ? {mode:'first', w:(E.added?man:man*0.8), sets:E.sets, reps:E.reps} : {mode:'start'};
    } else {
      const last=ss[ss.length-1];
      const lastWork=sessionWork(ex,last);
      const topW=lastWork.top, ok=lastWork.ok;
      let fails=0;
      for (let i=ss.length-1;i>=0;i--){
        const w=sessionWork(ex,ss[i]);
        if (Math.abs(w.top-topW)>0.5) break;
        if (w.ok) break;
        fails++;
      }
      if (fails>=3)     rx={mode:'reset', w:topW*0.9, sets:E.sets, reps:E.reps};
      else if (ok)      rx={mode:'progress', w:topW+E.inc, sets:E.sets, reps:E.reps};
      else              rx={mode:'repeat', w:topW, sets:E.sets, reps:E.reps, miss:fails};
    }
  }
  const ramp=rampFactor();
  if (ramp && rx.w!=null && rx.mode!=='deload'){ rx.w=rx.w*ramp.f; rx.ramp=ramp.label; }
  return rx;
}

function e1rmVal(ex,w,r){ return EXS[ex].added ? w : e1rm(w,r); }
function checkPR(ex,w,r){
  const val=e1rmVal(ex,w,r), prev=S.prs[ex];
  if (!prev || val>prev.e1rm+0.01){ S.prs[ex]={w,r,e1rm:val,date:T}; return true; }
  return false;
}
function bestStreakEver(){
  let max=0,cur=0;
  for (let i=1100;i>=0;i--){ const s=dayScore(dkey(-i)); if(s>0.08){ cur++; if(cur>max)max=cur; } else cur=0; }
  return Math.max(max,streak());
}
function totalSessions(){ return Object.values(S.days).filter(d=>d.blocks&&Object.values(d.blocks).some(Boolean)).length; }
function dispLoad(kg){
  if (kg==null) return '—';
  if (kg<0.5) return 'bodyweight';
  const imp=S.profile.unit==='imperial';
  return imp ? `${Math.round(kg*2.20462/5)*5} lb` : `${Math.round(kg/2.5)*2.5} kg`;
}

/* ============================================================== deload === */
function trainRatio(k){
  const d=S.days[k]; if(!d||!d.blocks) return 0;
  const def=WEEK[S.swap[k]!=null?S.swap[k]:dowIdx(k)];
  const done=def.blocks.filter(b=>d.blocks[b.id]).length;
  return done/def.blocks.length;
}
function mondayOf(off){ const d=new Date(); d.setDate(d.getDate()-dowIdx(dkey())-off*7);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekHigh(off){
  const [y,m,dd]=mondayOf(off).split('-').map(Number);
  let hard=0;
  for(let i=0;i<7;i++){ const d=new Date(y,m-1,dd+i);
    const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (trainRatio(k)>=0.6) hard++; }
  return hard>=4;
}
function deloadActive(){ return S.deload.until && T0() < S.deload.until; }
function deloadDue(){
  if (deloadActive()) return false;
  if (S.deload.snooze===mondayOf(0)) return false;
  return weekHigh(1)&&weekHigh(2)&&weekHigh(3);
}
function T0(){ return dkey(); }

/* ======================================================== weekly review == */
function weekStats(){
  const days=Array.from({length:7},(_,i)=>dkey(-i));
  let hit=0, hab=0, news=0, mind=0, reach=0, kcal=0, prot=0, fdays=0;
  for (const k of days){
    const d=S.days[k];
    if (trainRatio(k)>=0.6) hit++;
    if (d){ hab+=Object.values(d.habits||{}).filter(Boolean).length;
      if(d.news)news++; if(d.mind)mind++; }
    reach+=S.reach[k]||0;
    const ft=foodTotals(k);
    if (ft.kcal>0){ kcal+=ft.kcal; prot+=ft.p; fdays++; }
  }
  const inWin=S.log.filter(e=>days.includes(e.date)&&e.weight!=null).sort((a,b)=>a.date>b.date?1:-1);
  const wDelta=inWin.length>=2 ? inWin[inWin.length-1].weight-inWin[0].weight : null;
  const booksFin=Object.keys(S.bookDates||{}).filter(id=>days.includes(S.bookDates[id])).length;
  return { hit, habPct:Math.round(hab/(HABITS.length*7)*100), news, mind, reach,
    avgK:fdays?Math.round(kcal/fdays):null, avgP:fdays?Math.round(prot/fdays):null, fdays,
    wDelta, booksFin };
}
function skipPattern(){
  const by=Array.from({length:7},()=>[]);
  for(let i=1;i<=28;i++){ const k=dkey(-i); by[dowIdx(k)].push(trainRatio(k)); }
  let worst=null,wv=2;
  by.forEach((a,i)=>{ if(a.length<2)return; const avg=a.reduce((x,y)=>x+y,0)/a.length;
    if(avg<wv){wv=avg;worst=i;} });
  return worst!=null&&wv<0.5 ? {day:DOWL[worst], pct:Math.round(wv*100)} : null;
}
function monthAvg(off){
  const dse=daysSinceStart();
  let s=0,n=0;
  for(let i=off*30;i<off*30+30;i++){
    if (i>dse) continue;
    s+=dayScore(dkey(-i)); n++;
  }
  return {avg:n?s/n:0, n};
}

/* ========================================================= drag-to-time == */
let dragState=null;
document.addEventListener('pointerdown', e=>{
  const blk=e.target.closest('.rblk.drag[data-draggable="1"]'); if(!blk) return;
  const rail=document.getElementById('rail'); if(!rail) return;
  dragState={
    id:blk.dataset.id, startY:e.clientY, origTop:parseFloat(blk.style.top),
    px:+rail.dataset.px, wake:+rail.dataset.wake, railH:rail.offsetHeight, el:blk
  };
  try{ blk.setPointerCapture(e.pointerId); }catch(err){}
  blk.classList.add('dragging');
});
document.addEventListener('pointermove', e=>{
  if(!dragState) return;
  const dy=e.clientY-dragState.startY;
  const top=clamp(dragState.origTop+dy,0,dragState.railH-16);
  dragState.el.style.top=top+'px';
  const mins=clamp(Math.round((dragState.wake+top/dragState.px)/5)*5,0,1439);
  const lab=dragState.el.querySelector('.rblkS');
  if (lab) lab.textContent=s2disp(mins);
});
function endDrag(){
  if(!dragState) return;
  const top=parseFloat(dragState.el.style.top);
  const mins=clamp(Math.round((dragState.wake+top/dragState.px)/5)*5,0,1439);
  dragState.el.classList.remove('dragging');
  day(VD()).nudge[dragState.id]=mins;
  commit();
  dragState=null;
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ================================================================ events == */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, v2 = el.dataset.v2;
  const d = day(VD());

  switch(a){
    case 'view': view=v; if(v==='today') viewOff=0; shiftId=null; foodOpen=false; render(); window.scrollTo(0,0); return;

    /* ---- day preview navigation ---- */
    case 'daynav':
      if (+v===0) viewOff=0; else viewOff+=(+v);
      shiftId=null; foodOpen=false; openBlock2=null; break;

    /* ---- today ---- */
    case 'traintoggle': openBlock = openBlock==='train'?null:'train'; break;
    case 'drill': openBlock2 = openBlock2===v?null:v; break;
    case 'block':
      if (v==='news') d.news=!d.news;
      else if (v==='mind') d.mind=!d.mind;
      else d.blocks[v]=!d.blocks[v];
      commit(); break;
    case 'habit': d.habits[v]=!d.habits[v]; commit(); break;
    case 'news': d.news=!d.news; commit(); break;
    case 'shift':
      if (v==='train'){ openBlock = openBlock==='train'?null:'train'; break; }
      shiftId = shiftId===v?null:v; break;
    case 'nudge': {
      const plan=buildDay(VD()), ent=plan.entries.find(x=>x.id===v);
      if (+v2===0) delete d.nudge[v];
      else if (ent) d.nudge[v]=clamp(ent.s+(+v2),0,1439);
      commit(); break;
    }
    case 'reflow': d.nudge={}; shiftId=null; commit(); render(); toast('Times recalculated'); return;
    case 'swapopen': swapOpen=!swapOpen; break;
    case 'swap': S.swap[VD()]=+v; swapOpen=false; commit(); break;

    /* ---- food ---- */
    case 'foodopen': foodOpen=!foodOpen; foodQ=''; foodFocus=foodOpen; break;
    case 'addfood': {
      const f=FOODS[+v];
      d.food.push({n:f[0],kcal:f[1],p:f[2],c:f[3],f:f[4],q:+v2});
      commit(); foodFocus=true; render(); toast(`${f[0]} added`); return;
    }
    case 'addcustomfood': {
      const n=(document.getElementById('cf_n')||{}).value?.trim();
      const k=num((document.getElementById('cf_k')||{}).value);
      const pr=num((document.getElementById('cf_p')||{}).value)||0;
      const cb=num((document.getElementById('cf_c')||{}).value)||0;
      const ft=num((document.getElementById('cf_f')||{}).value)||0;
      if(!n||k==null){ toast('Name and kcal needed'); return; }
      d.food.push({n,kcal:k,p:pr,c:cb,f:ft,q:1});
      commit(); render(); toast(`${n} added`); return;
    }
    case 'delfood': d.food.splice(+v,1); commit(); break;

    /* ---- plan / calendar ---- */
    case 'planday': planDay=v; editIdx=null; preset=null; copyMode=false; break;
    case 'preset': preset=preset===v?null:v; break;
    case 'editcmt': editIdx=+v; preset=null; break;
    case 'saveedit': {
      const s=document.getElementById('es').value, en=document.getElementById('ee').value,
            l=document.getElementById('el').value.trim()||'Commitment',
            t=(document.getElementById('et')||{}).value||'';
      if(!s||!en){ toast('Set both times'); return; }
      S.fixed[planDay][+v]={s,e:en,l,t};
      S.fixed[planDay].sort((x,y)=>m2s(x.s)-m2s(y.s));
      editIdx=null; commit(); render(); toast('Saved'); return;
    }
    case 'deledit': S.fixed[planDay].splice(+v,1); editIdx=null; commit(); render(); toast('Removed'); return;
    case 'addcmt': {
      const s=document.getElementById('ns').value, en=document.getElementById('ne').value,
            l=document.getElementById('nl').value.trim()||preset||'Commitment',
            t=(document.getElementById('nt')||{}).value||'';
      if(!s||!en){ toast('Set both times'); return; }
      S.fixed[planDay].push({s,e:en,l,t});
      S.fixed[planDay].sort((x,y)=>m2s(x.s)-m2s(y.s));
      preset=null; commit(); render(); toast(`Added to ${DOWL[DOW.indexOf(planDay)]}`); return;
    }
    case 'copystart': copyMode=true; copySel={}; break;
    case 'copysel': copySel[v]=!copySel[v]; break;
    case 'copycancel': copyMode=false; break;
    case 'copygo': {
      const src=JSON.parse(JSON.stringify(S.fixed[planDay]));
      const targets=Object.keys(copySel).filter(k=>copySel[k]);
      if(!targets.length){ toast('Pick at least one day'); return; }
      targets.forEach(k=>S.fixed[k]=JSON.parse(JSON.stringify(src)));
      copyMode=false; commit(); render(); toast(`Copied to ${targets.length} day${targets.length>1?'s':''}`); return;
    }

    /* ---- body ---- */
    case 'chart': chartKey=v; break;
    case 'savelog': {
      const imp=S.profile.unit==='imperial';
      const g=id=>num((document.getElementById('f_'+id)||{}).value);
      const date=document.getElementById('f_date').value||T;
      const rec={...(S.log.find(x=>x.date===date)||{}),date};
      let any=false;
      ['weight','squat','bench','dead','ohp','row','pullup'].forEach(k=>{const x=g(k); if(x!=null){rec[k]=imp?Math.round(x/2.20462*100)/100:x; any=true;}});
      ['waist'].forEach(k=>{const x=g(k); if(x!=null){rec[k]=imp?Math.round(x*2.54*10)/10:x; any=true;}});
      ['bf','rhr','sleep'].forEach(k=>{const x=g(k); if(x!=null){rec[k]=x; any=true;}});
      if(!any){ toast('Nothing entered yet'); return; }
      S.log=[...S.log.filter(x=>x.date!==date),rec].sort((x,y)=>x.date>y.date?1:-1);
      commit(); render(); toast('Saved - see Recent Entries'); return;
    }
    case 'dellog': S.log=S.log.filter(x=>x.date!==v); commit(); render(); toast('Entry removed'); return;

    /* ---- mind / ledger / codex ---- */
    case 'track': openTrack=openTrack===v?null:v; break;
    case 'phase': openPhase=openPhase===+v?null:+v; break;
    case 'book': S.books[v]=((S.books[v]??0)+1)%3;
      if(S.books[v]===2) S.bookDates[v]=T; else delete S.bookDates[v];
      commit(); break;
    case 'tier': S.tiers[v]=+v2; commit(); break;
    case 'cap': S.capital[v]=!S.capital[v]; commit(); break;
    case 'reach': S.reach[T]=Math.max(0,(S.reach[T]||0)+(+v)); commit(); break;

    /* ---- progression ---- */
    case 'addset': {
      const ex=v, E=EXS[ex], rx=prescribe(ex);
      let w=inLoad((document.getElementById('sw_'+ex)||{}).value);
      let r=num((document.getElementById('sr_'+ex)||{}).value);
      if (w==null) w = rx&&rx.w!=null ? rx.w : null;
      if (r==null) r = E.reps;
      if (w==null&&!E.added){ toast('Enter a weight'); return; }
      if (w==null) w=0;
      if (!S.gym[VD()]) S.gym[VD()]={};
      if (!S.gym[VD()][ex]) S.gym[VD()][ex]=[];
      S.gym[VD()][ex].push({w:Math.round(w*100)/100, r:Math.round(r)});
      const isPR = checkPR(ex, Math.round(w*100)/100, Math.round(r));
      commit(); render();
      const n=S.gym[VD()][ex].length;
      if (isPR){ toast(`New PR — ${dispLoad(w)} × ${Math.round(r)}!`); try{navigator.vibrate&&navigator.vibrate([30,40,30]);}catch(e){} }
      else toast(`Set ${n}: ${dispLoad(w)} × ${Math.round(r)}`);
      return;
    }
    case 'delset': {
      if (S.gym[VD()] && S.gym[VD()][v]){
        S.gym[VD()][v].splice(+v2,1);
        if(!S.gym[VD()][v].length) delete S.gym[VD()][v];
      }
      commit(); break;
    }
    case 'painflag':
      if (S.flags[v]) delete S.flags[v]; else S.flags[v]=T;
      commit(); break;

    /* ---- deload ---- */
    case 'deloadgo': {
      const [y,m,dd]=mondayOf(-1).split('-').map(Number);
      S.deload.until=mondayOf(-1);
      commit(); render(); toast('Deload week started - 60% loads'); return;
    }
    case 'deloadskip': S.deload.snooze=mondayOf(0); commit(); break;

    /* ---- notifications ---- */
    case 'notif': {
      if (S.notif.on){ S.notif.on=false; commit(); render(); toast('Reminders off'); return; }
      if (!('Notification' in window)){ toast('This browser has no notification support'); return; }
      Notification.requestPermission().then(p=>{
        if (p==='granted'){ S.notif.on=true; commit(); startTicker();
          notify('FORGE','Reminders on. You will get a ping 15 minutes before each block.');
          render(); }
        else toast('Permission denied - enable in phone settings');
      });
      return;
    }

    case 'savenw': {
      const dt=document.getElementById('nw_d').value||T, val=num(document.getElementById('nw_v').value);
      if(val==null){ toast('Enter an amount'); return; }
      S.nw=[...S.nw.filter(x=>x.date!==dt),{date:dt,v:val}].sort((x,y)=>x.date>y.date?1:-1);
      commit(); render(); toast('Recorded'); return;
    }
    case 'export': {
      const txt=JSON.stringify(S);
      if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
      try{
        const url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
        const a2=document.createElement('a'); a2.href=url; a2.download=`forge-backup-${T}.json`; a2.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }catch(err){}
      toast('Backup copied to clipboard'); return;
    }
    case 'import': {
      const txt=prompt('Paste a backup here. This replaces everything currently stored.');
      if(!txt) return;
      try{ S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(txt)); commit(); render(); toast('Backup restored'); }
      catch(err){ toast('That file could not be read'); }
      return;
    }
  }
  render();
});

/* live inputs - commit WITHOUT re-render so typing never loses focus */
document.addEventListener('input', e => {
  const t=e.target;
  if (t.id==='foodq'){ foodQ=t.value; foodFocus=true; render(); return; }   // search must filter live
  const el=t.closest('[data-in]'); if(!el) return;
  const path=el.dataset.in, val=el.value;
  if (path.startsWith('rv.')){ day(VD()).rv[path.slice(3)]=val; commit(); return; }
  if (path==='profile.heightD'){
    const n=num(val); if(n==null) return;
    S.profile.height=S.profile.unit==='imperial'?Math.round(n*2.54*10)/10:n;
    commit(); return;                                   // no render - this was the blank-screen bug
  }
  const key=path.split('.')[1];
  if (el.tagName==='SELECT') return;                    // selects handled on change
  S.profile[key]=(key==='age'||key==='commute')?(num(val)??S.profile[key]):val;
  commit();                                             // still no render
});

/* selects + time pickers - safe to re-render after commit */
document.addEventListener('change', e => {
  const el=e.target.closest('[data-in]'); if(!el) return;
  if (el.tagName!=='SELECT' && el.type!=='time' && el.type!=='date') return;
  if ((el.type==='time'||el.type==='date') && !el.value) return;
  const key=el.dataset.in.split('.')[1];
  S.profile[key]=(key==='activity')?+el.value:el.value;
  commit(); render();
});


/* ========================================================= notifications == */
let tickerId=null; const fired={};
function notify(title,body){
  try{
    if (navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if (reg&&reg.showNotification) reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});
        else new Notification(title,{body});
      }).catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
    } else new Notification(title,{body});
  }catch(e){}
}
function checkNotif(){
  if (!S.notif.on||typeof Notification==='undefined'||Notification.permission!=='granted') return;
  const now=new Date(); const nowM=now.getHours()*60+now.getMinutes();
  const plan=buildDay(T);
  for (const e of plan.entries){
    if (e.fixed) continue;
    const d=day(T);
    const done = e.id==='train'?false : e.id==='news'?!!d.news : e.id==='mind'?!!d.mind : !!d.blocks[e.id];
    if (done) continue;
    if (nowM===e.s-15&&!fired[e.id+'p']){ fired[e.id+'p']=1; notify(e.l,'Starts in 15 minutes'); }
    if (nowM===e.s&&!fired[e.id+'n']){ fired[e.id+'n']=1; notify('Now: '+e.l, e.sub||''); }
  }
  try{
    if (navigator.setAppBadge){
      const left=plan.entries.filter(e=>!e.fixed&&e.e>nowM&&!(e.id==='news'?day(T).news:e.id==='mind'?day(T).mind:day(T).blocks[e.id])).length;
      left?navigator.setAppBadge(left):navigator.clearAppBadge();
    }
  }catch(e){}
}
function startTicker(){ if(tickerId) return; checkNotif(); tickerId=setInterval(checkNotif,45000); }

/* ================================================================== boot == */
(async function boot(){
  const saved=await Store.load();
  if (saved){
    S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),saved);
    S.profile=Object.assign({},DEFAULTS.profile,saved.profile||{});
    S.fixed=Object.assign({},DEFAULTS.fixed,saved.fixed||{});
    S.meta=Object.assign({},DEFAULTS.meta,saved.meta||{});
    Store.save(S);                                      // migrate old key forward
  }
  if (!S.meta.start){
    const hasHistory = S.log.length>0 || Object.keys(S.gym).length>0 || daysLogged()>0;
    S.meta.start = hasHistory ? dkey(-30) : T;   // existing users skip the ramp entirely
    commit();
  }
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (S.notif.on&&typeof Notification!=='undefined'&&Notification.permission==='granted') startTicker();
  const ms=new Date(new Date().setHours(24,0,30,0))-new Date();
  setTimeout(()=>location.reload(),Math.max(ms,60000));
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible' && dkey()!==T) location.reload();
  });
})();

</script>
