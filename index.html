/* ========================================================== progression == */
function e1rm(w,r){ return r<=1 ? w : w*(1+r/30); }
function gymSessions(ex){
  return Object.keys(S.gym||{}).filter(k=>S.gym[k][ex]&&workSets(S.gym[k][ex]).length).sort();
}
function sessionWork(ex,k){
  const E=EXS[ex], sets=workSets(S.gym[k][ex]);
  /* Sets count toward the same working weight if they're within WTOL kg of each
     other. Typed lb values and auto-filled blanks can land a cent or two apart
     after the kg conversion (e.g. 72.57 vs 72.58), and an exact match would split
     one 4-set session into groups that each fall short of the target. */
  const WTOL=0.3;
  let qualW=null, overallTop=-Infinity;
  sets.forEach(c=>{
    if (c.w>overallTop) overallTop=c.w;
    const cnt=sets.filter(s=>Math.abs(s.w-c.w)<=WTOL && s.r>=E.reps).length;
    if (cnt>=E.sets && (qualW==null||c.w>qualW)) qualW=c.w;
  });
  /* p = what the plan asked for going into that day (stored on each set when it was logged). Training lighter than
     that is a "drop" (tired, sore, a bad day), which must not drag the plan down with it. */
  const p=(sets.find(s=>s.p>0)||{}).p;
  const top=qualW!=null?qualW:overallTop;
  return { top, ok: qualW!=null, p, drop: p>0 && top<p-WTOL };
}
function gymBest(ex){
  let best=null;
  for (const k of gymSessions(ex))
    for (const s of workSets(S.gym[k][ex])){
      const v = EXS[ex]&&EXS[ex].added ? s.w : e1rm(s.w,s.r);
      if (best==null||v>best) best=v;
    }
  return best;
}
/* best known strength for standards: manual body-log entry vs gym-derived */
function bestLift(k){
  const L=latestField(k), man=L?L[k]:null, gym=gymBest(k);
  if (man==null&&gym==null) return null;
  return Math.max(man??-1, gym??-1);
}

/* what should today's working weight be? returns kg + coaching state */
function daysSinceStart(){
  if(!S.meta||!S.meta.start) return 999;
  const [y,m,dd]=S.meta.start.split('-').map(Number), [ty,tm,td]=T.split('-').map(Number);
  return Math.round((new Date(ty,tm-1,td)-new Date(y,m-1,dd))/86400000);
}
function rampFactor(){
  const dse=daysSinceStart();
  if (dse<7)  return {f:0.70, label:'Ramp week 1 of 2 — loads intentionally held at 70%. Learning the movement pattern matters more than the weight this week.'};
  if (dse<14) return {f:0.85, label:'Ramp week 2 of 2 — 85% loads. Full intensity starts next week.'};
  return null;
}

/* `before` = a date: work out the plan as it stood going into that day, ignoring that day's own sets */
function prescribe(ex,before){
  const E=EXS[ex]; if(!E) return null;
  let rx;
  if (deloadActive()){
    const base=bestLift(ex);
    rx = base==null ? {mode:'start'} : {mode:'deload', w:base*0.6, sets:3, reps:5};
  } else {
    /* deload sessions (flagged dl when logged) are easy by design, so they never set the baseline the next weeks climb from */
    const ss=gymSessions(ex).filter(k=>(!before||k<before) && !S.gym[k][ex].some(x=>x.dl));
    if (!ss.length){
      const Lf=latestField(ex), man=Lf?Lf[ex]:null;
      rx = man ? {mode:'first', w:(E.added?man:man*0.8), sets:E.sets, reps:E.reps} : {mode:'start'};
    } else {
      const last=ss[ss.length-1];
      const lastWork=sessionWork(ex,last);
      const topW=lastWork.top, ok=lastWork.ok;
      let fails=0, drops=0;
      for (let i=ss.length-1;i>=0;i--){
        const w=sessionWork(ex,ss[i]);
        if (w.drop) drops++; else break;
      }
      for (let i=ss.length-1;i>=0;i--){
        const w=sessionWork(ex,ss[i]);
        if (Math.abs(w.top-topW)>0.5) break;
        if (w.ok) break;
        fails++;
      }
      /* Lighter than prescribed and still got every rep: go back to what the plan asked for, don't climb from the lighter
         weight. Failing even the lighter weight, or dropping two sessions running (it isn't a bad day any more), keeps
         the usual rules, which work from what was actually lifted. */
      if (lastWork.drop && ok && drops<2) rx={mode:'repeat', w:lastWork.p, sets:E.sets, reps:E.reps, miss:0, back:true};
      else if (fails>=3) rx={mode:'reset', w:topW*0.9, sets:E.sets, reps:E.reps};
      else if (ok)      rx={mode:'progress', w:topW+E.inc, sets:E.sets, reps:E.reps};
      else              rx={mode:'repeat', w:topW, sets:E.sets, reps:E.reps, miss:fails};
    }
  }
  /* the ramp only trims a starting weight guessed from the Log tab; once real sessions exist they already ARE the light weights */
  const ramp=rampFactor();
  if (ramp && rx.mode==='first'){ rx.w=rx.w*ramp.f; rx.ramp=ramp.label; }
  return rx;
}

/* ============================================================= records === */
function e1rmVal(ex,w,r){ return EXS[ex].added ? w : e1rm(w,r); }
function checkPR(ex,w,r,date){
  const val=e1rmVal(ex,w,r), prev=S.prs[ex];
  if (!prev || val>prev.e1rm+0.01){ S.prs[ex]={w,r,e1rm:val,date:date||T}; return true; }
  return false;
}
/* the stored record is "best set ever logged", so after a set is edited or deleted it has to be worked out again */
function rebuildPR(ex){
  let best=null;
  for (const k of gymSessions(ex)) for (const st of workSets(S.gym[k][ex])){
    const v=e1rmVal(ex,st.w,st.r);
    if (!best || v>best.e1rm+0.01) best={w:st.w,r:st.r,e1rm:v,date:k};
  }
  if (best) S.prs[ex]=best; else delete S.prs[ex];
}
function bestStreakEver(){
  let max=0,cur=0;
  for (let i=1100;i>=0;i--){ const s=dayScore(dkey(-i)); if(s>0.08){ cur++; if(cur>max)max=cur; } else cur=0; }
  return Math.max(max,streak());
}
function totalSessions(){ return Object.keys(S.days).filter(k=>{ const d=S.days[k];
  return (d.blocks&&Object.values(d.blocks).some(Boolean))||extraTrain(k)>0; }).length; }
/* exact: what was actually logged or measured, formatted (unit-converted, tidied
   to a clean decimal) but never snapped to a plate increment — an 8 lb dumbbell
   stays 8 lb here, it doesn't get rounded to the nearest 5. Use this anywhere the
   number needs to match what the user actually entered. */
function dispExact(kg){
  if (kg==null) return '—';
  if (kg<0.5) return 'bodyweight';
  const imp=S.profile.unit==='imperial';
  return imp ? `${Math.round(kg*2.20462*2)/2} lb` : `${Math.round(kg*4)/4} kg`;
}
function snapLoadKg(kg,ex){
  const imp=S.profile.unit==='imperial';
  const incKg=(ex&&EXS[ex]&&EXS[ex].inc)||2.27;
  if (imp){ const incLb=Math.round(incKg*2.20462*2)/2; return Math.round(kg*2.20462/incLb)*incLb/2.20462; }
  return Math.round(kg/incKg)*incKg;
}
/* suggested: a next-weight recommendation or an aspirational target, snapped to
   a loadable increment — the exercise's own progression step (EXS[ex].inc) when
   known (2.5 lb for light dumbbell isolation work, 5 lb for most barbell lifts,
   10 lb for deadlift), falling back to a plain 5 lb / 2.5 kg plate otherwise.
   Never use this for a weight that was actually logged — see dispExact above. */
function dispLoad(kg,ex){
  if (kg==null) return '—';
  if (kg<0.5) return 'bodyweight';
  const imp=S.profile.unit==='imperial';
  const incKg=(ex&&EXS[ex]&&EXS[ex].inc)||2.27;
  if (imp){ const incLb=Math.round(incKg*2.20462*2)/2; return `${Math.round(kg*2.20462/incLb)*incLb} lb`; }
  return `${Math.round(kg/incKg)*incKg} kg`;
}
function inLoad(v){ const n=num(v); if(n==null) return null;
  return S.profile.unit==='imperial' ? n/2.20462 : n; }

/* ============================================================== deload === */
function trainRatio(k){
  const d=S.days[k]; if(!d||!d.blocks) return 0;
  const wi=dowIdx(k);
  const def=S.swap[k]!=null?(ALLDAYS[S.swap[k]]||WEEK[wi]):WEEK[wi];
  const done=def.blocks.filter(b=>d.blocks[b.id]).length;
  /* a custom workout or a logged fight counts toward a hard day the same way a planned session does */
  return Math.max(done/def.blocks.length, custRatio(k));
}
function mondayOf(off){ const d=new Date(); d.setDate(d.getDate()-dowIdx(dkey())-off*7);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekHigh(off){
  const [y,m,dd]=mondayOf(off).split('-').map(Number);
  let hard=0;
  for(let i=0;i<7;i++){ const d=new Date(y,m-1,dd+i);
    const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (trainRatio(k)>=0.6) hard++; }
  return hard>=4;
}
function deloadActive(){ return S.deload.until && T0() < S.deload.until; }
function deloadDue(){
  if (deloadActive()) return false;
  if (S.deload.snooze===mondayOf(0)) return false;
  return weekHigh(1)&&weekHigh(2)&&weekHigh(3);
}
function T0(){ return dkey(); }

/* ======================================================== weekly review == */
function weekStats(){
  const days=Array.from({length:7},(_,i)=>dkey(-i));
  let hit=0, hab=0, news=0, mind=0, reach=0, kcal=0, prot=0, fdays=0;
  for (const k of days){
    const d=S.days[k];
    if (trainRatio(k)>=0.6) hit++;
    if (d){ hab+=Object.values(d.habits||{}).filter(Boolean).length;
      if(d.news)news++; if(d.mind)mind++; }
    reach+=S.reach[k]||0;
    const ft=foodTotals(k);
    if (ft.kcal>0){ kcal+=ft.kcal; prot+=ft.p; fdays++; }
  }
  const inWin=S.log.filter(e=>days.includes(e.date)&&e.weight!=null).sort((a,b)=>a.date>b.date?1:-1);
  const wDelta=inWin.length>=2 ? inWin[inWin.length-1].weight-inWin[0].weight : null;
  const booksFin=Object.keys(S.bookDates||{}).filter(id=>days.includes(S.bookDates[id])).length;
  return { hit, habPct:Math.round(hab/(HABITS.length*7)*100), news, mind, reach,
    avgK:fdays?Math.round(kcal/fdays):null, avgP:fdays?Math.round(prot/fdays):null, fdays,
    wDelta, booksFin };
}
function skipPattern(){
  // The copy below claims "over the last four weeks" — don't make that claim
  // until four real weeks of history actually exist. Before that, every day
  // predating S.meta.start would otherwise read as a missed session (trainRatio
  // returns 0 for a day with no logged data at all, start date or not) and
  // skew every weekday's average toward a false "slipping" verdict on a
  // profile that's simply new.
  if (daysSinceStart()<28) return null;
  const by=Array.from({length:7},()=>[]);
  for(let i=1;i<=28;i++){ const k=dkey(-i); by[dowIdx(k)].push(trainRatio(k)); }
  let worst=null,wv=2;
  by.forEach((a,i)=>{ if(a.length<2)return; const avg=a.reduce((x,y)=>x+y,0)/a.length;
    if(avg<wv){wv=avg;worst=i;} });
  return worst!=null&&wv<0.5 ? {day:DOWL[worst], dayFull:DOWFULL[worst], pct:Math.round(wv*100)} : null;
}
function monthAvg(off){
  const dse=daysSinceStart();
  let s=0,n=0;
  for(let i=off*30;i<off*30+30;i++){
    if (i>dse) continue;
    s+=dayScore(dkey(-i)); n++;
  }
  return {avg:n?s/n:0, n};
}

/* ========================================================== physique ===== */
/* Turns height / weight / body fat into a concrete, measurable target and the
   honest distance to it. All internal units metric.                          */
function physique(){
  const Lw=trendWeight(); if(!Lw) return null;
  const kg=Lw.kg, m=(+S.profile.height)/100;
  if(!m||m<1.2) return null;
  /* bf% read independently of weight — a caliper reading logged on its own
     shouldn't be hidden just because the latest weigh-in didn't repeat it */
  const Lbf=latestField('bf'), bf=Lbf?Lbf.bf:null;
  const lbm = bf!=null ? kg*(1-bf/100) : null;
  const ffmi = lbm!=null ? lbm/(m*m) + 6.1*(1.8-m) : null;

  const tgtLbm = ARCH.ffmi*(m*m) - 6.1*(1.8-m)*(m*m);
  const tgtBf  = ARCH.bfHigh;                       // aim at the sustainable end
  const tgtKg  = tgtLbm/(1-tgtBf/100);

  const lbmGap = lbm!=null ? tgtLbm-lbm : null;      // kg of lean mass to add
  const fatKg  = bf!=null ? kg*(bf/100) : null;
  const tgtFatKg = tgtKg*(tgtBf/100);
  const fatGap = fatKg!=null ? fatKg-tgtFatKg : null;

  /* honest rates: lean mass 0.25-0.5 kg/month for an intermediate trainee,
     fat loss 0.5% bodyweight/week is the ceiling that spares muscle */
  const months = lbmGap!=null && lbmGap>0 ? Math.ceil(lbmGap/0.375) : 0;

  let phase, guide;
  if (bf==null){
    phase='measure'; guide='Log a body fat estimate on the Log tab and this becomes specific. Calipers, a smart scale, or a gym DEXA all work — consistency of method matters far more than absolute accuracy.';
  } else if (bf>tgtBf+6){
    phase='lean'; guide='Priority is fat loss while holding your lifts. Small deficit, protein high, keep training heavy. Chasing muscle gain from here mostly adds fat.';
  } else if (bf>tgtBf+2){
    phase='recomp'; guide='You are close enough to run a recomposition: eat around maintenance, push the lifts hard, and let the ratio shift. Slower than either extreme but you look better the whole way through.';
  } else if (lbmGap!=null && lbmGap>1){
    phase='build'; guide='Leanness is already there — the entire job is adding lean mass. Small surplus, progressive overload, and patience. Some fat gain alongside is normal and correct.';
  } else {
    phase='hold'; guide='You are at the archetype. From here it is maintenance and specialisation — pick a lift, a sport, or a skill and go deep rather than chasing further size.';
  }

/* ------------------------------------------------------- meal totals ----- */
const FOODIDX = (()=>{ const o={}; FOODS.forEach(f=>o[f[0]]=f); return o; })();
/* food search: [entry, originalIndex] pairs (index carried through so the
   picker never has to re-locate a row with FOODS.indexOf). Every word you type
   must appear somewhere in the name, in any order ("chicken breast grilled"
   finds "Chicken, breast, meat only, cooked, grilled"). Ranking: the whole
   phrase at the start of the name, then at the start of a word, then anywhere,
   then the any-order matches. Within a rank, per-serving entries lead the
   per-100 g USDA rows, then shorter names, then list order. */
const FOODLC = FOODS.map(f=>f[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
function foodSearch(q){
  const query=q.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (!query) return FOODS.map((f,idx)=>[f,idx]);
  const toks=query.split(/\s+/).filter(Boolean);
  const scored=[];
  for (let i=0;i<FOODS.length;i++){
    const name=FOODLC[i];
    let tier;
    const at=name.indexOf(query);
    if (at>=0) tier = at===0?0:/[^a-z0-9]/.test(name[at-1])?1:2;
    else if (toks.length>1 && toks.every(t=>name.includes(t))) tier=3;
    else continue;
    scored.push([tier, FOODS[i][5]?1:0, name.length, i]);
  }
  scored.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]||a[3]-b[3]);
  return scored.map(s=>[FOODS[s[3]],s[3]]);
}
function mealTotals(m){
  let kcal=0,p=0,c=0,f=0;
  m.slots.forEach(s=>s.items.forEach(([n,q])=>{
    const it=FOODIDX[n]; if(!it) return;
    kcal+=it[1]*q; p+=it[2]*q; c+=it[3]*q; f+=it[4]*q;
  }));
  return {kcal:Math.round(kcal),p:Math.round(p),c:Math.round(c),f:Math.round(f)};
}
/* "best fit" meal template: closest calorie match first, with a modest nudge
   toward the tag that fits today — training-day carbs on a training day (or
   any day with tagged sport activity), lean-out on a cut, otherwise rest —
   so two similarly-sized templates don't come out as a coin flip. */
function bestMeal(){
  const N=nutrition(T); if(!N) return null;
  const plan=buildDay(T);
  const wantTag = S.profile.goal==='lean' ? 'lean'
    : (plan.def.type!=='recover'||extraKcal(T)>0) ? 'training' : 'rest';
  let best=null,bs=Infinity;
  MEALS.forEach(m=>{ const t=mealTotals(m);
    const score=Math.abs(t.kcal-N.kcal)-(m.tag===wantTag?150:0);
    if(score<bs){bs=score;best=m.id;} });
  return best;
}

/* -------------------------------------------------- meal scaling --------- */
function scaleQ(q,f){ return Math.max(0.5, Math.round(q*f*2)/2); }
function mealFactor(m){
  if (typeof mealScale==='undefined' || !mealScale || openMeal!==m.id) return 1;
  const N=nutrition(T); if(!N) return 1;
  const t=mealTotals(m); if(!t.kcal) return 1;
  return clamp(N.kcal/t.kcal, 0.75, 1.6);
}
function scaledTotals(m,f){
  if (f===1) return mealTotals(m);
  let kcal=0,p=0,c=0,ff=0;
  m.slots.forEach(s=>s.items.forEach(([n,q])=>{
    const it=FOODIDX[n]; if(!it) return;
    const q2=scaleQ(q,f);
    kcal+=it[1]*q2; p+=it[2]*q2; c+=it[3]*q2; ff+=it[4]*q2;
  }));
  return {kcal:Math.round(kcal),p:Math.round(p),c:Math.round(c),f:Math.round(ff)};
}
/* committed minutes for a date, for the week-ahead overview */
function dayLoad(k){
  const items=[...(S.fixed[DOW[dowIdx(k)]]||[]), ...(S.extra[k]||[])];
  const cm=items.reduce((a,c)=>{let s=m2s(c.s),e=m2s(c.e);if(e<=s)e+=1440;return a+(e-s);},0);
  const wi=dowIdx(k);
  const def=S.swap[k]!=null?(ALLDAYS[S.swap[k]]||WEEK[wi]):WEEK[wi];

}

  if (k==='time') return fmtDur(s.t);

  if (s.d>0) bits.push(`${dIn(s.d,k)} ${dUnit(k)}`);

/* a whole session's sets as one compact line: "135 lb × 8, 8, 6" / "30 · 25 · 20 reps" */
function fmtSets(k,sets){
  if (!sets.length) return '';

  if (k==='wr' || k==='bw'){
    const groups=[];
    for (const s of sets){
      const key = s.w>0 ? fmtW(s.w) : '';
      const g=groups[groups.length-1];
      if (g && g.key===key) g.reps.push(s.r); else groups.push({key,reps:[s.r]});
    }

/* ramp up to a working weight, in display units: [[weight, reps], ...]. The bar first (barbell lifts), then about

function warmupRamp(target,E,id){
  const bar=barFor(id), step=Math.min(...platesAvail())*2, rnd=x=>Math.round(x/step)*step;
  const list=[];
  if (E.eq==='barbell'){
    if (target>=bar*1.6) list.push([bar,8]);

  } else [[.4,8],[.6,5],[.8,3]].forEach(([p,r])=>list.push([rnd(target*p),r]));
  const out=[];
  for (const [w,r] of list){
    if (w<=0 || w>=target*0.97) continue;
    if (out.length && w<out[out.length-1][0]+step*2) continue;      // a jump smaller than two steps isn't a different warm-up

/* how "good" a set is, for PR detection and for the progress line */
function exScore(k,s){

  if (k==='bw') return s.w>0 ? 1000+e1rm(s.w,s.r) : s.r;
  if (k==='time') return s.t||0;

  return fmtSet(k,s);

/* ---------- history: every set ever logged for an exercise, from any workout ---------- */
/* one pass over every custom workout builds the per-exercise lists (oldest first), so a screen with many exercise cards
   doesn't rescan the whole history for each. The lists are shared: read them, never change them. */
function histIndex(){
  return memo('histIndex',()=>{
    const ix={};
    for (const k of Object.keys(S.cust||{})){
      const sets=S.cust[k] && S.cust[k].sets; if (!sets) continue;
      for (const id in sets) if (sets[id] && sets[id].length) (ix[id]=ix[id]||[]).push({date:k,sets:sets[id]});
    }
    for (const id in ix) ix[id].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    return ix;
  });
}
function exHist(id){
  return memo('hist:'+id,()=>{
    const base=histIndex()[id]||[], keys=EXLINK_REV[id];
    if (!keys) return base;
    const by=new Map(base.map(o=>[o.date,o]));         // sets logged on a planned day count as history for the matching library exercise
    for (const k of Object.keys(S.gym||{})) for (const pk of keys){
      const s=S.gym[k] && S.gym[k][pk]; if (!s || !s.length) continue;
      const m=s.map(x=>({w:x.w,r:x.r,rpe:x.rpe,wu:x.wu})), e=by.get(k);
      by.set(k,{date:k,sets:e?e.sets.concat(m):m});
    }
    return [...by.values()].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  });
}
function lastBefore(id,date){ const h=exHist(id).filter(x=>x.date<date); return h.length?h[h.length-1]:null; }
function bestSet(id,before){
  const E=exInfo(id); let best=null,bs=-1;
  for (const h of exHist(id)) if (!before || h.date<before) for (const s of workSets(h.sets)){ const sc=exScore(E.k,s); if (sc>bs){ bs=sc; best=s; } }
  return best;
}
/* which of today's sets beat everything logged before them (needs some history, so a first-ever set isn't a "PR") */
function prFlags(id,date,sets){
  const E=exInfo(id); let best=0;
  for (const h of exHist(id)) if (h.date<date) for (const s of workSets(h.sets)) best=Math.max(best,exScore(E.k,s));
  return sets.map(s=>{ if (s.wu) return false; const sc=exScore(E.k,s); const pr=best>0 && sc>best+1e-6; if (sc>best) best=sc; return pr; });
}

/* ---------- next-weight hint for custom workouts ---------- */
/* Custom workouts prescribe nothing, so this is only a hint read off the last session's working sets (never saved, never
   applied by itself). Rules, in order: a top-weight set at RPE 9.5+ means repeat; every set at the top weight reaching
   8+ reps with no drop-off (or the top set at RPE 8 or lower) means go up; otherwise repeat and chase a rep. */
function nextWeightHint(id,vd){
  const E=exInfo(id); if (E.k!=='wr') return null;
  const last=lastBefore(id,vd); if (!last) return null;
  const ws=workSets(last.sets).filter(x=>x.w>0); if (!ws.length) return null;
  const topW=Math.max(...ws.map(x=>x.w)), top=ws.filter(x=>Math.abs(x.w-topW)<=0.3);
  const reps=top.map(x=>x.r), minR=Math.min(...reps), noDrop=top.length<2 || top[top.length-1].r>=top[0].r;
  const rpes=top.map(x=>x.rpe||0).filter(Boolean), hard=rpes.length?Math.max(...rpes):0;
  const lower=['quads','hams','glutes','lowback'].includes(E.mu) && E.eq==='barbell';
  const incKg=isImp() ? (lower?10:5)/2.20462 : (lower?5:2.5);
  const nxt=topW+incKg, rpeTxt=hard?` at RPE ${hard}`:'';
  if (hard>=9.5) return {mode:'repeat',w:topW,text:`Repeat ${fmtW(topW)}: the top set was RPE ${hard}. Own it before adding weight.`};
  if (hard && hard<=8 && minR>=5) return {mode:'up',w:nxt,text:`${fmtW(topW)} × ${reps.join(', ')}${rpeTxt}. Room to add: try ${fmtW(nxt)}.`};
  if (!hard && top.length>=2 && minR>=8 && noDrop) return {mode:'up',w:nxt,text:`${top.length} sets at ${fmtW(topW)}, all ${minR}+ reps, no drop-off. Try ${fmtW(nxt)}.`};
  return {mode:'repeat',w:topW,text:`Repeat ${fmtW(topW)} (${reps.join(', ')} last time). Add a rep before adding weight.${!hard&&minR<8?' Log RPE on heavy sets to get a go-up signal.':''}`};
}

/* ---------- search ---------- */
/* Every word you type has to match, in any order: against the name first, then the muscle/equipment words.
   Short fragments (3 letters or fewer) must be whole words at first, so "lat" finds lat pulldowns and not
   "lateral" anything; if that finds almost nothing, they're allowed to be prefixes so "squ" still works while typing. */
const EX_POP = new Set([...EX_COMMON.map(exSlug),...Object.values(EXLINK_ID)]);     // the lifts most people mean by a bare word
const EX_MUSET = Object.fromEntries(Object.entries(EX_MUALIAS).map(([k,v])=>[k,new Set((v+' '+(EX_MUL[k]||'')).toLowerCase().split(' '))]));
const EX_WORDMU = {};   // word -> the muscle groups that word names ("chest" -> chest), so "chest-supported row" isn't taken for a chest lift
Object.entries(EX_MUSET).forEach(([k,set])=>set.forEach(w=>{ (EX_WORDMU[w]=EX_WORDMU[w]||new Set()).add(k); }));
const EX_EQBOOST = {barbell:9,dumbbell:8,bodyweight:7,machine:5,cable:5,kettlebell:4,smith:3,band:1,other:0};
function exSearch(q,mu,eq){
  const toks=exTokens(q), pool=EXDB.concat(myExObjs());
  const fav=S.cpref.fav||{};
  const run=strict=>{
    const res=[];
    for (const o of pool){
      if (mu && o.mu!==mu) continue;
      if (eq && o.eq!==eq) continue;
      let nameHits=0, metaHits=0, textHits=0, foreign=false, ok=true;
      const mus=EX_MUSET[o.mu];
      for (const t of toks){
        const whole=o.h.includes(' '+t+' ');
        const inText = whole || (!(strict&&t.length<=3) && o.h.includes(' '+t)) || (t.length>=4 && o.hn.includes(t));
        if (inText){ nameHits++; textHits++; if (EX_WORDMU[t] && !EX_WORDMU[t].has(o.mu)) foreign=true; }
        else if (mus&&mus.has(t)) nameHits++;
        else if (o.m.includes(' '+t+' ') || (t.length>3 && o.m.includes(' '+t))) metaHits++;
        else { ok=false; break; }
      }
      if (!ok) continue;
      const words=o.h.trim().split(' ').length;
      let sc=100+nameHits*10-metaHits*25-Math.max(0,words-toks.length)*3-o.n.length*0.05+(EX_EQBOOST[o.eq]||0);
      if (toks.length){
        if (o.h.startsWith(' '+toks[0])) sc+=12;
        if (o.h.trim()===toks.join(' ')) sc+=200;
      }
      if (EX_POP.has(o.id)) sc+=(!foreign && (textHits || (o.mu!=='combat' && toks.length && toks.every(t=>mus&&mus.has(t)))))?30:8;
      if (fav[o.id]) sc+=15;
      if (o.my) sc+=10;
      res.push([o,sc]);
    }
    res.sort((a,b)=>b[1]-a[1]||a[0].n.length-b[0].n.length);
    return res.map(r=>r[0]);
  };
  let out=run(true);
  if (out.length<8 && toks.some(t=>t.length<=3)){
    const seen=new Set(out.map(o=>o.id)); out=out.concat(run(false).filter(o=>!seen.has(o.id)));
  }
  return out;
}

/* ---------- supersets ---------- */
/* cw.sup[id] = true means "this exercise is paired with the one right after it". Consecutive linked exercises form a group
   (a pair, or a circuit): you alternate between them and the rest timer waits for the last one. Reordering or removing an
   exercise unlinks around it, so a link can never silently point at a different neighbour. */
function ssGroups(cw){
  const out=[]; let cur=[];
  cw.items.forEach((id,i)=>{ cur.push(id); if (!(cw.sup[id] && i<cw.items.length-1)){ out.push(cur); cur=[]; } });
  return out;
}
function ssOf(cw,id){ const g=ssGroups(cw).find(x=>x.includes(id)); return g&&g.length>1?g:null; }
function ssUnlinkAround(cw,ids){ ids.forEach(id=>{ const i=cw.items.indexOf(id); delete cw.sup[id]; if (i>0) delete cw.sup[cw.items[i-1]]; }); }

function ssCopy(cw,srcSup,srcItems){
  cw.sup={};
  (srcItems||[]).forEach((id,i)=>{ if (srcSup&&srcSup[id] && cw.items.includes(id) && cw.items[cw.items.indexOf(id)+1]===srcItems[i+1]) cw.sup[id]=true; });
}

function restStart(sec){
  if (!(sec>0)) return;
  if (S.cpref.restSound!==false) tmrCtx();

  clearInterval(restIv); restIv=setInterval(restTick,400);
}
function restTick(){
  if (!rest){ clearInterval(restIv); return; }
  const left=Math.ceil((rest.end-Date.now())/1000);
  const t=document.getElementById('restt'), f=document.getElementById('restfill'), b=document.getElementById('restbar');
  if (!rest.done && left<=0){
    rest.done=true; rest.doneAt=Date.now();
    if (Date.now()-rest.end<3000) restAlert();           // a phone that slept through the rest shouldn't ring when it wakes
    if (b) b.classList.add('done');
    const l=b&&b.querySelector('.restl'); if (l) l.textContent='REST OVER';
    if (t) t.textContent='GO'; if (f) f.style.width='100%';
    return;
  }
  if (rest.done){
    if (Date.now()-rest.doneAt>6000){          // drop the bar in place: a full render here would steal focus from a set being typed
      rest=null; clearInterval(restIv); if (b) b.remove();
      const tt=document.querySelector('.toast'); if (tt) tt.style.bottom='';
    }
    return;
  }
  if (t) t.textContent=fmtDur(left);
  if (f) f.style.width=clamp((1-left/rest.total)*100,0,100)+'%';
}

/* ---------- barbell + plates ---------- */
/* The bar and the plates a gym actually has vary (35 lb women's bar, EZ-curl bar, no 35s, a 15 kg plate pair...), so
   both are settings: one default bar and plate set per unit system, plus an optional bar for a single exercise. */
const PLATE_ALL = {imperial:[100,55,45,35,25,15,10,5,2.5,1.25], metric:[25,20,15,10,5,2.5,1.25,0.5]};
const PLATE_DEF = {imperial:[45,35,25,10,5,2.5], metric:[25,20,15,10,5,2.5,1.25]};
const BAR_CHOICES = {imperial:[45,35,25,15], metric:[20,15,10,25]};
const BAR_DEF = {imperial:45, metric:20};
const unitKey = () => isImp()?'imperial':'metric';
function barFor(id){
  const u=unitKey(), ex=id&&(S.cpref.barEx||{})[id]&&S.cpref.barEx[id][u];
  if (ex>0) return ex;
  const b=(S.cpref.bar||{})[u]; return b>0?b:BAR_DEF[u];
}
function platesAvail(){
  const u=unitKey(), p=(S.cpref.plates||{})[u];
  return (Array.isArray(p)&&p.length?p:PLATE_DEF[u]).filter(x=>x>0).slice().sort((a,b)=>b-a);
}
/* fewest plates that make `side` exactly, or the heaviest load under it that the plates can reach (a greedy pass
   gets e.g. 50 per side wrong when the gym has 25s but no 10s) */
function platePlan(side,plates){
  const sc=4, top=Math.floor(side*sc+1e-6), ps=plates.map(x=>Math.round(x*sc));
  const dp=new Array(top+1).fill(Infinity), from=new Array(top+1).fill(-1); dp[0]=0;
  for (let i=1;i<=top;i++) for (let j=0;j<ps.length;j++){ const q=ps[j]; if (q>0 && q<=i && dp[i-q]+1<dp[i]){ dp[i]=dp[i-q]+1; from[i]=j; } }
  let best=top; while (best>0 && dp[best]===Infinity) best--;
  const used=[]; for (let i=best;i>0;i-=ps[from[i]]) used.push(plates[from[i]]);
  return {used:used.sort((a,b)=>b-a), loaded:best/sc};
}
function platesText(w,id){
  if (w==null || w<=0) return '';
  const bar=barFor(id), u=wUnit();
  const side=(w-bar)/2; if (side<0) return `Under bar weight (${trimNum(bar)} ${u}).`;
  const {used,loaded}=platePlan(side,platesAvail()), short=side-loaded;
  if (!used.length) return short>0.01 ? `Just the bar (${trimNum(bar)} ${u}) + ${trimNum(short)} per side, smaller than any plate you have.` : `Just the bar (${trimNum(bar)} ${u}).`;
  /* spell out the sum so it can be checked at a glance: bar + 2 x one side = the weight typed */
  return `${trimNum(bar)} ${u} bar + ${used.join(' + ')} per side = ${trimNum(bar+2*loaded)} ${u}${short>0.01?` (${trimNum(short)} per side short of ${trimNum(w)})`:''}`;
}

function histHTML(id,vd,E){
  const h=exHist(id).filter(x=>x.date<=vd);
  if (!h.length) return `<div class="note" style="margin-top:10px;border:1px solid var(--rule)">Nothing logged yet.</div>`;
  const pts=h.map(x=>Math.max(...(workSets(x.sets).length?workSets(x.sets):x.sets).map(s=>exScore(E.k,s))));
  const lines=h.slice(-8).reverse().map(x=>`<div class="histrow"><span>${esc(shortDate(x.date))}</span><span>${esc(fmtSets(E.k,x.sets))}</span></div>`).join('');
  return `<div class="histbox"><div class="eyebrow" style="margin-bottom:6px">PROGRESS · BEST SET PER SESSION</div>
    ${sparkline(pts,'#E0A03A',70)}${lines}</div>`;
}

/* ---------- water ---------- */
/* Logged per day in millilitres (d.water). The daily target is the Fuel tab's 40 ml per kg of bodyweight; it needs a
   weigh-in, but logging works without one. US units add in 8 and 16 oz steps, metric in 250 and 500 ml. */
const ML_OZ=29.5735;
const WATER_STEPS=()=>isImp()?[['8 oz',8*ML_OZ],['16 oz',16*ML_OZ]]:[['250 ml',250],['500 ml',500]];
const waterShow=ml=>isImp()?`${Math.round(ml/ML_OZ)} oz`:(ml>=1000?`${Math.round(ml/100)/10} L`:`${Math.round(ml)} ml`);
function WaterRow(d,N){
  const ml=d.water||0, target=N?+N.water*1000:0, pct=target?clamp(ml/target*100,0,100):0;
  const [small,big]=WATER_STEPS();
  return `<div class="fb" style="padding:2px 13px 13px"><div class="fbtop"><span>WATER</span><span style="color:var(--text)">${waterShow(ml)}${target?`<span style="color:var(--faint)"> / ${waterShow(target)}</span>`:''}</span></div>
    ${target?`<div class="bar"><div class="barfill" id="waterfill" style="width:${pct}%;background:${ml>=target?'var(--moss)':'var(--steel)'}"></div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:9px">
      <button class="chip" data-act="water" data-v="${-Math.round(small[1])}" aria-label="Remove ${small[0]} of water" ${ml>0?'':'disabled'}>−</button>
      <button class="chip on" data-act="water" data-v="${Math.round(small[1])}" aria-label="Add ${small[0]} of water">+ ${small[0]}</button>
      <button class="chip on" data-act="water" data-v="${Math.round(big[1])}" aria-label="Add ${big[0]} of water">+ ${big[0]}</button></div></div>`;

/* ---------- share a workout as plain text ---------- */
/* One line per exercise, warm-ups marked, RPE and PRs inline, then a totals line. Pastes cleanly into a message or a note. */
function workoutSummary(date){
  const cw=S.cust[date]; if (!cw) return '';
  const lines=[`${cw.name||'Workout'} · ${longDate(date)}`];
  const done=cw.items.filter(id=>(cw.sets[id]||[]).length);
  for (const id of done){
    const E=exInfo(id), ss=cw.sets[id], prs=prFlags(id,date,ss);
    const parts=ss.map((x,i)=>fmtSet(E.k,x)+(x.wu?' (warm-up)':'')+(prs[i]?' ★PR':''));
    lines.push(`${E.n}${ssOf(cw,id)?' (superset)':''}: ${parts.join(', ')}`);
  }
  const fights=(S.fights[date]||[]);
  for (const f of fights) lines.push(`${FIGHT_L[f.disc]||'Session'}: ${fmtMin(f.min)}${f.rounds?` · ${f.rounds} rounds`:''}${f.rpe?` · effort ${f.rpe}/10`:''}`);
  const st=cwStats(cw), bits=[];
  if (st.ex) bits.push(`${st.ex} lift${st.ex>1?'s':''}`);
  if (st.sets) bits.push(`${st.sets} set${st.sets>1?'s':''}`);
  if (st.vol>0) bits.push(`${fmtVol(st.vol)} moved`);
  if (cw.t0&&cw.t1) bits.push(`${Math.max(1,Math.round((cw.t1-cw.t0)/60000))} min`);
  if (bits.length) lines.push('', bits.join(' · '));
  if ((cw.note||'').trim()) lines.push('', cw.note.trim());
  return lines.join('\n');
}
/* the share sheet where there is one (phones), otherwise the clipboard */
async function shareText(title,text){
  try{
    if (navigator.share){ await navigator.share({title,text}); return; }
  }catch(e){ if (e && e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied. Paste it anywhere.'); }
  catch(e){ toast("Couldn't copy that"); }
}

/* a built-in (planned) session on a date: lifts logged against the program and/or planned blocks ticked off */
function progSession(k){
  const g=S.gym[k]||{}, d=S.days[k], def=dayDef(k);
  const lifts=Object.keys(g).filter(ex=>EXS[ex]&&workSets(g[ex]).length);
  const blocks=d&&d.blocks?def.blocks.filter(b=>d.blocks[b.id]):[];
  if (!lifts.length && !(blocks.length && ['strength','strike','ground','engine'].includes(def.type))) return null;
  let sets=0, vol=0;
  for (const ex of lifts){ const s=workSets(g[ex]); sets+=s.length; for (const x of s) vol+=(x.w||0)*(x.r||0); }
  return {def,lifts,blocks,sets,vol};
}

  const keys=[...new Set([...Object.keys(S.cust),...Object.keys(S.days),...Object.keys(S.gym)])].sort().reverse();

/* ---------- actions: every data-act that starts with w-, f- or wl- ---------- */
function wAct(a,v,v2,el){

      if (v==='last'){ const k=lastCustBefore(vd); if (k) ssCopy(cw,S.cust[k].sup,S.cust[k].items); }
      else if (v.startsWith('rt:')){ const r=(S.routines||[]).find(x=>x.id===v.slice(3)); if (r) ssCopy(cw,r.sup,r.items); }

    case 'w-min': if (cw){ cw.min=!cw.min; commit(); } return;
    case 'w-mode': if (cw){ cw.mode=v==='replace'?'replace':'with'; commit(); } return;
    case 'w-rest': S.cpref.rest=+v||0; commit(); return;
    case 'w-exbar': {
      const u=unitKey(), ch=BAR_CHOICES[u].filter(x=>x!==barFor()), o=S.cpref.barEx[v]=S.cpref.barEx[v]||{}, cur=o[u]>0?o[u]:null;

    case 'w-hist': cwHist=cwHist===v?null:v; return;
    case 'w-ss': {

    }
    case 'f-rpe': if (fdraft) fdraft.rpe=fdraft.rpe===+v?0:+v; return;
    case 'f-partner': if (fdraft){ const cur=String(fdraft.partner||'').split(',').map(x=>x.trim()).filter(Boolean); if (!cur.includes(v)) cur.push(v); fdraft.partner=cur.join(', '); } return;
    case 'f-save': {
      if (!fdraft) return;
      if (!fdraft.disc){ toast('Pick what you trained'); return 'norender'; }
      const min=Math.round(num(fdraft.min)||0);
      if (min<1){ toast('Enter the minutes'); return 'norender'; }
      const rec={id:fightEdit!=null&&S.fights[vd][fightEdit]?S.fights[vd][fightEdit].id:Date.now().toString(36),

        partner:String(fdraft.partner||'').split(',').map(x=>x.trim()).filter(Boolean).join(', ')};
      if (!S.fights[vd]) S.fights[vd]=[];
      if (fightEdit!=null && S.fights[vd][fightEdit]) S.fights[vd][fightEdit]=rec; else S.fights[vd].push(rec);
      fightOpen=false; fightEdit=null; fdraft=null; commit(); toast(`${FIGHT_L[rec.disc]} logged — ${fmtMin(min)}`); return;
    }
    case 'f-edit': {
      const f=(S.fights[vd]||[])[+v]; if (!f) return;
      fightOpen=true; fightEdit=+v;
      fdraft={disc:f.disc,min:String(f.min||''),rounds:f.rounds?String(f.rounds):'',rpe:f.rpe||0,worked:f.worked||'',caught:f.caught||'',partner:f.partner||''};
      return;
    }
    case 'f-del': {
      if (!S.fights[vd]) return;
      if (armFight!==+v){ armFight=+v; toast('Tap the X again to delete this session'); return 'norender'; }
      S.fights[vd].splice(+v,1); if (!S.fights[vd].length) delete S.fights[vd]; armFight=null; commit(); return;
    }

    /* ---- history screen ---- */
    case 'wl-sub': wlSub=v; wlOpenEx=null; wlOpenDay=null; armDiscard=false; window.scrollTo(0,0); return;
    case 'wl-more': wlLim+=60; return;
    case 'wl-day': wlOpenDay=wlOpenDay===v?null:v; armDiscard=false; return;
    case 'wl-ex': wlOpenEx=wlOpenEx===v?null:v; armDiscard=false; return;
    case 'wl-repeat': {
      const src=S.cust[v]; if (!src) return;
      if (!S.cust[vd]) S.cust[vd]=newCW('with');
      const t=S.cust[vd]; if (!t.name) t.name=src.name||'';
      const fresh=!t.items.length;
      src.items.forEach(id=>{ if (!t.items.includes(id)) t.items.push(id); });
      if (fresh) ssCopy(t,src.sup,src.items);
      t.min=false; view='today'; cwOpen=t.items[0]||null; commit(); window.scrollTo(0,0); toast('Workout loaded — benchmarks are filled in'); return;
    }
    case 'wl-delday': {
      if (wlOpenDay===v && armDiscard){ delete S.cust[v]; wlOpenDay=null; armDiscard=false; commit(); toast('Workout deleted'); return; }
      armDiscard=true; wlOpenDay=v; toast('Tap DELETE again to confirm'); return;
    }
    case 'wl-use': {
      const r=(S.routines||[]).find(x=>x.id===v); if (!r) return;
      if (!S.cust[vd]) S.cust[vd]=newCW('with');
      const t=S.cust[vd]; if (!t.name) t.name=r.name;
      const fresh=!t.items.length;
      r.items.forEach(id=>{ if (!t.items.includes(id)) t.items.push(id); });
      if (fresh) ssCopy(t,r.sup,r.items);
      t.min=false; view='today'; cwOpen=t.items[0]||null; commit(); window.scrollTo(0,0); toast(`${r.name} loaded`); return;
    }
    case 'wl-rtdel': S.routines=S.routines.filter(r=>r.id!==v); commit(); toast('Routine deleted'); return;
  }
}

/* Real quotes from real athletes. Quote lists online are full of misattributions, so each entry carries where it
   comes from and how solid that is (the tiers are explained at the top of quotes-db.js):
     sourced    - traced to a dated, identifiable origin (an ad, a news story, a video, a book title)
     reported   - credible secondary source, original not confirmed
     attributed - widely credited to them, but I found no original source: treat the wording as approximate
   Add your own favourites in the app; if you find a better source for one of these, fix its `src` here. */
const QUOTE_TIER = {sourced:['SOURCED','var(--moss)'],reported:['REPORTED','var(--steel)'],attributed:['ATTRIBUTED','var(--faint)']};
/* The quotes themselves live in quotes-db.js (REAL_QUOTES, grouped by athlete in QLIB). Here: how they are picked. */
const QUOTES = typeof REAL_QUOTES!=='undefined' ? REAL_QUOTES : [];
const QCAT_LABEL = typeof QCATS!=='undefined' ? QCATS : {};

let briefEdit=false, briefBrowse=false, briefQ='', briefCat='all', briefLim=15;

function strHash(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
/* did anything set a record in the last two days? program lifts write S.prs; custom sets are checked with prFlags */
function recentPR(){
  const since=dkey(-1);
  if (Object.values(S.prs||{}).some(p=>p&&p.date>=since)) return true;
  for (const k of [dkey(-1),T]){ const cw=S.cust[k]; if (!cw) continue;
    for (const id of cw.items){ const s=cw.sets[id]||[]; if (s.length && prFlags(id,k,s).some(Boolean)) return true; } }
  return false;
}
function briefTag(){
  const plan=buildDay(T), type=plan.def.type, st=streak(), nowH=new Date().getHours();
  if (typeof campDaysOut==='function'){ const d=campDaysOut(); if (d!=null && d>=0 && d<=56) return 'camp'; }
  if (recentPR()) return 'pr';
  if ([7,14,21,30,50,60,75,100,150,200,365].includes(st) && dayScore(T)>0.08) return 'milestone';
  if (st>0 && nowH>=18 && dayScore(T)<=0.08) return 'streakRisk';
  if (daysSinceStart()>=2 && dayScore(dkey(-1))<=0.08 && dayScore(dkey(-2))<=0.08 && daysLogged()>0) return 'comeback';
  if (deloadActive()) return 'deload';
  if (daysLogged()<7 && daysSinceStart()<10) return 'firstWeek';
  if (typeof chDay==='function'){ const c=chDay(); if (c!=null && c>=1 && c<=90 && strHash(T)%3===0) return 'challenge'; }
  if ((S.fights[T]||[]).length || type==='strike' || type==='ground' || type==='engine') return 'fight';
  if (type==='strength' || (S.cust[T]&&S.cust[T].items.length)) return 'lift';
  if (type==='craft' || type==='recover') return 'craft';
  return 'general';
}
/* The pool for a tag, shuffled once (stable) and then spread so the same athlete never sits next to themselves.
   Walking through it one step a day means nothing repeats until the whole pool has been seen. */
const qOrderCache={};
function qEnabled(){
  const off=S.motiv.qoff||[], solid=!!S.motiv.qsolid;
  return QUOTES.filter(r=>!off.includes(r.cat) && !(solid && r.t==='attributed'));
}
function qPool(tag){
  const en=qEnabled(); if (!en.length) return [];
  const key=tag+'|'+(S.motiv.qoff||[]).join(',')+'|'+(S.motiv.qsolid?1:0);
  if (qOrderCache[key]) return qOrderCache[key];
  let list=en.filter(r=>r.tags.includes(tag));
  if (list.length<8) list=list.concat(en.filter(r=>r.tags.includes('general')&&!list.includes(r)));
  if (!list.length) list=en;
  const rest=list.slice().sort((a,b)=>strHash(a.id+tag)-strHash(b.id+tag)), out=[];
  while (rest.length){
    const last=out.length?out[out.length-1].who:'', i=Math.max(0,rest.findIndex(r=>r.who!==last));
    out.push(rest.splice(i,1)[0]);
  }
  return (qOrderCache[key]=out);
}
function briefLine(tag){
  const d0=S.days[T]||{}, qmode=S.motiv.qmode||'mix';
  if (typeof d0.bPin==='string'){ const r=QUOTES.find(x=>x.id===d0.bPin); if (r) return {t:r.q,quote:r}; }
  if (qmode!=='off'){
    const pool=qPool(tag), shift0=d0.bShift||0;
    const pct=tag==='general'?60:75;
    if (pool.length && (qmode==='only' || (strHash(T+'q')+shift0*37)%100<pct)){
      const r=pool[(daysBetween('2024-01-01',T)+shift0)%pool.length]; return {t:r.q,quote:r};
    }
  }
  const mine=(S.motiv.quotes||[]).filter(q=>q&&q.trim());
  const pool=(BRIEF_LINES[tag]||BRIEF_LINES.general).map(t=>({t,mine:false}))
    .concat(mine.map(t=>({t,mine:true})));
  const shift=(S.days[T]&&S.days[T].bShift)||0;
  /* general days lean on your own quotes more: they're the ones that hit hardest */
  if (mine.length && tag==='general' && (strHash(T+'m')+shift)%3===0) return {t:mine[(strHash(T)+shift)%mine.length],mine:true};
  return pool[(strHash(T+tag)+shift)%pool.length];
}

}
function bAct(a,v){
  const d=day(T);
  switch(a){
    case 'b-col': d.bCol=d.bCol===false; commit(); return;
    case 'b-next': d.bShift=(d.bShift||0)+1; delete d.bPin; commit(); return;
    case 'b-qmode': S.motiv.qmode=v; delete d.bPin; commit(); return;
    case 'b-browse': briefBrowse=!briefBrowse; return;
    case 'b-qcat': { const o=S.motiv.qoff, i=o.indexOf(v); if (i>=0) o.splice(i,1); else o.push(v); delete d.bPin; commit(); return; }
    case 'b-qsolid': S.motiv.qsolid=!S.motiv.qsolid; delete d.bPin; commit(); return;
    case 'b-bcat': briefCat=v; briefLim=15; return;
    case 'b-more': briefLim+=20; return;
    case 'b-pin': if (d.bPin===v) delete d.bPin; else d.bPin=v; commit(); return;
    case 'b-edit': briefEdit=true; d.bCol=false; return;
    case 'b-done': briefEdit=false; commit(); return;
    case 'b-addq': { const el=document.getElementById('b_q'), q=(el&&el.value||'').trim();
      if (!q){ toast('Type a line first'); return 'norender'; }
      S.motiv.quotes.push(q); commit(); toast('Added to your rotation'); return; }
    case 'b-rmq': S.motiv.quotes.splice(+v,1); commit(); return;
    case 'b-addl': {
      const l=(document.getElementById('b_ll')||{}).value||'', u=((document.getElementById('b_lu')||{}).value||'').trim();
      if (!/^https?:\/\/\S+\.\S+/i.test(u)){ toast('Paste a full link starting with https://'); return 'norender'; }
      S.motiv.links.push({label:l.trim()||'Play',url:u}); commit(); toast('Play button added'); return; }
    case 'b-rml': S.motiv.links.splice(+v,1); commit(); return;
    case 'b-open': { const l=S.motiv.links[+v]; if (l&&/^https?:\/\//i.test(l.url)) window.open(l.url,'_blank','noopener'); return 'norender'; }
  }
}

/* =========================================================== round timer == */
/* Gym-style interval timer. Time is always derived from Date.now() against a scheduled end, never from
   counting ticks, so a throttled/backgrounded tab can't drift: when it wakes up it simply catches up through
   however many phases elapsed. Sound is synthesized (no audio files): a struck bell for round start, three
   for round end, wooden clapper for the warning, short pips counting down the rest. */
const TMR_PRESETS = [
  ['boxing','Boxing',3,180,60,10,'boxing'],['pro','Pro boxing',12,180,60,10,'boxing'],['muaythai','Muay Thai',5,180,120,10,'muaythai'],
  ['mma','MMA',3,300,60,10,'mma'],['mma5','MMA 5×5',5,300,60,10,'mma'],['bjj','BJJ rolls',6,360,60,30,'bjj'],
  ['wrestling','Wrestling',3,120,30,10,'wrestling'],['bag','Bag rounds',6,180,30,10,'pads'],['tabata','Tabata',8,20,10,3,'conditioning'],
  ['custom','Custom',null,null,null,null,'other']];
const TMR_PREP = 10;
let tmrOpen=false, tmrIv=null, tmrAudio=null, tmrLock=null,
    tmr={phase:'idle',round:1,end:0,remain:0,paused:false,warned:false,lastPip:-1,t0:0,from:null};

function tmrCfg(){
  const pr=S.tpref||{}, p=TMR_PRESETS.find(x=>x[0]===pr.preset)||TMR_PRESETS[0];
  if (p[0]==='custom'){ const c=pr.custom||{}; return {id:'custom',label:'Custom',rounds:c.rounds||3,work:c.work||180,rest:c.rest??60,warn:c.warn??10,disc:c.disc||'other'}; }
  return {id:p[0],label:p[1],rounds:p[2],work:p[3],rest:p[4],warn:p[5],disc:p[6]};
}
function tmrTotal(c){ return c.rounds*c.work+Math.max(0,c.rounds-1)*c.rest; }

/* ---------- sound ---------- */
function tmrCtx(){
  try{
    if (!tmrAudio){ const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return null; tmrAudio=new AC(); }
    if (tmrAudio.state==='suspended') tmrAudio.resume();
    return tmrAudio;
  }catch(e){ return null; }
}
function tmrBell(n){
  const ac=tmrCtx(); if (!ac) return;
  for (let k=0;k<n;k++){
    const t0=ac.currentTime+k*0.42;
    /* inharmonic partials are what make it read as metal rather than a beep */
    [[523,0.55],[1046,0.28],[1569,0.18],[2350,0.12],[3140,0.07]].forEach(([f,g])=>{
      const o=ac.createOscillator(), v=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      v.gain.setValueAtTime(0.0001,t0); v.gain.exponentialRampToValueAtTime(g,t0+0.005); v.gain.exponentialRampToValueAtTime(0.0001,t0+1.6);
      o.connect(v).connect(ac.destination); o.start(t0); o.stop(t0+1.65);
    });
  }
}
function tmrClack(n){
  const ac=tmrCtx(); if (!ac) return;
  for (let k=0;k<n;k++){
    const t0=ac.currentTime+k*0.16, len=0.05;
    const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*len),ac.sampleRate), d=buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);
    const src=ac.createBufferSource(), bp=ac.createBiquadFilter(), g=ac.createGain();
    src.buffer=buf; bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=3; g.gain.value=0.9;
    src.connect(bp).connect(g).connect(ac.destination); src.start(t0);
  }
}
function tmrPip(hi){
  const ac=tmrCtx(); if (!ac) return;
  const o=ac.createOscillator(), v=ac.createGain(), t0=ac.currentTime;
  o.type='square'; o.frequency.value=hi?1320:880;
  v.gain.setValueAtTime(0.0001,t0); v.gain.exponentialRampToValueAtTime(0.12,t0+0.005); v.gain.exponentialRampToValueAtTime(0.0001,t0+0.15);
  o.connect(v).connect(ac.destination); o.start(t0); o.stop(t0+0.16);
}
const tmrBuzz = p => { try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };

/* ---------- wake lock: keep the screen on while rounds are running ---------- */
async function tmrWake(on){
  try{
    if (on && 'wakeLock' in navigator && !tmrLock){ tmrLock=await navigator.wakeLock.request('screen'); tmrLock.addEventListener('release',()=>{ tmrLock=null; }); }
    if (!on && tmrLock){ await tmrLock.release(); tmrLock=null; }
  }catch(e){ tmrLock=null; }
}
document.addEventListener('visibilitychange',()=>{
  if (document.visibilityState==='visible' && tmrOpen && ['prep','work','rest'].includes(tmr.phase) && !tmr.paused) tmrWake(true);
});

/* ---------- engine ---------- */
function tmrDur(phase,c){ return (phase==='prep'?TMR_PREP:phase==='work'?c.work:c.rest)*1000; }
function tmrStart(){
  const c=tmrCfg(); tmrCtx();
  tmr={phase:'prep',round:1,end:Date.now()+TMR_PREP*1000,remain:0,paused:false,warned:false,lastPip:-1,t0:Date.now(),from:tmr.from,cfg:c,workSec:null};
  clearInterval(tmrIv); tmrIv=setInterval(tmrTick,100); tmrWake(true); tmrPip(false);
}
/* move to the next phase; `quiet` when catching up after the tab slept so we don't fire a burst of bells */
function tmrAdvance(quiet){
  const c=tmr.cfg;
  if (tmr.phase==='prep'){ tmr.phase='work'; if(!quiet){ tmrBell(1); tmrBuzz([300]); } }
  else if (tmr.phase==='work'){
    if (tmr.round>=c.rounds){ tmrFinish(quiet); return; }
    tmr.phase=c.rest>0?'rest':'work'; if (!c.rest) tmr.round++;
    if(!quiet){ tmrBell(c.rest>0?3:1); tmrBuzz([200,100,200,100,200]); }
  }
  else if (tmr.phase==='rest'){ tmr.phase='work'; tmr.round++; if(!quiet){ tmrBell(1); tmrBuzz([300]); } }
  tmr.end+=tmrDur(tmr.phase,c); tmr.warned=false; tmr.lastPip=-1;
}
function tmrFinish(quiet){
  tmr.phase='done'; tmr.doneAt=Date.now(); clearInterval(tmrIv); tmrWake(false);
  if (!quiet){ tmrBell(3); tmrBuzz([400,150,400,150,600]); }
  render();
}
function tmrTick(){
  if (!tmrOpen || tmr.paused || !['prep','work','rest'].includes(tmr.phase)) return;
  let now=Date.now(), changed=false, guard=0;
  while (now>=tmr.end && tmr.phase!=='done' && guard++<500){ const behind=now-tmr.end>1500; tmrAdvance(behind); changed=true; }
  if (tmr.phase==='done') return;
  const left=tmr.end-now, c=tmr.cfg, sec=Math.ceil(left/1000);
  if (tmr.phase==='work' && c.warn>0 && !tmr.warned && left<=c.warn*1000 && c.work>c.warn){ tmr.warned=true; tmrClack(2); tmrBuzz([80,60,80]); }
  if ((tmr.phase==='rest'||tmr.phase==='prep') && sec<=3 && sec>=1 && tmr.lastPip!==sec){ tmr.lastPip=sec; tmrPip(false); }
  if (changed){ render(); return; }
  tmrPaint(left);
}
function tmrPaint(left){
  const t=document.getElementById('tmr_t'), bar=document.getElementById('tmr_bar'), ov=document.querySelector('.tmr');
  if (!t) return;
  t.textContent=fmtDur(Math.ceil(left/1000));
  const dur=tmrDur(tmr.phase,tmr.cfg); if (bar) bar.style.width=clamp((1-left/dur)*100,0,100)+'%';
  if (ov) ov.classList.toggle('warn', tmr.phase==='work' && tmr.cfg.warn>0 && left<=tmr.cfg.warn*1000);
}

/* ---------- UI ---------- */
function TimerOverlay(){
  if (!tmrOpen) return '';
  const c=tmr.phase==='idle'?tmrCfg():tmr.cfg;
  if (tmr.phase==='idle'){
    const pr=S.tpref||{}, isC=(pr.preset||'boxing')==='custom';
    const stepper=(f,label,val,fmt)=>`<div class="tst"><div class="sfl">${label}</div><div class="sfi">
        <button class="stp" data-act="t-adj" data-v="${f}" data-v2="-1" aria-label="Less ${label}">−</button>
        <span class="tval">${fmt(val)}</span>
        <button class="stp" data-act="t-adj" data-v="${f}" data-v2="1" aria-label="More ${label}">+</button></div></div>`;
    return `<div class="tmr idle" role="dialog" aria-label="Round timer">
      <div class="sheethead"><div><div class="eyebrow">ROUND TIMER</div><div class="sheetsub">${c.rounds} × ${fmtDur(c.work)}${c.rest?` · ${fmtDur(c.rest)} rest`:''} · ${fmtDur(tmrTotal(c))} total</div></div>
        <button class="chip on" data-act="t-close">CLOSE</button></div>
      <div class="sheetbody" style="padding:14px var(--pad)">
        <div class="eyebrow" style="margin-bottom:8px">PRESET</div>
        <div class="chips" style="padding:0">${TMR_PRESETS.map(p=>`<button class="chip ${(pr.preset||'boxing')===p[0]?'on':''}" data-act="t-preset" data-v="${p[0]}">${p[1]}</button>`).join('')}</div>
        <div class="tgrid">
          ${stepper('rounds','ROUNDS',c.rounds,v=>v)}
          ${stepper('work','ROUND',c.work,fmtDur)}
          ${stepper('rest','REST',c.rest,fmtDur)}
          ${stepper('warn','WARNING',c.warn,v=>v?v+'s':'off')}
        </div>
        ${isC?'':'<div class="note" style="padding:8px 0 0;border:none">Change any number and it becomes your Custom preset.</div>'}
        <div class="note" style="padding:10px 0 0;border:none">Bell to start a round, three bells to end it, clapper for the warning. If your iPhone's silent switch is on, the bells can be muted, so flip it off before you start. The screen stays awake while it runs, and it vibrates on every bell.</div>
      </div>
      <div class="sheetfoot"><button class="btn" data-act="t-start" style="padding:18px;font-size:var(--fs-title)">${svg('play',14,'var(--ink)')} START</button></div></div>`;
  }
  if (tmr.phase==='done'){
    const total=Math.round(((tmr.doneAt||Date.now())-tmr.t0)/1000)-TMR_PREP;
    const ex=tmr.from&&tmr.from.kind==='ex'?exInfo(tmr.from.id):null;
    return `<div class="tmr done" role="dialog" aria-label="Round timer finished">
      <div class="tbig"><div class="tphase">DONE</div><div class="ttime" style="font-size:64px">${c.rounds} ROUNDS</div>
        <div class="tround">${fmtDur(tmr.workSec!=null?tmr.workSec:c.rounds*c.work)} of work · ${fmtDur(Math.max(0,total))} total</div></div>
      <div class="tctl col">
        ${ex?`<button class="btn" data-act="t-logex">LOG AS A SET OF ${esc(ex.n.toUpperCase())}</button>`
            :`<button class="btn" data-act="t-logfight">LOG AS A FIGHT SESSION</button>`}
        <div style="display:flex;gap:8px"><button class="btn ghost" data-act="t-again" style="flex:1">AGAIN</button>
          <button class="btn ghost" data-act="t-close" style="flex:1">CLOSE</button></div></div></div>`;
  }
  const left=tmr.paused?tmr.remain:Math.max(0,tmr.end-Date.now());
  const ph={prep:'GET READY',work:'FIGHT',rest:'REST'}[tmr.phase];
  return `<div class="tmr ${tmr.phase} ${tmr.paused?'paused':''}" role="dialog" aria-label="Round timer running">
    <div class="ttop"><span>${esc(c.label.toUpperCase())}</span><button class="chip" data-act="t-stop">END</button></div>
    <div class="tbig"><div class="tphase">${tmr.paused?'PAUSED':ph}</div>
      <div class="ttime" id="tmr_t">${fmtDur(Math.ceil(left/1000))}</div>
      <div class="tround">${tmr.phase==='prep'?`${c.rounds} rounds coming`:`ROUND ${tmr.round} OF ${c.rounds}`}</div>
      <div class="tbarw"><div class="tbar" id="tmr_bar" style="width:${clamp((1-left/tmrDur(tmr.phase,c))*100,0,100)}%"></div></div>
      <div class="tdots">${Array.from({length:c.rounds},(_,i)=>`<span class="${i+1<tmr.round||(i+1===tmr.round&&tmr.phase==='rest')?'on':i+1===tmr.round&&tmr.phase==='work'?'cur':''}"></span>`).join('')}</div></div>
    <div class="tctl">
      <button class="btn ghost" data-act="t-skip" style="flex:1">SKIP ${svg('chev',12)}</button>
      <button class="btn" data-act="t-pause" style="flex:2;padding:20px">${tmr.paused?'RESUME':'PAUSE'}</button></div></div>`;
}
function tmrOpenFor(from){ tmrOpen=true; tmr={phase:'idle',round:1,end:0,remain:0,paused:false,warned:false,lastPip:-1,t0:0,from:from||null}; }
function tAct(a,v,v2){
  if (!S.tpref) S.tpref={preset:'boxing',custom:{}};
  switch(a){
    case 't-open': tmrOpenFor(null); return;
    case 't-openex': tmrOpenFor({kind:'ex',id:v}); return;
    case 't-close': clearInterval(tmrIv); tmrWake(false); tmrOpen=false; tmr.phase='idle'; return;
    case 't-preset': S.tpref.preset=v; commit(); return;
    case 't-adj': {
      const c=tmrCfg(), step={rounds:1,work:c.work>=120?30:10,rest:c.rest>=60?15:5,warn:5}[v], lim={rounds:[1,30],work:[10,1200],rest:[0,600],warn:[0,60]}[v];
      const cur={rounds:c.rounds,work:c.work,rest:c.rest,warn:c.warn,disc:c.disc};   // remembers which sport it was tuned from
      cur[v]=clamp(cur[v]+step*(+v2),lim[0],lim[1]);
      S.tpref.custom=cur; S.tpref.preset='custom'; commit(); return;
    }
    case 't-start': tmrStart(); return;
    case 't-again': tmrStart(); return;
    case 't-pause':
      if (tmr.paused){ tmr.end=Date.now()+tmr.remain; tmr.paused=false; tmrWake(true); }
      else { tmr.remain=Math.max(0,tmr.end-Date.now()); tmr.paused=true; tmrWake(false); }
      return;
    case 't-skip': if (['prep','work','rest'].includes(tmr.phase)){ if (tmr.paused){ tmr.paused=false; } tmr.end=Date.now(); tmrAdvance(false); if (tmr.phase!=='done') tmr.end=Date.now()+tmrDur(tmr.phase,tmr.cfg); } return;
    case 't-stop': {
      /* ending early still counts what you did: rounds started, minutes elapsed */
      const c=tmr.cfg, cur=tmr.paused?tmr.remain:Math.max(0,tmr.end-Date.now());
      const done=tmr.phase==='prep'?0:tmr.phase==='work'?tmr.round-1:tmr.round;           // full rounds only; the one in progress doesn't count
      const partial=tmr.phase==='work'?Math.round(c.work-cur/1000):0;
      if (done<1 && partial<30){ clearInterval(tmrIv); tmrWake(false); tmr.phase='idle'; return; }
      tmr.workSec=done*c.work+partial;
      tmr.cfg={...c,rounds:Math.max(done,1)}; tmrFinish(true); return 'norender';
    }
    case 't-logfight': {
      const c=tmr.cfg, mins=Math.max(1,Math.round((((tmr.doneAt||Date.now())-tmr.t0)/1000-TMR_PREP)/60));
      fightOpen=true; fightEdit=null; fdraft={disc:c.disc||'other',min:String(mins),rounds:String(c.rounds),rpe:0,worked:'',caught:''};
      clearInterval(tmrIv); tmrOpen=false; tmr.phase='idle'; view='today'; toast('Rate the effort and save it'); return;
    }
    case 't-logex': {
      const id=tmr.from&&tmr.from.id, vd=VD(), cw=S.cust[vd];
      const work=tmr.workSec!=null?tmr.workSec:tmr.cfg.rounds*tmr.cfg.work;
      if (cw && id){ (cw.sets[id]=cw.sets[id]||[]).push({t:work}); if (!cw.t0) cw.t0=Date.now(); commit(); toast(`Logged ${fmtDur(work)} of ${exInfo(id).n}`); }
      clearInterval(tmrIv); tmrOpen=false; tmr.phase='idle'; return;
    }
  }
}

/* ============================================================ muscle map == */
/* Weekly working sets per muscle, from custom workouts AND the program's own logged lifts. The library only
   stores a primary muscle, so compound lifts get half-set credit for their obvious helpers by name
   (bench -> triceps/shoulders, rows -> biceps, squats -> glutes, hinges -> glutes/low back...). It's an
   estimate, good for spotting what you're neglecting, not a lab measurement. Targets are the usual
   evidence-based hypertrophy ranges: ~10-20 hard sets a week for big muscles, less for small ones. */
const MM_REG = [
  ['chest','Chest',10,20],['back','Back / lats',10,20],['shoulders','Shoulders',8,18],['traps','Traps',4,12],
  ['biceps','Biceps',6,16],['triceps','Triceps',6,16],['forearms','Forearms',4,12],['core','Core',6,16],
  ['quads','Quads',10,20],['hams','Hamstrings',8,16],['glutes','Glutes',8,18],['calves','Calves',6,16],
  ['hips','Hips / adductors',3,10],['lowback','Low back',3,10],['neck','Neck',3,10]];
const MM_RL = Object.fromEntries(MM_REG.map(r=>[r[0],r]));
const MM_SEC = [   // [name pattern, primary groups it applies to (or null = any), helpers credited at 0.5]
  [/bench press|chest press|push-?up|\bdip\b|floor press|svend|squeeze press/i,null,['triceps','shoulders']],
  [/overhead press|shoulder press|military|push press|pike push|handstand push|arnold|landmine press|z press|jerk/i,null,['triceps']],
  [/row\b|rows\b|pull-?up|chin-?up|pulldown|muscle-?up|pullover|rope climb/i,null,['biceps']],
  [/row\b|rows\b|face pull|reverse fly|rear delt/i,['back','shoulders'],['traps']],
  [/squat|lunge|leg press|step-?up|split squat|hack|pistol|belt squat|sled push/i,['quads'],['glutes']],
  [/deadlift|good morning|hip hinge|romanian|\brdl\b|swing|clean|snatch|rack pull/i,null,['glutes','lowback']],
  [/deadlift|clean|snatch|rack pull|shrug|farmer/i,['hams','lowback','full','forearms'],['traps']],
  [/hip thrust|glute bridge/i,null,['hams']],
  [/farmer|suitcase|carry|walk\b/i,['forearms','core','full'],['core','forearms']],
  [/upright row|high pull/i,null,['shoulders']],
  [/close-grip|diamond/i,['chest'],['triceps']],
  [/nordic|leg curl|hamstring curl|glute-?ham/i,null,['calves']],
];
const MM_COUNT_KINDS = {wr:1,bw:1,carry:1};
function exMuscles(E){
  const out={};
  if (E.mu==='full'){ ['quads','glutes','back','shoulders','core'].forEach(m=>out[m]=0.5); }
  else if (MM_RL[E.mu]) out[E.mu]=1;
  else return out;    // cardio, sport, combat, mobility, plyo: not counted as hypertrophy sets
  for (const [rx,prim,helpers] of MM_SEC){
    if (!rx.test(E.n)) continue;
    if (prim && !prim.includes(E.mu)) continue;
    helpers.forEach(h=>{ if (h!==E.mu && (out[h]||0)<0.5) out[h]=0.5; });
  }
  return out;
}

/* A fixed 90-day block with a weekly check-in: photos (front/side/back) + weight, waist, body fat.
   Measurements are written into the normal body log too, so Fuel/Target pick them up. Photos are too big
   for the JSON backup, so they live in IndexedDB on this device (downscaled to ~1080px JPEG) and SAVE PHOTOS
   hands them to the share sheet so they can go to the camera roll / Files. */
const CH_LEN = 90, CH_POSES = [['front','Front'],['side','Side'],['back','Back']];
let chDraft=null, chCmp=null, chArm=false;
const photoURL = {};   // id -> object URL, cached for the session

/* ---------- IndexedDB ---------- */
let _idb=null;
function idb(){
  if (_idb) return _idb;
  _idb=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('forge-photos',2);
      r.onupgradeneeded=()=>{ const db=r.result;            // v1: photos · v2: + daily state snapshots
        if (!db.objectStoreNames.contains('p')) db.createObjectStore('p');
        if (!db.objectStoreNames.contains('s')) db.createObjectStore('s'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  _idb.catch(()=>{ _idb=null; });
  return _idb;
}
function idbDo(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('p',mode), st=tx.objectStore('p'); const r=fn(st);
  tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); })); }
const photoPut=(id,blob)=>idbDo('readwrite',st=>st.put(blob,id));
const photoGet=id=>idbDo('readonly',st=>st.get(id));
const photoDel=id=>idbDo('readwrite',st=>st.delete(id)).catch(()=>{});

/* downscale on the phone before storing: a 12MP photo becomes ~150-250KB */
function shrinkImage(file,max=1080){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('encode failed')),'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('not an image')); };
    img.src=url;
  });
}
/* fill every <img data-ph="id"> after a render (renders are synchronous strings, photos load async) */
function hydratePhotos(){
  document.querySelectorAll('img[data-ph]').forEach(img=>{
    const id=img.dataset.ph; if (!id) return;
    if (photoURL[id]){ img.src=photoURL[id]; return; }
    photoGet(id).then(b=>{ if (!b) return; photoURL[id]=URL.createObjectURL(b);
      document.querySelectorAll(`img[data-ph="${id}"]`).forEach(x=>x.src=photoURL[id]); }).catch(()=>{});
  });
}

/* ---------- derived ---------- */
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);
  return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }
function addDays(k,n){ const [y,m,d]=k.split('-').map(Number), dt=new Date(y,m-1,d+n);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function chDay(){ const c=S.ch90; if (!c||!c.start) return null; return daysBetween(c.start,T)+1; }
function chWeekOf(date){ return Math.max(0,Math.floor(daysBetween(S.ch90.start,date)/7)); }
function chBriefStat(){ const d=chDay(); if (d==null) return null;
  const t=d<1?`90-day block starts in ${1-d}d`:d>CH_LEN?'90-day block complete':`Day ${d} of 90`;
  return `<button class="brchip" data-act="ch-open">${svg('target',10,'var(--amber)')} ${t}</button>`; }
function chCheckin(week){ return (S.ch90.checkins||[]).find(c=>c.week===week); }
function chDueText(){

  const next=addDays(S.ch90.start,(w+1)*7);

}

    }
    case 'ch-cancel': chDraft=null; return;
    case 'ch-submit': {
      const dr=chDraft; if (!dr) return;
      const wv=num(dr.weight), wa=num(dr.waist), bf=num(dr.bf);
      if (wv!=null && !((imp?wv/2.20462:wv)>25 && (imp?wv/2.20462:wv)<350)){ toast('That weight looks off'); return 'norender'; }
      if (bf!=null && !(bf>=2&&bf<=60)){ toast('Body fat should be 2-60%'); return 'norender'; }
      const rec={week:dr.week,date:T,photos:dr.photos,note:(dr.note||'').trim(),
        weight:wv!=null?Math.round((imp?wv/2.20462:wv)*100)/100:null, waist:wa!=null?Math.round((imp?wa*2.54:wa)*10)/10:null, bf:bf!=null?bf:null};
      const old=chCheckin(dr.week);
      if (old) Object.values(old.photos||{}).forEach(id=>{ if (!Object.values(rec.photos).includes(id)) photoDel(id); });
      c.checkins=(c.checkins||[]).filter(k=>k.week!==dr.week).concat(rec);
      /* also into the normal body log so Fuel / Target / trends use it */
      const L={...(S.log.find(x=>x.date===T)||{}),date:T};
      if (rec.weight!=null) L.weight=rec.weight; if (rec.waist!=null) L.waist=rec.waist; if (rec.bf!=null) L.bf=rec.bf;
      if (rec.weight!=null||rec.waist!=null||rec.bf!=null) S.log=[...S.log.filter(x=>x.date!==T),L].sort((x,y)=>x.date>y.date?1:-1);
      chDraft=null; commit(); toast(`Week ${rec.week} check-in saved`); return;
    }
    case 'ch-del': {
      const k=chCheckin(+v); if (!k) return;
      if (chArm!=='d'+v){ chArm='d'+v; toast('Tap the X again to delete this check-in and its photos'); return 'norender'; }
      Object.values(k.photos||{}).forEach(photoDel); c.checkins=c.checkins.filter(x=>x.week!==+v); chArm=false; commit(); return;
    }
    case 'ch-end': {
      if (chArm!==true){ chArm=true; return; }
      /* archive the block instead of dropping it: its check-ins hold the only reference to the photos in IndexedDB */
      if ((c.checkins||[]).length) (c.past=c.past||[]).push({start:c.start,goal:c.goal,checkins:c.checkins});
      c.start=null; c.goal=''; c.checkins=[]; chArm=false; chDraft=null; commit();
      toast('Block ended and filed under Past blocks.'); return;
    }
    case 'ch-delpast': {
      const b=(c.past||[])[+v]; if (!b) return;
      if (chArm!=='p'+v){ chArm='p'+v; toast('Tap again to delete that block and its photos'); return 'norender'; }
      b.checkins.forEach(k=>Object.values(k.photos||{}).forEach(photoDel)); c.past.splice(+v,1); chArm=false; commit(); return;
    }
    case 'ch-save': chSavePhotos(); return 'norender';
  }
}

/* ======================================================= data safety == */
/* Three layers, cheapest first:
   1. daily snapshots in IndexedDB (last 14 days) - undo for a bad import or a fat-fingered delete
   2. a weekly nudge to save a real backup file (share sheet -> Files / iCloud on iPhone)
   3. import straight from that file, no copy-paste
   None of it can save you from losing the phone except #2, which is why it nags. */
const SNAP_KEEP = 14;
let snapList=null, snapArm=null;
function snapPut(key,json){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('s','readwrite'); tx.objectStore('s').put(json,key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })); }
function snapKeys(){ return idb().then(db=>new Promise((res,rej)=>{ const r=db.transaction('s').objectStore('s').getAllKeys(); r.onsuccess=()=>res(r.result.sort().reverse()); r.onerror=()=>rej(r.error); })); }
function snapGet(key){ return idb().then(db=>new Promise((res,rej)=>{ const r=db.transaction('s').objectStore('s').get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
function snapDelete(key){ return idb().then(db=>new Promise(res=>{ const tx=db.transaction('s','readwrite'); tx.objectStore('s').delete(key); tx.oncomplete=res; tx.onerror=res; })); }
/* one snapshot per day, taken the first time the app opens that day (before anything changes) */
async function snapDaily(){
  try{
    const keys=await snapKeys();
    if (!keys.includes(T)) await snapPut(T,JSON.stringify(S));
    const all=await snapKeys(), days=all.filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)), undos=all.filter(k=>k.startsWith('undo-'));
    for (const k of days.slice(SNAP_KEEP)) await snapDelete(k);
    for (const k of undos.slice(3)) await snapDelete(k);          // the three most recent undo points are kept
    snapList=undos.slice(0,3).concat(days.slice(0,SNAP_KEEP));
  }catch(e){ snapList=[]; }
}
function backupAge(){ const b=S.meta.lastBackup; return b?daysBetween(b,T):null; }
function hasRealData(){ return daysLogged()>=3 || Object.keys(S.cust).length>0 || S.log.length>0 || Object.keys(S.fights).length>0; }
function backupDue(){
  if (!hasRealData()) return false;
  if (S.meta.backupSnooze && T<S.meta.backupSnooze) return false;
  const a=backupAge();
  return a==null ? daysSinceStart()>=7 : a>=7;
}
function BackupBanner(){
  if (!backupDue()) return '';
  const a=backupAge();
  return `<div class="banner" style="align-items:center;gap:8px;padding:9px 11px">${svg('shield',13,'var(--amber)')}
    <div style="flex:1;min-width:0"><b>${a==null?'No backup yet.':`Backup ${a}d old.`}</b> Data lives only on this phone.</div>
    <button class="chip on" data-act="s-backup" style="padding:5px 9px">BACK UP</button><button class="chip" data-act="s-snooze" style="padding:5px 9px">LATER</button></div>`;
}
async function doBackup(){
  const txt=JSON.stringify(S), name=`forge-backup-${T}.json`;
  let how='downloaded';
  try{
    const file=new File([txt],name,{type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'FORGE backup'}); how='shared'; }
    else throw new Error('no share');
  }catch(e){
    if (e && e.name==='AbortError'){ toast('Backup cancelled'); return; }
    try{ const url=URL.createObjectURL(new Blob([txt],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500); }catch(err){}
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});     // the toast below says so; the share-sheet route never touches the clipboard
  }
  S.meta.lastBackup=T; delete S.meta.backupSnooze; commit(); render();
  toast(how==='shared'?'Backup saved — keep it somewhere off this phone':'Backup downloaded (also copied to clipboard)');
}
function SnapshotPanel(){
  const list=snapList||[];
  const a=backupAge();
  return `<div class="note" style="border-top:1px solid var(--rule)"><b style="color:var(--text)">Last backup file:</b> ${a==null?'never':a===0?'today':`${a} day${a===1?'':'s'} ago`}. Photos from the 90-day challenge aren't in the file; use SAVE PHOTOS there.</div>
    ${list.length?`<div class="eyebrow" style="padding:4px 13px 6px">AUTOMATIC SNAPSHOTS ON THIS PHONE</div>
    ${list.map(k=>`<div class="cmt"><span style="flex:1">${k.startsWith('undo-')?`<b>Undo a restore</b> <span style="color:var(--faint)">(your state at ${esc(new Date(+k.slice(5)).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))})</span>`:esc(longDate(k))+(k===T?' <span style="color:var(--faint)">(start of today)</span>':'')}</span>
      <button class="chip" data-act="s-restore" data-v="${k}">${snapArm===k?'TAP TO CONFIRM':'RESTORE'}</button></div>`).join('')}
    <div class="note">One snapshot a day, the last ${SNAP_KEEP} kept, taken when you first open the app. Restoring replaces everything with that day's state (today's state is snapshotted first, so you can undo).</div>`:''}`;
}
async function snapRestore(k){
  try{
    const json=await snapGet(k); if (!json){ toast('Snapshot not found'); return; }
    if (!k.startsWith('undo-')) await snapPut('undo-'+Date.now(),JSON.stringify(S)).catch(()=>{});   // a new key each time: restoring twice must not erase the first undo point
    const snap=JSON.parse(json);
    S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),snap);
    if (!(snap.ui&&snap.ui.seen)) S.ui=Object.assign({},S.ui,{seen:tourAllSeen()});
    S.meta=Object.assign({},DEFAULTS.meta,S.meta||{}); S.meta.onboarded=true; normalizeCustom();
    WEEK=WEEKS[S.profile.program]||WEEK_STD; snapArm=null; commit(); await snapDaily(); render(); toast(k.startsWith('undo-')?'Restore undone':`Restored ${shortDate(k)}`);
  }catch(e){ toast('Could not restore that snapshot'); }
}

/* ---------- calendar export (.ics) ---------- */
/* A home-screen web app can't wake the phone, but the phone's own calendar can. This writes the next 7 days
   of scheduled blocks as calendar events with a 15-minute alert. Import it once a week (re-importing adds copies). */
function icsEsc(t){ return String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
/* RFC 5545 folds at 75 octets, not characters: "·" and "—" are multi-byte in UTF-8 */
const icsEnc = new TextEncoder();
function icsFold(line){
  const out=[]; let cur='', bytes=0;
  for (const ch of line){
    const b=icsEnc.encode(ch).length;
    if (bytes+b>(out.length?74:75)){ out.push(cur); cur=' '; bytes=1; }
    cur+=ch; bytes+=b;
  }
  out.push(cur); return out.join('\r\n');
}
function icsTime(dateKey,mins){
  const extra=Math.floor(mins/1440), k=extra?addDays(dateKey,extra):dateKey, m=((mins%1440)+1440)%1440;
  return k.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';
}
function buildICS(full){
  const now=new Date(), stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FORGE//Training//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:FORGE'];
  let n=0;
  for (let o=0;o<7;o++){
    const k=dkey(o), plan=buildDay(k), cw=S.cust[k];
    for (const e of plan.entries){
      if (e.fixed) continue;
      if (!full && e.id!=='train') continue;
      let title=e.l, desc=e.sub||'';
      if (e.id==='train'){
        if (cw && cw.mode==='replace' && cw.items.length){ title=cw.name||'My workout'; desc=cw.items.map(id=>exInfo(id).n).join(', ')||'Your own session'; }
        else { title=`${plan.def.title}${cw&&cw.items.length?' + '+(cw.name||'extra workout'):''}`; desc=plan.def.blocks.map(b=>b.l).join('\n'); }
        title='FORGE · '+title;
      }
      lines.push('BEGIN:VEVENT',`UID:${k}-${e.id}@forge`,`DTSTAMP:${stamp}`,`DTSTART:${icsTime(k,e.s)}`,`DTEND:${icsTime(k,e.e)}`,
        `SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(desc)}`,
        'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(title)}`,'TRIGGER:-PT15M','END:VALARM','END:VEVENT');
      n++;
    }
  }
  lines.push('END:VCALENDAR');
  return {text:lines.map(icsFold).join('\r\n')+'\r\n',n};
}
function exportICS(full){
  const {text,n}=buildICS(full);
  if (!n){ toast('Nothing scheduled in the next 7 days'); return; }
  const url=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));
  const a=document.createElement('a'); a.href=url; a.download=`forge-week-${T}.ics`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  S.meta.lastIcs=T; commit();
  toast(`${n} events ready — open the file to add them to your calendar`);
}
function CalendarPanel(){
  const last=S.meta.lastIcs;
  return `<div class="panel"><div style="padding:13px">
    <div class="lab">Put the week in your phone's calendar</div>
    <div class="det" style="margin-bottom:10px">Your calendar's alerts fire even when FORGE is closed, so this is the reliable reminder. Each event alerts 15 minutes before.</div>
    <div style="display:flex;gap:8px"><button class="btn" data-act="s-ics" data-v="train" style="flex:1">TRAINING ONLY</button>
      <button class="btn ghost" data-act="s-ics" data-v="full" style="flex:1">FULL DAY PLAN</button></div></div>
    <div class="note">Covers the next 7 days as scheduled right now${last?` · last exported ${esc(shortDate(last))}`:''}. Do it once a week (Sunday review is a good time); importing again adds a second copy.</div></div>`;
}
/* ---------- CSV export: for spreadsheets, coaches, or leaving the app. Weights/distances are in your units. ---------- */
function csvCell(x){
  if (x==null) return '';
  let t=String(x);
  if (typeof x==='string' && /^[=+\-@\t\r]/.test(t)) t="'"+t;           // a name starting with = + - @ must not run as a spreadsheet formula
  return /[",\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
const csvRows = rows => '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function buildCSV(kind){
  const wu=wUnit(), du=isImp()?'mi':'km', conv=x=>x==null?'':wIn(x), lconv=x=>x==null?'':Math.round((isImp()?x/2.54:x)*10)/10;
  if (kind==='workouts'){
    const rows=[['date','source','workout','exercise','set','warmup',`weight_${wu}`,'reps','rpe','seconds',`distance_${du}`]];
    const addSets=(date,source,workout,name,k,sets)=>sets.forEach((st,i)=>rows.push([date,source,workout,name,i+1,st.wu?'yes':'',
      st.w!=null?wIn(st.w):'',st.r??'',st.rpe??'',st.t??'',st.d!=null?(k==='carry'?st.d:Math.round(st.d/(isImp()?1609.344:1000)*100)/100):'']));
    for (const k of Object.keys(S.cust).sort()){ const cw=S.cust[k];
      for (const id of cw.items){ const E=exInfo(id); addSets(k,'custom',cw.name||'',E.n,E.k,cw.sets[id]||[]); } }
    for (const k of Object.keys(S.gym||{}).sort())
      for (const ex of Object.keys(S.gym[k])) addSets(k,'program','',(EXS[ex]&&EXS[ex].n)||ex,'wr',S.gym[k][ex]||[]);
    return rows;
  }
  if (kind==='fights'){
    const rows=[['date','discipline','minutes','rounds','effort_rpe','partner','worked','got_caught']];
    for (const k of Object.keys(S.fights).sort()) for (const f of S.fights[k]) rows.push([k,FIGHT_L[f.disc]||f.disc,f.min,f.rounds||'',f.rpe||'',f.partner||'',f.worked||'',f.caught||'']);
    return rows;
  }
  if (kind==='body'){
    const rows=[['date',`weight_${wu}`,'body_fat_pct',`waist_${isImp()?'in':'cm'}`,`shoulders_${isImp()?'in':'cm'}`,'resting_hr','sleep_h',`squat_${wu}`,`bench_${wu}`,`deadlift_${wu}`,`press_${wu}`,`row_${wu}`,`pullup_added_${wu}`]];
    for (const e of S.log) rows.push([e.date,conv(e.weight),e.bf??'',lconv(e.waist),lconv(e.shoulder),e.rhr??'',e.sleep??'',conv(e.squat),conv(e.bench),conv(e.dead),conv(e.ohp),conv(e.row),conv(e.pullup)]);
    return rows;
  }
  const rows=[['date','food','quantity','kcal','protein_g','carbs_g','fat_g']];
  for (const k of Object.keys(S.days).sort()) for (const f of foodOf(k)){
    const q=f.q??1, r1=x=>Math.round((x||0)*q*10)/10;
    rows.push([k,f.n,q,Math.round((f.kcal||0)*q),r1(f.p),r1(f.c),r1(f.f)]);
  }
  return rows;
}
async function exportCSV(kind){

  if (rows.length<2){ toast('Nothing to export yet'); return; }
  const name=`forge-${kind}-${T}.csv`, txt=csvRows(rows);
