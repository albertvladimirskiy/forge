<style>
:root{
  --ink:#0B0C0E; --panel:#131519; --panel2:#181B20; --sunk:#0E1114;
  --rule:#22262D; --rule2:#2C323A;
  --text:#DDE3EA; --dim:#8A929C; --faint:#737C86;
  --amber:#E0A03A; --steel:#5C8CA8; --moss:#7C9A5E; --rust:#B4553A; --plum:#8A6FA8;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Roboto Mono',Menlo,'Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --pad:14px;
  /* type scale — 11 deliberate roles replacing ~20 ad hoc pixel values that
     had drifted into near-duplicate pairs (e.g. 10px next to 10.5px for the
     same "detail" job). Each step below is reused by 2+ components; a size
     used exactly once (16/17/19/21px — a macro numeral, a hero-card title, a
     phase name, a day title) stays a literal, since tokenizing a one-off
     value adds indirection without a shared role to document. */
  --fs-nano:7.5px;     /* micro-caption beside a bigger sibling: vitals label, nav label, rail sub-label */
  --fs-label:8.5px;    /* uppercase structural signage: eyebrows, field labels, badges, table headers */
  --fs-caption:9px;    /* small secondary tag/count/readout */
  --fs-detail:10.5px;  /* secondary/hint/detail body text — the most common small role */
  --fs-body:11px;      /* paragraph/prose body copy */
  --fs-title:12.5px;   /* row/entry/form title */
  --fs-form:13px;      /* the vitals numeral, accordion titles, stat-suffix text — NOT actual <input>/<select>/<textarea> elements, which are hardcoded to 16px to stop iOS's auto-zoom-on-focus (see the input rule below) */
  --fs-headline:14px;  /* accordion/section headers */
  --fs-numeral-md:15px;/* medium-emphasis numeral: streak, kcal/day, day-progress */
  --fs-display:23px;   /* the brand mark */
  --fs-numeral-lg:25px;/* the largest numeral: stat tiles */
  /* machined-edge material pair: a hairline-thin highlight/shadow straddling a
     surface's top/bottom border, standing in for a bevel with zero elevation —
     border-color only, no box-shadow, so surfaces read as machined metal
     without breaking the flat-at-rest rule. */
  --edge-hi:#2C323C; --edge-lo:#050608;
  /* note/banner backgrounds — each a very-dark tint of its matching domain
     color, one pair per note type. These existed as literal hex values with
     no shared name; documented here as what they already were, not changed. */
  --note-warn-bg:#241B10;
  --note-prog-bg:#151208;    --note-prog-border:#2A2210;
  --note-pain-bg:#1E1210;    --note-pain-border:#3A2018;
  --banner-amber-bg:#1D1608; --banner-amber-border:#3A2E10;
  --banner-moss-bg:#121A0F;  --banner-moss-border:#243318;
  --banner-steel-bg:#0F161C; --banner-steel-border:#1C2A36;
}
.tour{background:var(--banner-steel-bg);border:1px solid var(--banner-steel-border);border-left:3px solid var(--steel);padding:13px;margin:0 0 14px}
.tourh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tour ul{margin:10px 0 12px;padding-left:16px;font-size:var(--fs-body);color:var(--dim);line-height:1.6}
.tour li{margin-bottom:6px}
.tour b{color:var(--text)}
html[data-text=large]{--fs-nano:9.5px;--fs-label:10.5px;--fs-caption:11px;--fs-detail:12.5px;--fs-body:13px;--fs-title:14.5px;--fs-form:15px;--fs-headline:16px}
html[data-text=xl]{--fs-nano:11px;--fs-label:12px;--fs-caption:12.5px;--fs-detail:14px;--fs-body:15px;--fs-title:16px;--fs-form:16.5px;--fs-headline:17.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Kills the double-tap-to-zoom gesture (and the ~300ms tap delay with it)
   while explicitly leaving pinch-zoom alone — "manipulation" means exactly
   that combination. A more specific touch-action (.rblk's drag handling)
   still overrides this for its own element. */
html{touch-action:manipulation}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
  font-family:var(--mono);font-size:14px;overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom)}
/* faint machined-steel grain — a fixed, ultra-low-opacity noise layer over the
   whole app. Material presence, not decoration: invisible until you look for it. */
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
button,input,select,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
button:active{transform:scale(.99)}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
::-webkit-scrollbar{width:0;height:0}

/* ---------- type ---------- */
.disp{font-family:var(--sans);font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:var(--fs-label);letter-spacing:.2em;color:var(--faint);text-transform:uppercase}

/* ---------- shell ---------- */
#app{min-height:100vh;min-height:100dvh}
.wrap{padding:0 var(--pad) 92px}
.view.enter{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--ink) 78%,rgba(11,12,14,.86));
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 0;border-bottom:2px solid var(--edge-lo);
  backdrop-filter:blur(8px)}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-family:var(--sans);font-weight:800;font-size:var(--fs-display);letter-spacing:.22em;line-height:1}
.subline{font-size:var(--fs-caption);letter-spacing:.12em;color:var(--dim);margin-top:6px}
.streak{display:flex;align-items:center;gap:6px;font-size:var(--fs-numeral-md);font-weight:700;padding-top:2px}
.gear{padding:6px;margin:-6px -4px -6px 0;color:var(--faint)}

/* vitals — signature element */
.vitals{display:flex;gap:5px;margin-top:13px;padding-bottom:11px}
.vital{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.vval{font-family:var(--sans);font-weight:800;font-size:var(--fs-form);line-height:1}
.vtrack{width:100%;height:34px;background:#15181C;border:1px solid var(--rule);
  border-top-color:var(--edge-hi);border-bottom-color:var(--edge-lo);
  display:flex;align-items:flex-end;overflow:hidden}
.vfill{width:100%;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.vlab{font-size:var(--fs-nano);letter-spacing:.13em;color:var(--faint)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(11,12,14,.94);backdrop-filter:blur(14px);border-top:2px solid var(--edge-hi);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 0 10px;position:relative;color:var(--faint);transition:color .2s}
nav button.on{color:var(--text)}
nav button .nl{font-size:var(--fs-nano);letter-spacing:.11em;font-weight:700}
nav button .mark{position:absolute;top:0;left:28%;right:28%;height:2px;background:transparent;transition:background .25s}
nav button.on .mark{background:var(--amber)}
nav button.on svg{color:var(--amber)}

/* ---------- primitives ---------- */
.sect{display:flex;align-items:center;gap:9px;margin:20px 0 11px;
  font-size:var(--fs-caption);letter-spacing:.2em;font-weight:700;color:var(--dim)}
.sect h2{margin:0;font:inherit;letter-spacing:inherit;color:inherit}
.sect .line{flex:1;height:1px;background:var(--rule)}
.panel{background:var(--panel);border:1px solid var(--rule);border-top-color:var(--edge-hi);border-bottom-color:var(--edge-lo);
  position:relative;overflow:hidden;margin-bottom:13px}
.panel.acc{padding-left:3px}
.acc-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.hint{font-size:var(--fs-detail);color:var(--faint);line-height:1.55;margin:0 0 12px}
.note{padding:12px 13px;font-size:var(--fs-detail);color:var(--faint);line-height:1.55;border-top:1px solid var(--rule)}
.empty{padding:20px 14px;font-size:var(--fs-body);color:var(--faint);line-height:1.6;text-align:center}
p.t{font-size:var(--fs-body);color:var(--dim);line-height:1.65;margin:0 0 9px}
p.t b{color:var(--text);font-weight:700}

/* rows */
.row{display:flex;gap:11px;align-items:flex-start;width:100%;padding:12px 13px;
  text-align:left;border-bottom:1px solid var(--rule);transition:opacity .25s}
.row:last-child{border-bottom:none}
.row.done{opacity:.45}
.box{width:18px;height:18px;min-width:18px;border:1.5px solid #3C424A;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.row.done .lab{text-decoration:line-through}
.lab{font-size:var(--fs-title);font-weight:600;line-height:1.35;margin-bottom:3px}
.det{font-size:var(--fs-detail);color:var(--dim);line-height:1.5}

/* ---------- timeline ---------- */
.tl{position:relative;padding:4px 0}
.tl:before{content:'';position:absolute;left:57px;top:10px;bottom:10px;width:1px;background:var(--rule)}
.ent{display:flex;gap:0;width:100%;text-align:left;padding:0;position:relative}
.ent .time{width:46px;min-width:46px;padding:11px 0 0 13px;font-size:var(--fs-detail);font-weight:700;
  color:var(--faint);letter-spacing:-.02em}
.ent .pip{width:22px;min-width:22px;display:flex;justify-content:center;padding-top:15px;position:relative;z-index:1}
.pipdot{width:9px;height:9px;border:1.5px solid var(--rule2);background:var(--ink);transition:all .2s}
.ent .meat{flex:1;padding:10px 13px 12px 4px;border-bottom:1px solid var(--rule);min-width:0}
.ent:last-child .meat{border-bottom:none}
.ent .etitle{font-size:var(--fs-title);font-weight:600;line-height:1.3}
.ent .esub{font-size:var(--fs-detail);color:var(--faint);margin-top:3px;line-height:1.45}
.ent.locked .etitle{color:var(--dim);font-weight:500}
.ent.locked .pipdot{background:repeating-linear-gradient(45deg,var(--rule2),var(--rule2) 2px,transparent 2px,transparent 4px);border-color:var(--rule2)}
.ent.done .etitle{text-decoration:line-through;opacity:.5}
.ent.done .esub{opacity:.5}
.dur{font-size:var(--fs-caption);color:var(--faint);letter-spacing:.06em}
.chev{padding:12px;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:transform .25s}
.chev.open{transform:rotate(90deg)}
.subblocks{background:var(--sunk);border-bottom:1px solid var(--rule);overflow:hidden;position:relative;z-index:1}   /* z-index: paints over the timeline line instead of letting it run through the open blocks */
.subblocks .row{padding-left:57px;border-bottom:1px solid #191D22}
.warn{margin:0;padding:11px 13px;background:var(--note-warn-bg);border-top:1px solid var(--rule);
  font-size:var(--fs-detail);color:var(--amber);line-height:1.5}

/* ---------- habits ---------- */
.habits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)}
.hab{background:var(--panel);padding:13px 6px 11px;display:flex;flex-direction:column;
  align-items:center;gap:7px;transition:background .2s}
.hab.on{background:var(--panel2)}
.habdot{width:20px;height:20px;border:1.5px solid #3C424A;display:flex;align-items:center;justify-content:center;transition:all .2s}
.hab .hl{font-size:var(--fs-label);letter-spacing:.06em;color:var(--faint);text-align:center;line-height:1.3}
.hab.on .hl{color:var(--text)}

/* ---------- heat strip ---------- */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;padding:13px}
.heat.big{grid-template-columns:repeat(13,1fr);gap:4px}
.cell{aspect-ratio:1;background:#15181C;border:1px solid var(--rule);transition:background .3s}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:13px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f span{font-size:var(--fs-label);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
input,select,textarea{background:var(--sunk);border:1px solid var(--rule);padding:10px;
  /* 16px, not --fs-form: iOS Safari auto-zooms the viewport to fit any focused
     input whose font-size is under 16px. That zoom-and-snap-back is the "screen
     shakes while typing" report — the fix is never letting it trigger, not
     disabling zoom capability app-wide (a real WCAG requirement) to mask it. */
  font-size:16px;width:100%;outline:none;border-radius:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:54px;line-height:1.5;font-size:16px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 14px) 18px,calc(100% - 9px) 18px;background-size:5px 5px;background-repeat:no-repeat}
input[type=date],input[type=time]{min-height:40px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  background:var(--amber);color:var(--ink);font-size:var(--fs-detail);font-weight:700;letter-spacing:.14em}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--rule)}
.btn.ghost:active{background:var(--panel2)}
.chips{display:flex;gap:6px;padding:12px 13px 2px;flex-wrap:wrap}
.chip{padding:7px 12px;border:1px solid var(--rule);font-size:var(--fs-detail);color:var(--faint);letter-spacing:.05em;transition:all .2s}
.chip:disabled{opacity:.35}
.chip.on{border-color:var(--amber);color:var(--text);background:var(--panel2)}

/* ---------- bars / stats ---------- */
.stand{padding:12px 13px;border-bottom:1px solid var(--rule)}
.stand:last-of-type{border-bottom:none}
.standtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:var(--fs-body)}
.bar{height:5px;background:var(--sunk);border:1px solid var(--rule)}
.barfill{height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-top-color:var(--edge-hi);border-bottom-color:var(--edge-lo);margin-bottom:14px}
.stat{flex:1;background:var(--panel);padding:15px 6px;text-align:center}
.stat .v{font-family:var(--sans);font-weight:800;font-size:var(--fs-numeral-lg);line-height:1;margin-bottom:6px}
.stat .l{font-size:var(--fs-nano);letter-spacing:.11em;color:var(--faint)}
.macros{display:flex;gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.macro{flex:1;background:var(--panel);padding:14px 3px;text-align:center}
.macro .v{font-size:16px;font-weight:700;margin-bottom:4px}
.macro .l{font-size:var(--fs-nano);letter-spacing:.11em;color:var(--faint)}

/* ---------- accordions ---------- */
.ahead{display:flex;align-items:center;gap:11px;width:100%;padding:13px;background:var(--panel);
  border:1px solid var(--rule);border-top-color:var(--edge-hi);border-bottom-color:var(--edge-lo);text-align:left}
.ahead .an{flex:1;font-family:var(--sans);font-weight:800;font-size:var(--fs-headline);letter-spacing:.1em;text-transform:uppercase}
.abody{border:1px solid var(--rule);border-top:none;border-bottom-color:var(--edge-lo);background:#101317}
.acc-group{margin-bottom:9px}

/* books */
.book{display:flex;gap:11px;width:100%;padding:12px 13px;text-align:left;border-bottom:1px solid var(--rule)}
.book:last-child{border-bottom:none}
.pip{width:16px;height:16px;min-width:16px;border:1.5px solid var(--faint);margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.bt{font-size:var(--fs-title);font-weight:600;line-height:1.3}
.ba{font-size:var(--fs-detail);color:var(--faint);margin:3px 0 5px}
.bw{font-size:var(--fs-detail);color:var(--dim);line-height:1.5;margin-bottom:6px}
.bm{font-size:var(--fs-label);letter-spacing:.11em}

/* skills */
.tiers{display:flex;gap:3px;padding:0 13px}
.tiers button{flex:1;height:8px;background:var(--rule);opacity:.55;transition:all .3s}
.tiers button.on{opacity:1}

/* misc */
.orders .o{display:flex;gap:13px;padding:13px;border-bottom:1px solid var(--rule)}
.orders .o:last-child{border-bottom:none}
.onum{font-family:var(--sans);font-weight:800;font-size:var(--fs-numeral-md);color:var(--faint);min-width:20px}
.closing{padding:16px 15px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--amber);
  font-size:var(--fs-body);color:var(--dim);line-height:1.75;margin-bottom:14px}
.cmt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--rule);font-size:var(--fs-body)}
.cmt:last-child{border-bottom:none}
.cmt .x{color:var(--faint);padding:8px;margin:-8px;display:flex;align-items:center;justify-content:center}
.spark{display:block;width:100%;height:120px}
.badge{font-size:var(--fs-label);letter-spacing:.1em;padding:3px 6px;border:1px solid var(--rule);color:var(--faint)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--rule2);padding:10px 16px;font-size:var(--fs-body);z-index:50;
  animation:fade .2s ease both;pointer-events:none}
.toastundo{pointer-events:auto;margin-left:14px;padding:4px 2px;color:var(--amber);font-weight:700;letter-spacing:.1em;font-size:var(--fs-caption)}

/* ---------- drill-through steps ---------- */
.brow{display:flex;align-items:stretch;border-bottom:1px solid #191D22}
.brow.done .lab{text-decoration:line-through;opacity:.55}
.brow.done .det{opacity:.5}
.bmain{flex:1;display:flex;gap:11px;align-items:flex-start;padding:12px 4px 12px 57px;text-align:left;min-width:0}
.chev.sm{padding:12px 14px;display:flex;align-items:center}
.steps{background:#0A0D10;border-bottom:1px solid #191D22;padding:11px 15px 13px 57px}
.step{display:flex;gap:10px;padding:5px 0;font-size:var(--fs-body);color:var(--dim);line-height:1.55}
.stepdot{width:5px;height:5px;min-width:5px;background:var(--rule2);margin-top:6px}
.prognote{display:flex;gap:8px;margin-top:9px;padding:9px 11px;background:var(--note-prog-bg);border:1px solid var(--note-prog-border);font-size:var(--fs-detail);color:var(--amber);line-height:1.5;align-items:flex-start}

/* ---------- food ---------- */
.fuelbar{display:flex;flex-direction:column;gap:9px;padding:13px}
.fb .fbtop{display:flex;justify-content:space-between;font-size:var(--fs-detail);color:var(--faint);margin-bottom:4px}
.foodlist{border-top:1px solid var(--rule)}
.flhead{display:flex;align-items:center;gap:8px;width:100%;padding:0 13px;border-top:1px solid var(--rule);font-size:var(--fs-caption);letter-spacing:.12em;font-weight:700;color:var(--faint)}
.flhead button{padding:11px 0;font:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.flhead .flmain{flex:1;display:flex;align-items:center;gap:8px;text-align:left}
.flhead .chev{padding:0}
.flhead .fl-all{color:var(--amber);letter-spacing:.1em}
.cmt .cmtname{flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;color:inherit;font:inherit}
.cmt .cmtname .chev{padding:0;flex:none}
.fdet{padding:0 13px 12px;border-bottom:1px solid var(--rule);font-size:var(--fs-detail);color:var(--dim)}
.fdet .fdm{display:flex;gap:14px;margin-bottom:8px;color:var(--text)}
.fdet .fdm span i{font-style:normal;color:var(--faint)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px}
.mgrid div{display:flex;justify-content:space-between;gap:8px}
.mgrid div b{font-weight:600;color:var(--text);white-space:nowrap}
.mhead{padding:12px 13px 4px;font-size:var(--fs-caption);letter-spacing:.14em;font-weight:700;color:var(--faint)}
.mrow{padding:5px 13px}
.mrow .mt{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-detail);color:var(--dim)}
.mrow .mt b{font-weight:600;color:var(--text)}
.mrow .mt em{font-style:normal;color:var(--faint);margin-left:6px}
.mrow .bar{margin-top:3px}
.fvtog{padding:11px 13px 2px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.fvtog span{font-size:var(--fs-caption);letter-spacing:.12em;color:var(--faint);font-weight:700}
.foodpick{border-top:1px solid var(--rule);background:#101317}
.searchrow{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--rule)}
.searchrow input{border:none;background:none;padding:2px 0;font-size:16px}
.foodresults{max-height:290px;overflow-y:auto}
.gramrow{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid var(--rule);font-size:var(--fs-caption);color:var(--faint)}
.gramrow span{flex:1}
.gramrow input{width:64px;flex:none;padding:5px 7px;font-size:16px}
.fres{display:flex;align-items:stretch;border-bottom:1px solid #191D22}
.fresmain{flex:1;display:flex;align-items:center;gap:8px;padding:11px 8px 11px 13px;font-size:var(--fs-title);min-width:0}
.fresmain:active{background:var(--panel2)}
.fresq{padding:0 13px;font-size:var(--fs-body);color:var(--faint);border-left:1px solid #191D22}
.fresq:active{color:var(--amber)}

/* ---------- week map ---------- */
.wmap{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.wcol{flex:1;background:var(--panel);padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s}
.wcol.on{background:var(--panel2)}
.wcol.on .wlab{color:var(--amber)}
.wlab{font-size:var(--fs-label);letter-spacing:.09em;color:var(--faint);font-weight:700}
.wtrack{position:relative;width:100%;max-width:22px;height:64px;background:var(--sunk);border:1px solid var(--rule)}
.wcol.on .wtrack{border-color:var(--rule2)}
.wbar{position:absolute;left:2px;right:2px;background:var(--steel);opacity:.85;min-height:3px}
.wnum{font-size:var(--fs-label);color:var(--faint);height:10px}
.daylist{min-height:10px}
.cmt.tap{width:100%;text-align:left}
.cmt.tap:active{background:var(--panel2)}
.cmttime{color:var(--faint);min-width:104px;font-size:var(--fs-body)}
.editrow{background:#101317;border-bottom:1px solid var(--rule)}
.addzone{border-top:1px solid var(--rule)}
.copyzone{border-top:1px solid var(--rule)}

/* ---------- recent entries table ---------- */
.tbl{font-size:var(--fs-body)}
.tr{display:grid;grid-template-columns:1.3fr 1fr .9fr .9fr .9fr .9fr 34px;align-items:center;padding:9px 13px;border-bottom:1px solid #191D22}
.tr:last-child{border-bottom:none}
.tr.th{font-size:var(--fs-label);letter-spacing:.1em;color:var(--faint);border-bottom:1px solid var(--rule)}
.tr .x{justify-self:end;padding:8px;margin:-8px;display:flex;align-items:center;justify-content:center}

/* ---------- toast upgrade ---------- */
.toast{opacity:0;transition:opacity .25s;animation:none}
.toast.show{opacity:1}


/* ---------- progression ---------- */
.rx{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-caption);font-weight:700;letter-spacing:.06em}
.rx.dim{color:var(--faint);font-weight:500}
.setlog{background:#0C0F13;border-bottom:1px solid #191D22;padding:12px 15px 13px 57px}
.setrow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:var(--fs-title);border-bottom:1px solid #14181D}
.setn{width:16px;font-size:var(--fs-caption);color:var(--faint)}
.setadd{display:flex;align-items:center;gap:8px;margin-top:10px}
.setadd input{width:76px;padding:9px;font-size:16px;text-align:center}
.setx{color:var(--faint);font-size:var(--fs-body)}
.setadd .chip{white-space:nowrap;padding:9px 13px}
.flagbtn{display:flex;align-items:center;gap:5px;font-size:var(--fs-caption);color:var(--faint);letter-spacing:.06em;padding:4px 8px;border:1px solid var(--rule)}
.painnote{display:flex;gap:9px;padding:10px 11px;margin-bottom:11px;background:var(--note-pain-bg);border:1px solid var(--note-pain-border);font-size:var(--fs-detail);color:var(--text);line-height:1.5;align-items:flex-start}
.unflag{display:block;margin-top:5px;font-size:var(--fs-caption);color:var(--rust);letter-spacing:.08em;text-decoration:underline}

/* ---------- banners ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--banner-amber-bg);border:1px solid var(--banner-amber-border);padding:13px;margin-bottom:13px;font-size:var(--fs-body);line-height:1.55;color:var(--dim)}
.banner b{color:var(--text)}
.banner.moss{background:var(--banner-moss-bg);border-color:var(--banner-moss-border)}
.banner.steel{background:var(--banner-steel-bg);border-color:var(--banner-steel-border)}


/* ---------- day rail (drag calendar) ---------- */
.railwrap{position:relative;overflow:hidden;border:1px solid var(--rule);
  border-top-color:var(--edge-hi);border-bottom-color:var(--edge-lo);background:var(--panel);margin-bottom:2px}
.rail{position:relative;margin:10px 12px 10px 50px}
.rhour{position:absolute;left:-46px;right:0;border-top:1px solid #1B1E23;height:0}
.rhour span{position:absolute;left:0;top:-6px;width:40px;text-align:right;font-size:var(--fs-label);color:var(--faint);padding-right:6px}
.rnow{position:absolute;left:-46px;right:0;height:1px;background:var(--amber);z-index:6}
.rnow:before{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.rblk{position:absolute;left:2px;right:2px;background:var(--panel2);border-left:3px solid var(--rule2);
  padding:4px 8px;overflow:hidden;touch-action:none;border-radius:1px}
.rblk.lock{opacity:.5;background:repeating-linear-gradient(135deg,#181B20,#181B20 5px,#121417 5px,#121417 10px)}
.rblk.drag{cursor:grab}
.rblk.dragging{box-shadow:0 8px 22px rgba(0,0,0,.55);z-index:10;cursor:grabbing;opacity:.96}
.rblkT{font-size:var(--fs-caption);font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.rblkS{font-size:var(--fs-nano);color:var(--faint);margin-top:2px}
.railhint{display:flex;align-items:center;gap:6px;padding:8px 2px 15px;font-size:var(--fs-caption);color:var(--faint)}

/* ---------- commitment tag dots ---------- */
.tagdot{width:7px;height:7px;min-width:7px;border-radius:50%;margin-right:2px}

/* ---------- PR badges ---------- */
.setrow .award-inline{display:inline-flex}


/* ---------- week load overview ---------- */
.wload{display:flex;gap:6px;padding:13px 13px 8px}
.wlcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.wllab{font-size:var(--fs-label);letter-spacing:.1em;color:var(--faint);font-weight:700}
.wlbar{width:100%;height:52px;background:var(--ink);border:1px solid var(--rule);display:flex;align-items:flex-end}
.wlfill{width:100%;transition:height .25s}
.wlhrs{font-size:var(--fs-label);font-weight:700;letter-spacing:.03em}
.btn.ghost{background:transparent;border:1px solid var(--rule2);color:var(--dim)}

/* ---------- week strip ---------- */
.stripwrap{margin:calc(6px + 0px) -14px 0;position:relative}
.strip{display:flex;gap:5px;overflow-x:auto;padding:12px 14px 13px;
  scrollbar-width:none;-ms-overflow-style:none}
.strip::-webkit-scrollbar{display:none}
.dcell{flex:0 0 auto;width:42px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--panel);border:1px solid var(--rule);transition:all .18s}
.dcell.sel{background:var(--panel2);border-color:var(--amber)}
.dcell.today .dnum{color:var(--amber)}
.dlab{font-size:var(--fs-label);letter-spacing:.1em;color:var(--faint);font-weight:700}
.dnum{font-family:var(--sans);font-weight:800;font-size:var(--fs-numeral-md);line-height:1;color:var(--dim)}
.dcell.sel .dnum{color:var(--text)}
.ddot{width:4px;height:4px;border-radius:50%}

/* ---------- day head + next up ---------- */
.dayhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.nextup{background:linear-gradient(135deg,#16191E,#121417);border:1px solid var(--rule2);
  border-left:3px solid var(--amber);padding:14px 15px;margin-bottom:14px}
.nueyebrow{font-size:var(--fs-label);letter-spacing:.2em;color:var(--amber);font-weight:700}
.nutitle{font-family:var(--sans);font-weight:800;font-size:17px;letter-spacing:.01em;margin-top:7px;line-height:1.15}
.nusub{font-size:var(--fs-body);color:var(--dim);line-height:1.5;margin-top:6px}
.nuprog{font-size:var(--fs-caption);color:var(--faint);letter-spacing:.06em;margin-top:8px}

/* ---------- segmented control ---------- */
.segwrap{margin:15px 0 4px}
.seg{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.segbtn{flex:1 0 auto;padding:11px 6px;background:var(--panel);font-size:var(--fs-caption);font-weight:700;
  letter-spacing:.13em;color:var(--faint);transition:all .18s}
.segbtn.on{background:var(--panel2);color:var(--amber)}

/* ---------- now vs target comparison ---------- */
.cmp{display:flex;align-items:stretch;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:13px}
.cmpcol{flex:1;background:var(--panel);padding:13px 12px}
.cmpcol.tgt{background:var(--panel2)}
.cmphead{font-size:var(--fs-label);letter-spacing:.2em;color:var(--faint);font-weight:700;margin-bottom:10px}
.cmprow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:var(--fs-detail);color:var(--dim)}
.cmprow b{font-size:var(--fs-title);color:var(--text);font-weight:700}
.cmparrow{display:flex;align-items:center;padding:0 3px;background:var(--panel)}

/* ---------- meal plans ---------- */
.mslot{border-bottom:1px solid #191D22;padding:11px 13px}
.mslot:last-of-type{border-bottom:none}
.mslothead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mslothead span{font-size:var(--fs-label);letter-spacing:.15em;color:var(--amber);font-weight:700}
.mslothead .chip{padding:5px 10px;font-size:var(--fs-caption)}
.mitem{display:flex;gap:8px;padding:4px 0;font-size:var(--fs-body);color:var(--dim);line-height:1.4}
.mitem b{color:var(--text)}



/* ---------- daily briefing ---------- */
.brief{display:block;width:100%;text-align:left;margin:0 0 14px;padding:14px 15px 13px;background:linear-gradient(160deg,#1A1610,#121417 70%);
  border:1px solid var(--banner-amber-border);border-left:3px solid var(--amber)}
.brief.col{display:flex;align-items:center;gap:10px;padding:11px 13px}
.brhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brtag{font-size:var(--fs-label);letter-spacing:.2em;color:var(--amber);font-weight:700;white-space:nowrap}
.brx{padding:4px;margin:-4px}
.brmini{flex:1;min-width:0;font-size:var(--fs-detail);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brline{font-family:var(--sans);font-weight:800;font-size:18px;line-height:1.3;letter-spacing:.005em;margin:11px 0 0;color:var(--text)}
.brsrc{font-size:var(--fs-caption);color:var(--faint);margin-top:6px;letter-spacing:.06em}
.brwhy{display:block;width:100%;text-align:left;margin-top:12px;padding:10px 11px;border:1px solid var(--rule2);background:rgba(0,0,0,.25);
  font-size:var(--fs-body);color:var(--text);line-height:1.5}
.brwhy i{display:block;font-style:normal;font-size:var(--fs-label);letter-spacing:.18em;color:var(--faint);margin-bottom:4px}
.brwhy.empty{color:var(--dim);border-style:dashed}
.brstats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:11px;font-size:var(--fs-detail);color:var(--dim)}
.brstats span{display:inline-flex;align-items:center;gap:5px}
.brlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.brlink{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--amber);color:var(--text);font-size:var(--fs-caption);letter-spacing:.08em;font-weight:700}
.brlink.ghost{border-color:var(--rule2);color:var(--faint)}
.bredrow{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-detail);color:var(--dim);line-height:1.45}
.bredrow span{flex:1;min-width:0;word-break:break-word}
.bredrow small{display:block;color:var(--faint)}
.bredrow .x{color:var(--faint);padding:6px;margin:-6px}
.bredadd{display:flex;gap:6px;margin-top:8px}
.bredadd input{padding:8px 9px;min-width:0}

/* ---------- round timer ---------- */
.tmr{position:fixed;inset:0;z-index:48;display:flex;flex-direction:column;background:var(--ink);padding-top:env(safe-area-inset-top)}
.tmr.work{background:#1A0E0B}
.tmr.work.warn{background:#2A1A08}
.tmr.rest{background:#0B1318}
.tmr.prep{background:#14120B}
.ttop{display:flex;justify-content:space-between;align-items:center;padding:14px var(--pad);font-size:var(--fs-label);letter-spacing:.2em;color:var(--faint);font-weight:700}
.tbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--pad);text-align:center}
.tphase{font-size:var(--fs-headline);letter-spacing:.35em;font-weight:700;color:var(--dim)}
.tmr.work .tphase{color:var(--rust)} .tmr.work.warn .tphase{color:var(--amber)} .tmr.rest .tphase{color:var(--steel)} .tmr.prep .tphase{color:var(--amber)}
.ttime{font-family:var(--sans);font-weight:800;font-size:min(30vw,150px);line-height:1;letter-spacing:-.02em;margin:14px 0 10px;font-variant-numeric:tabular-nums}
.tround{font-size:var(--fs-title);letter-spacing:.18em;color:var(--dim)}
.tbarw{width:100%;max-width:420px;height:6px;background:var(--rule);margin-top:26px}
.tbar{height:100%;background:var(--rust);transition:width .1s linear}
.tmr.rest .tbar{background:var(--steel)} .tmr.prep .tbar,.tmr.work.warn .tbar{background:var(--amber)}
.tdots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:18px;max-width:320px}
.tdots span{width:10px;height:10px;border:1.5px solid var(--rule2)}
.tdots span.on{background:var(--moss);border-color:var(--moss)} .tdots span.cur{background:var(--rust);border-color:var(--rust)}
.tmr.paused .ttime{opacity:.45}
.tctl{display:flex;gap:10px;padding:14px var(--pad) calc(18px + env(safe-area-inset-bottom))}
.tctl.col{flex-direction:column}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tst .sfi{align-items:stretch}
.tval{flex:1;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:var(--sunk);font-family:var(--sans);font-weight:800;font-size:20px;padding:10px 0}
.tmrbtn{color:var(--dim);border-color:var(--note-pain-border)}

/* ---------- muscle map ---------- */
.mmsvg{display:block;width:100%;max-width:440px;margin:0 auto;height:auto}
.mmleg{display:flex;justify-content:center;gap:14px;padding:4px 13px 12px;font-size:var(--fs-caption);color:var(--faint)}
.mmleg i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid var(--rule2)}
.mmdet{padding:11px 13px 12px;border-top:1px solid var(--rule)}
.mmdh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.mmdh b{font-size:var(--fs-title)} .mmdh span{font-size:var(--fs-detail);color:var(--faint)}
.mmrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 13px;border-bottom:1px solid #191D22;text-align:left}
.mmrow.on{background:var(--panel2)}
.mmn{width:96px;flex:none;font-size:var(--fs-detail);color:var(--dim)}
.mmbar{position:relative;flex:1;height:8px;background:var(--sunk);border:1px solid var(--rule)}
.mmtgt{position:absolute;top:0;bottom:0;background:rgba(224,160,58,.12);border-left:1px solid rgba(224,160,58,.35);border-right:1px solid rgba(224,160,58,.35)}
.mmfill{position:absolute;left:0;top:0;bottom:0}
.mmv{width:58px;flex:none;text-align:right;font-size:var(--fs-title);font-weight:700}
.mmv em{display:block;font-style:normal;font-size:var(--fs-caption);font-weight:500}
.mmv em.up{color:var(--moss)} .mmv em.dn{color:var(--rust)}
.logrow{display:flex;gap:8px}
.logrow .logbtn{flex:1;padding:11px 6px}

/* ---------- 90-day challenge ---------- */
.chhero{display:flex;align-items:center;gap:14px;padding:14px 13px}
.chday{display:flex;flex-direction:column;align-items:center;min-width:74px;padding:6px 0;border-right:1px solid var(--rule)}
.chday span{font-size:var(--fs-label);letter-spacing:.18em;color:var(--faint)}
.chday b{font-family:var(--sans);font-weight:800;font-size:38px;line-height:1.05;color:var(--amber)}
.chgoal{font-size:var(--fs-title);font-weight:600;line-height:1.35}
.chsub{margin-top:7px;font-size:var(--fs-caption);color:var(--faint);line-height:1.5}
.chgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;padding:13px}
.chc{aspect-ratio:1;background:#15181C;border:1px solid var(--rule)}
.chc.fut{background:transparent;border-style:dashed;opacity:.5}
.chc.today{border-color:var(--amber);border-width:1.5px}
.chposes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chpose{position:relative;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:var(--sunk);border:1px dashed var(--rule2);overflow:hidden;cursor:pointer}
.chpose img{width:100%;height:100%;object-fit:cover}
.chpose i{position:absolute;left:0;right:0;bottom:0;padding:4px 0;font-style:normal;text-align:center;font-size:var(--fs-label);letter-spacing:.14em;color:var(--dim);background:rgba(0,0,0,.6)}
.chthumbs{display:flex;gap:6px;margin-top:8px}
.chthumbs img{width:58px;height:78px;object-fit:cover;border:1px solid var(--rule)}
.chcmp{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 13px 10px}

    return (await tryKey(KEY)) || (await tryKey(OLDKEY));
  },
  async save(data){
    const s = JSON.stringify(data); mem[KEY]=s;
    try{ if (window.storage){ await window.storage.set(KEY, s); return true; } }catch(e){}
    try{ localStorage.setItem(KEY, s); return true; }catch(e){ return false; }
  }
};

  {id:'m24',tr:'markets',p:3,t:'Security Analysis',a:'Benjamin Graham & David Dodd',w:'The founding text of value investing. A reference to work through, not a book to finish.'},
  {id:'m25',tr:'markets',p:3,t:'Margin of Safety',a:'Seth Klarman',w:'Value investing from a working fund manager. Famously hard to find, so try a library.'},
  {id:'m26',tr:'markets',p:3,t:'The Alchemy of Finance',a:'George Soros',w:'Reflexivity from the man who traded on it. Dense and half philosophy. Read the early chapters first.'},
  {id:'m27',tr:'markets',p:3,t:'Big Debt Crises',a:'Ray Dalio',w:'Three debt cycles walked through with data. A clear template for how crises start and end.'},
  {id:'e1',tr:'econ',p:1,t:'Naked Economics',a:'Charles Wheelan',w:'Fast, honest orientation. Read it in a weekend, then go deeper.'},
  {id:'e2',tr:'econ',p:1,t:'The Ascent of Money',a:'Niall Ferguson',w:'Financial history as the spine of everything else in this track.'},
  {id:'e3',tr:'econ',p:1,t:'Thinking Strategically',a:'Dixit & Nalebuff',w:'Game theory made usable. Applies to negotiation, careers, and markets equally.'},
  {id:'e4',tr:'econ',p:2,t:'Why Nations Fail',a:'Acemoglu & Robinson',w:'Institutions as the variable behind the wealth of nations. Contested, and worth arguing with.'},
  {id:'e5',tr:'econ',p:2,t:'Manias, Panics, and Crashes',a:'Charles Kindleberger',w:'The anatomy of a bubble, repeated across four centuries. You will recognise the present in it.'},
  {id:'e6',tr:'econ',p:2,t:'Good Economics for Hard Times',a:'Banerjee & Duflo',w:'What the evidence actually shows on trade, migration, and growth.'},
  {id:'e7',tr:'econ',p:2,t:'Development as Freedom',a:'Amartya Sen',w:'Reframes development as capability rather than GDP. The moral spine of the subject.'},
  {id:'e8',tr:'econ',p:3,t:'The Bottom Billion',a:'Paul Collier',w:'Why the poorest countries stay poor, and which interventions have evidence behind them.'},
  {id:'e9',tr:'econ',p:3,t:'Fixing Failed States',a:'Ghani & Lockhart',w:'The sovereignty gap framework. The reference text for post-conflict reconstruction economics.'},
  {id:'e10',tr:'econ',p:1,t:'Basic Economics',a:'Thomas Sowell',w:'Prices, incentives and trade with no graphs and no jargon. The best plain-language starting point.'},
  {id:'e11',tr:'econ',p:1,t:'Economics in One Lesson',a:'Henry Hazlitt',w:'Look at what is seen and what is not. A short lesson in second-order thinking. Read the politics with a skeptical eye.'},
  {id:'e12',tr:'econ',p:2,t:'Freakonomics',a:'Steven Levitt & Stephen Dubner',w:'Incentives applied to odd questions. Light, and good practice at asking what the data really shows.'},
  {id:'e13',tr:'econ',p:2,t:'The Great Crash 1929',a:'J.K. Galbraith',w:'A short, readable account of the boom and the bust. The best antidote to "this time is different".'},
  {id:'e14',tr:'econ',p:2,t:'This Time Is Different',a:'Carmen Reinhart & Kenneth Rogoff',w:'Eight centuries of financial crises. The data version of Kindleberger.'},
  {id:'e15',tr:'econ',p:2,t:'Poor Economics',a:'Abhijit Banerjee & Esther Duflo',w:'Randomised evidence on how poor households actually decide. Pairs with Good Economics for Hard Times.'},
  {id:'e16',tr:'econ',p:2,t:'The Wealth of Nations',a:'Adam Smith',w:'Read Book I and parts of Book IV. The source text, and more readable than its reputation.'},
  {id:'e17',tr:'econ',p:2,t:'The Price of Time',a:'Edward Chancellor',w:'The history of interest rates and what happens when money is too cheap for too long.'},
  {id:'e18',tr:'econ',p:3,t:'The General Theory of Employment, Interest and Money',a:'John Maynard Keynes',w:'Hard going, but half of modern macro argues with it. Read it with a good guide beside you.'},
  {id:'e19',tr:'econ',p:3,t:'Capital in the Twenty-First Century',a:'Thomas Piketty',w:'Wealth and inequality across centuries. Read the data and argument, then judge the policy half yourself.'},
  {id:'g1',tr:'geo',p:1,t:'Prisoners of Geography',a:'Tim Marshall',w:'Fast, map-driven, and it makes the news legible. Best starting point.'},
  {id:'g2',tr:'geo',p:1,t:'Chip War',a:'Chris Miller',w:'Semiconductors as the strategic resource of the century. The most useful current-affairs book in print.'},
  {id:'g3',tr:'geo',p:2,t:'The World for Sale',a:'Blas & Farchy',w:'Commodity traders and how physical resources really move. Unsettling and excellent.'},
  {id:'g4',tr:'geo',p:2,t:'Trade Wars Are Class Wars',a:'Klein & Pettis',w:'Global imbalances as domestic distribution fights. Changes how you read every trade headline.'},
  {id:'g5',tr:'geo',p:2,t:'Destined for War',a:'Graham Allison',w:'The Thucydides trap applied to the US and China. Argue with it rather than accept it.'},
  {id:'g6',tr:'geo',p:3,t:'The Rise and Fall of the Great Powers',a:'Paul Kennedy',w:'Economic capacity as the ceiling on military power, across five centuries.'},
  {id:'g7',tr:'geo',p:1,t:'The Accidental Superpower',a:'Peter Zeihan',w:'Geography and demographics as destiny, with the US as the winner. Punchy and contrarian. Check its forecasts as you go.'},
  {id:'g8',tr:'geo',p:1,t:'The Prize',a:'Daniel Yergin',w:'The history of oil and the wars, deals and fortunes around it. Energy is the through-line of the century.'},
  {id:'g9',tr:'geo',p:2,t:'The Revenge of Geography',a:'Robert Kaplan',w:'How maps constrain politics. A good sequel to Prisoners of Geography.'},
  {id:'g10',tr:'geo',p:2,t:'World Order',a:'Henry Kissinger',w:'Balance of power and legitimacy across civilisations, from a practitioner. Dense, and worth the slog.'},
  {id:'g11',tr:'geo',p:2,t:'On China',a:'Henry Kissinger',w:'How Chinese strategy thinks about itself, plus the Nixon-era opening from the inside.'},
  {id:'g12',tr:'geo',p:2,t:'The Guns of August',a:'Barbara Tuchman',w:'How Europe stumbled into 1914. The best study of escalation by miscalculation.'},
  {id:'g13',tr:'geo',p:2,t:'The Sleepwalkers',a:'Christopher Clark',w:'The same war through a different lens: the diplomats and decision-makers. Read it alongside Tuchman.'},
  {id:'g14',tr:'geo',p:2,t:'The Dictator\'s Handbook',a:'Bruce Bueno de Mesquita & Alastair Smith',w:'Politics as incentives for keeping a coalition loyal. Explains rulers\' behaviour better than ideology does.'},
  {id:'g15',tr:'geo',p:2,t:'The New Map',a:'Daniel Yergin',w:'Energy, climate and the clash of nations. The update to The Prize.'},
  {id:'g16',tr:'geo',p:2,t:'Guns, Germs, and Steel',a:'Jared Diamond',w:'Why some societies pulled ahead. A powerful frame and a widely criticised one. Read the critics too.'},
  {id:'g17',tr:'geo',p:3,t:'History of the Peloponnesian War',a:'Thucydides',w:'The original Thucydides trap. Start with the Melian Dialogue and Pericles\' funeral oration.'},
  {id:'g18',tr:'geo',p:3,t:'Strategy: A History',a:'Lawrence Freedman',w:'Strategy in war, politics and business. A map of the whole idea.'},
  {id:'g19',tr:'geo',p:3,t:'The Clash of Civilizations',a:'Samuel Huntington',w:'A contested thesis. Worth knowing as an argument, not as a prediction.'},
  {id:'j1',tr:'judge',p:1,t:'Thinking, Fast and Slow',a:'Daniel Kahneman',w:'How your own reasoning fails. Read before any other decision book.'},
  {id:'j2',tr:'judge',p:1,t:'Superforecasting',a:'Tetlock & Gardner',w:'Prediction as a trainable skill with an actual scoreboard. Start keeping one.'},
  {id:'j3',tr:'judge',p:1,t:'The Art of Learning',a:'Josh Waitzkin',w:'Chess prodigy turned world-champion martial artist on how skill is really built.'},
  {id:'j4',tr:'judge',p:1,t:'Deep Work',a:'Cal Newport',w:'Attention is the bottleneck on everything else in this program.'},
  {id:'j5',tr:'judge',p:2,t:'Peak',a:'Anders Ericsson',w:'Deliberate practice from the researcher everyone else misquotes'},
  {id:'j6',tr:'judge',p:2,t:'How to Solve It',a:'George Polya',w:'Thin, old, and still the best thing ever written on problem-solving method'},
  {id:'j7',tr:'judge',p:3,t:'Antifragile',a:'Nassim Taleb',w:'How to structure a life that gains from disorder rather than merely surviving it'},
  {id:'j8',tr:'judge',p:1,t:'Atomic Habits',a:'James Clear',w:'Systems over goals, one percent at a time. The practical manual for the daily habits FORGE tracks.'},
  {id:'j9',tr:'judge',p:1,t:'Thinking in Bets',a:'Annie Duke',w:'Treat decisions like bets and separate the outcome from the process. Short and immediately usable.'},
  {id:'j10',tr:'judge',p:2,t:'The Black Swan',a:'Nassim Nicholas Taleb',w:'Rare events dominate. The risk idea behind Antifragile. Skim the rants.'},

  {id:'j12',tr:'judge',p:2,t:'The Signal and the Noise',a:'Nate Silver',w:'Which predictions work and why most don\'t. A good primer on thinking in probabilities.'},
  {id:'j13',tr:'judge',p:2,t:'Algorithms to Live By',a:'Brian Christian & Tom Griffiths',w:'Computer-science ideas for everyday choices: when to stop looking, when to explore versus exploit.'},
  {id:'j14',tr:'judge',p:2,t:'Thinking in Systems',a:'Donella Meadows',w:'Stocks, flows and feedback loops. The grammar for why systems resist change.'},
  {id:'j15',tr:'judge',p:2,t:'The Scout Mindset',a:'Julia Galef',w:'Wanting to see what is true more than wanting to be right. Short and practical on updating your beliefs.'},
  {id:'j16',tr:'judge',p:2,t:'Ultralearning',a:'Scott Young',w:'A framework for learning hard things fast, built around projects. Useful for the language and skill goals.'},
  {id:'j17',tr:'judge',p:2,t:'Range',a:'David Epstein',w:'Why generalists often win in complex fields. The counter-argument to early specialisation.'},
  {id:'j18',tr:'judge',p:2,t:'Essentialism',a:'Greg McKeown',w:'Do fewer things, better. A short case for ruthless prioritising.'},
  {id:'j19',tr:'judge',p:2,t:'The Inner Game of Tennis',a:'W. Timothy Gallwey',w:'Quiet the inner critic and trust the body. A classic on performing under pressure that transfers straight to the mats.'},
  {id:'j20',tr:'judge',p:2,t:'Mastery',a:'Robert Greene',w:'Apprenticeship, practice and deep skill, told through the lives of masters. Pair it with Peak.'},
  {id:'j21',tr:'judge',p:2,t:'Mindset',a:'Carol Dweck',w:'Fixed versus growth belief about ability. Worth knowing, though the research is more mixed than the pop version.'},
  {id:'j22',tr:'judge',p:3,t:'Noise',a:'Daniel Kahneman, Olivier Sibony & Cass Sunstein',w:'Not bias but random variation in judgments. A companion to Thinking, Fast and Slow.'},

  {id:'w2',tr:'will',p:1,t:'Man\'s Search for Meaning',a:'Viktor Frankl',w:'What survives when everything else is taken. The floor of this entire project.'},

  {id:'w24',tr:'will',p:3,t:'Discipline Is Destiny',a:'Ryan Holiday',w:'Self-control, the Stoic virtue, in practice.'},
  {id:'p1',tr:'people',p:1,t:'Never Split the Difference',a:'Chris Voss',w:'FBI hostage negotiation, made usable in ordinary rooms'},

  {id:'p9',tr:'people',p:2,t:'Pre-Suasion',a:'Robert Cialdini',w:'What you do before you ask changes the answer. The companion to Influence.'},

  {id:'bu9',tr:'build',p:2,t:'The E-Myth Revisited',a:'Michael Gerber',w:'Why small businesses fail: owners work in them instead of on them. Systems thinking for the self-employed.'},
  {id:'bu10',tr:'build',p:3,t:'The Innovator\'s Dilemma',a:'Clayton Christensen',w:'Why great companies miss disruption. Useful for investors and operators alike.'},

/* Derived values that every screen recomputes from the whole history (a lift's history, days logged) are computed once and
   reused until the data can have changed: the end of the current task, the next save, or the next render. */
let _memo=null;
function memo(key,fn){
  if (!_memo){ _memo=new Map(); queueMicrotask(()=>{ _memo=null; }); }
  if (!_memo.has(key)) _memo.set(key,fn());
  return _memo.get(key);
}
let saveWarnAt=0, saveTimer=null;
/* typing saves on every keystroke would stringify and store the whole history each time; wait for a pause, and always flush
   before the page is hidden or closed so nothing is lost */
function commitSoon(){ _memo=null; clearTimeout(saveTimer); saveTimer=setTimeout(commit,400); }
function flushSave(){ if (saveTimer){ clearTimeout(saveTimer); commit(); } }
function commit(){
  _memo=null; clearTimeout(saveTimer); saveTimer=null;
  Store.save(S).then(ok=>{
    if (ok!==false || Date.now()-saveWarnAt<60000) return;
    saveWarnAt=Date.now();
    toast("Couldn't save to this phone (storage full or blocked). Back up now.");
  });
}
const toastInner = () => esc(toastMsg||'') + (toastUndo&&undoSnap ? '<button class="toastundo" data-act="undo">UNDO</button>' : '');

}

const pad = n => String(n).padStart(2,'0');
function dkey(off=0){ const d=new Date(); d.setDate(d.getDate()+off); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dowIdx(key){ const [y,m,d]=key.split('-').map(Number); const js=new Date(y,m-1,d).getDay(); return js===0?6:js-1; }
function m2s(t){ if(!t) return 0; const [h,m]=String(t).split(':').map(Number); return (isFinite(h)?h:0)*60+(isFinite(m)?m:0); }

function s2disp(x){ const h24=Math.floor(x/60)%24, m=x%60; const ap=h24<12?'a':'p'; let h=h24%12||12; return m===0?`${h}${ap}`:`${h}:${pad(m)}${ap}`; }
function tdisp(t){ return s2disp(m2s(t)); }

/* ============================================================ scheduler == */
const PREF = { morning:[330,600], midday:[660,900], evening:[990,1260] };

function subtract(free,s,e){
  const out=[];
  for (const iv of free){
    if (e<=iv[0]||s>=iv[1]){ out.push(iv); continue; }
    if (s>iv[0]) out.push([iv[0],s]);
    if (e<iv[1]) out.push([e,iv[1]]);
  }
  return out.filter(iv=>iv[1]-iv[0]>=10);
}
function place(free,dur,anchor,win){
  let best=null,bestCost=Infinity;
  for (const iv of free){
    if (iv[1]-iv[0]<dur) continue;
    let s = anchor!=null?clamp(anchor,iv[0],iv[1]-dur):iv[0];
    if (win){ s=clamp(s,Math.max(iv[0],win[0]),Math.max(iv[0],Math.min(iv[1]-dur,win[1]))); s=clamp(s,iv[0],iv[1]-dur); }
    let cost = anchor!=null?Math.abs(s-anchor):s;
    if (win){ const mid=(win[0]+win[1])/2; cost=Math.abs(s-mid)*(s>=win[0]&&s+dur<=win[1]?0.25:1); }
    if (cost<bestCost){ bestCost=cost; best=[s,s+dur]; }
  }
  return best;
}

/* the planned session for a date: the weekday's, or the one swapped in */
const dayDef = key => S.swap[key]!=null ? (ALLDAYS[S.swap[key]]||WEEK[dowIdx(key)]) : WEEK[dowIdx(key)];
function buildDay(key){
  const p=S.profile;
  const di = dowIdx(key);
  const def = dayDef(key);
  const wake=m2s(p.wake); let sleep=m2s(p.sleep); if(sleep<=wake) sleep+=1440;

  const fixed = [ ...(S.fixed[DOW[dowIdx(key)]]||[]), ...(S.extra[key]||[]) ]
    .map(c=>({s:m2s(c.s), e:m2s(c.e)<m2s(c.s)?m2s(c.e)+1440:m2s(c.e), l:c.l, t:c.t, fixed:true}))
    .sort((a,b)=>a.s-b.s);

  let free=[[wake,sleep]];
  const buf=+p.commute||0;
  for (const c of fixed) free=subtract(free,c.s-buf,c.e+buf);

  const out=[...fixed], missed=[], adapt=[], nudge=day(key).nudge;
  const physMin = fixed.filter(c=>c.t==='physical').reduce((a,c)=>a+(c.e-c.s),0);

  const add=(id,label,sub,dur,anchor,win,kind)=>{
    let slot=null;
    if (nudge[id]!=null){
      const s=nudge[id];
      if (free.some(iv=>s>=iv[0]&&s+dur<=iv[1])) slot=[s,s+dur];
    }
    if (!slot) slot=place(free,dur,anchor,win);

    if (kind==='meal' && anchor!=null){
      let host=null,hostStart=null,hostCost=Infinity;
      for (const c of fixed){
        if (c.e-c.s<150) continue;
        const s=clamp(anchor,c.s+20,c.e-20-dur);
        if (s<c.s+20||s+dur>c.e-20) continue;
        const cost=Math.abs(s-anchor);
        if (cost<hostCost){ hostCost=cost; host=c; hostStart=s; }
      }
      const slotCost = slot?Math.abs(slot[0]-anchor):Infinity;
      if (host && hostCost+25<slotCost){
        out.push({s:hostStart,e:hostStart+dur,l:label,id,kind,inside:true,
          sub:`During ${host.l.toLowerCase()} - pack it the night before`});
        return;
      }
    }
    if (!slot && kind==='train'){
      const short=Math.round(dur*0.55);
      slot=place(free,short,anchor,win);
      if (slot) missed.push(`Only ${short} minutes was free - cut the accessories, keep the main lifts or rounds.`);
    }
    if (!slot){ missed.push(`No room for ${label.toLowerCase()} today.`); return; }
    free=subtract(free,slot[0],slot[1]);
    out.push({s:slot[0],e:slot[1],l:label,sub,id,kind});
  };

  const trainWin=PREF[p.trainPref]||PREF.morning;
  let trainDur=def.dur;
  if (physMin>=90 && def.type==='strength'){
    trainDur=Math.max(50,def.dur-20);
    adapt.push(`${physMin} minutes of tagged practice today. Keep the main lift heavy but skip the conditioning finisher — you have already paid that bill on court.`);
  } else if (physMin>=90 && (def.type==='recover'||def.type==='craft')){
    trainDur=Math.max(30,Math.round(def.dur*0.6));
    adapt.push(`Heavy tagged practice today (${physMin} min). Recovery work trimmed — the priority is being fresh tomorrow, not accumulating more volume.`);
  } else if (physMin>=45 && def.type==='strength'){
    adapt.push(`${physMin} min of tagged practice today. Main lift stays as prescribed; cut the finisher if your legs are already cooked.`);
  }
  add('train',def.title,def.aim,trainDur,null,trainWin,'train');
  const tr=out.find(o=>o.id==='train');
  add('news','Daily intelligence','Markets, macro, one long piece. Twenty minutes, then stop.',20,wake+40,null,'mind');
  add('meal1','Meal 1','Protein-forward. Within 90 minutes of waking or of training.',30, tr&&tr.s<wake+180?tr.e+20:wake+75,null,'meal');
  add('meal2','Meal 2','Largest carb share on training days',30,750,null,'meal');
  add('meal3','Meal 3','Protein plus vegetables. Finish two hours before sleep.',35,1110,null,'meal');
  add('mind',MINDTASK[di].l,MINDTASK[di].d,35,null,[1020,sleep-90],'mind');
  add('review','Shutdown + review','Log the day, set tomorrow\'s one thing, screens off',20,sleep-50,null,'review');

  out.sort((a,b)=>a.s-b.s);
  return {def,di,entries:out,missed,adapt,wake,sleep};
}

function daysLogged(){ return memo('daysLogged',()=>Object.keys(S.days).filter(k=>{ const d=S.days[k];
  return d && ((d.blocks&&Object.values(d.blocks).some(Boolean))||d.mind||d.news||extraTrain(k)>0); }).length); }

function dayScore(k){
  const d=S.days[k]; if(!d) return 0;
  const b=(d.blocks?Object.values(d.blocks).filter(Boolean).length:0)+extraTrain(k);
  const h=d.habits?Object.values(d.habits).filter(Boolean).length:0;
  const x=(d.mind?1:0)+(d.news?1:0)+(d.rv&&d.rv.win?1:0);
  return clamp((b*1.1+h*0.7+x*1.1)/9,0,1);
}
function streak(){
  let n=0;
  for(let i=0;i<1200;i++){ const s=dayScore(dkey(-i));
    if(s>0.08)n++; else if(i===0)continue; else break; }
  return n;
}
/* the most recent log entry that actually HAS this field — not just the most
   recent entry overall. The Log form explicitly supports partial entries
   ("one field is enough"), so a squat PR logged today with no bodyweight
   re-entered must not hide a perfectly good weight from three days ago.
   Every reader of a specific measurement (weight, a lift, bf%, shoulder,
   waist...) goes through this rather than grabbing the latest row blind. */
function latestField(key){
  const withField=S.log.filter(e=>e[key]!=null).sort((a,b)=>a.date>b.date?1:-1);
  return withField.length ? withField[withField.length-1] : null;
}
/* Scale weight swings a few pounds a day on water and food alone, so anything DERIVED from bodyweight (calorie and macro
   targets, activity burn, lean-mass and strength-standard targets) uses the average of the weigh-ins from the last 7 days.
   One weigh-in in that window, or none, falls back to the latest reading, so weekly weighers see no change. The weight-cut
   tracker and "days since weigh-in" deliberately stay on the raw readings. */
function trendWeight(){
  const L=latestField('weight'); if(!L) return null;
  const win=S.log.filter(e=>e.weight!=null && e.date>=dkey(-6) && e.date<=T);
  if (win.length<2) return {kg:L.weight,n:1,raw:L.weight,date:L.date,smoothed:false};
  return {kg:win.reduce((a,e)=>a+e.weight,0)/win.length,n:win.length,raw:L.weight,date:L.date,smoothed:true};
}
/* rolling 7-day average at each weigh-in, for the chart */
function weightTrendSeries(){
  const ws=S.log.filter(e=>e.weight!=null);
  return ws.map(e=>{ const from=addDays(e.date,-6), win=ws.filter(x=>x.date>=from && x.date<=e.date);
    return win.reduce((a,x)=>a+x.weight,0)/win.length; });
}
/* days since the most recent LOGGED WEIGHT specifically (not just any log entry —
   a bodyweight-free entry like a squat PR shouldn't reset this) */
function daysSinceWeight(){
  const L=latestField('weight'); if(!L) return null;
  const [y,m,dd]=L.date.split('-').map(Number), [ty,tm,td]=T.split('-').map(Number);
  return Math.round((new Date(ty,tm-1,td)-new Date(y,m-1,dd))/86400000);
}

function pillars(){
  const t=id=>((S.tiers[id]??0)/4)*100;
  const TWp=trendWeight(), bw=TWp&&TWp.kg;
  /* bestLift() so a session logged on Today counts even if the Log tab's
     own squat/bench/etc fields haven't been re-typed since — matches how
     STRENGTH STANDARDS already reads strength. */
  const lift=(!bw)?0:LIFTS.map(s=>{ const cur=bestLift(s.k); return cur?clamp(cur/(bw*s.m)*100,0,100):0; }).reduce((a,b)=>a+b,0)/LIFTS.length;
  const read=Object.values(S.books).filter(v=>v===2).length;
  const dl=daysLogged();
  return [
    {k:'BODY',v:lift*0.6+t('s4')*0.4,c:'var(--steel)'},
    {k:'COMBAT',v:(t('s1')+t('s2'))/2,c:'var(--rust)'},
    {k:'MIND',v:clamp(read/BOOK_GOAL*100,0,100)*0.5+(t('s5')+t('s6')+t('s7'))/3*0.5,c:'var(--plum)'},
    {k:'WILL',v:clamp(streak()/90*55,0,55)+clamp(dl/365*45,0,45),c:'var(--amber)'},
    {k:'CAPITAL',v:Object.values(S.capital).filter(Boolean).length/CAPITAL.length*100,c:'var(--moss)'},
  ];
}
function phaseIdx(){ const d=daysLogged(); return d>=1095?3:d>=540?2:d>=180?1:0; }

function physicalItems(k){
  return [ ...(S.fixed[DOW[dowIdx(k)]]||[]), ...(S.extra[k]||[]) ].filter(c=>c.t==='physical');
}
function activityMinutes(k){
  return physicalItems(k).reduce((a,c)=>{ let s=m2s(c.s), e=m2s(c.e); if(e<=s) e+=1440; return a+(e-s); }, 0);
}
/* calories burned by tagged-physical commitments on date k, one MET per
   item based on its chosen sport (SPORTMET), rather than one flat number
   for everything — a BJJ round and a brisk walk no longer cost the same.  */
function extraKcal(k){
  const L=trendWeight(); if(!L||!k) return 0;
  const items=physicalItems(k); if(!items.length) return 0;
  const kcal=items.reduce((a,c)=>{
    let s=m2s(c.s), e=m2s(c.e); if(e<=s) e+=1440;
    const met=SPORTMET[c.sp]!=null?SPORTMET[c.sp]:SPORTMET[''];

}
function nutrition(k){
  const L=trendWeight(); if(!L) return null;
  const p=S.profile,kg=L.kg,cm=+p.height,age=+p.age||22;
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='m'?5:-161);
  const tdee=bmr*(+p.activity||1.725);
  const extra=extraKcal(k);
  const adj=p.goal==='gain'?1.10:p.goal==='lean'?0.85:1.0;
  const kcal=Math.round((tdee+extra)*adj/10)*10;
  const protein=Math.round(kg*2.0);
  const fat=Math.round(kcal*0.27/9);
  const carbs=Math.max(20,Math.round((kcal-protein*4-fat*9)/4));
  return {tdee:Math.round(tdee),kcal,protein,fat,carbs,water:(kg*40/1000).toFixed(1),extra,extraMin:k?activityMinutes(k):0};
}
function foodTotals(k){
  const f=day(k).food;
  // Both real add-paths (addfood, addcustomfood) always supply p/c/f, but one
  // malformed entry — a hand-edited localStorage value, an older backup schema —
  // would otherwise poison the whole day's totals: undefined*q is NaN, and NaN
  // stays NaN through every subsequent addition in the reduce.
  return f.reduce((a,x)=>({kcal:a.kcal+(x.kcal||0)*x.q,p:a.p+(x.p||0)*x.q,c:a.c+(x.c||0)*x.q,f:a.f+(x.f||0)*x.q}),{kcal:0,p:0,c:0,f:0});
}

/* ---------- micronutrients ---------- */
/* USDA values per 100 g live in micros-db.js (MICROS[ndb] = one row per USDA record, in MICRO_DEF order; a hole means the
   lab never measured it). It loads the first time a micro view opens. A logged food remembers its USDA record (mk), how many
   grams it stands for (mg) and whether the match was a close cousin rather than the exact item (ma), so totals never depend
   on a name lookup. Restaurant, packaged and custom foods mostly have no record: they're counted for macros only, and the
   micro view says how many foods it could use. */
const MICRO_DEF=[   // label, unit, FDA daily value (null = none), group, true if it's a limit rather than a goal
  ['Vitamin A','µg RAE',900,'VITAMINS'],['Vitamin C','mg',90,'VITAMINS'],['Vitamin D','µg',20,'VITAMINS'],['Vitamin E','mg',15,'VITAMINS'],
  ['Vitamin K','µg',120,'VITAMINS'],['Thiamin (B1)','mg',1.2,'VITAMINS'],['Riboflavin (B2)','mg',1.3,'VITAMINS'],['Niacin (B3)','mg',16,'VITAMINS'],
  ['Pantothenic acid (B5)','mg',5,'VITAMINS'],['Vitamin B6','mg',1.7,'VITAMINS'],['Folate','µg DFE',400,'VITAMINS'],['Vitamin B12','µg',2.4,'VITAMINS'],
  ['Choline','mg',550,'VITAMINS'],
  ['Calcium','mg',1300,'MINERALS'],['Iron','mg',18,'MINERALS'],['Magnesium','mg',420,'MINERALS'],['Phosphorus','mg',1250,'MINERALS'],
  ['Potassium','mg',4700,'MINERALS'],['Sodium','mg',2300,'MINERALS',true],['Zinc','mg',11,'MINERALS'],['Copper','mg',0.9,'MINERALS'],
  ['Manganese','mg',2.3,'MINERALS'],['Selenium','µg',55,'MINERALS'],
  ['Fiber','g',28,'FIBER, SUGAR + FATS'],['Sugars','g',null,'FIBER, SUGAR + FATS'],['Saturated fat','g',20,'FIBER, SUGAR + FATS',true],
  ['Monounsaturated fat','g',null,'FIBER, SUGAR + FATS'],['Polyunsaturated fat','g',null,'FIBER, SUGAR + FATS'],['Cholesterol','mg',300,'FIBER, SUGAR + FATS',true]];
let microState=0, foodRows=new Set();   // microState: 0 not asked for, 1 loading, 2 ready, 3 failed
function loadMicros(){
  if (typeof MICROS!=='undefined'){ microState=2; return; }
  if (microState) return;
  microState=1;
  const s=document.createElement('script'); s.src='micros-db.js';
  s.onload=()=>{ microState=2; render(); }; s.onerror=()=>{ microState=3; render(); };
  document.head.appendChild(s);
}
const microReady=()=>typeof MICROS!=='undefined';
/* which USDA record a logged food stands for: what it remembered, else (older entries) its name in the food list */
function microRefOf(e){
  if (e.mk) return {mk:e.mk,mg:e.mg,ma:e.ma};
  let row=FOODIDX[e.n], g=null;
  if (!row){ const m=/^(.*), ([\d.]+) (g|oz)$/.exec(e.n||''); if (m){ row=FOODIDX[m[1]]; g=+m[2]*(m[3]==='oz'?28.3495:1); } }
  if (!row||!row[6]) return null;
  const mg=row[5]?g:row[7]; if (!mg) return null;
  return {mk:Math.abs(row[6]),mg,ma:row[6]<0?1:0};
}
/* the record a database row carries, ready to store on a logged food. g = grams eaten for a per-100 g row */
function microRef(f,g){
  const r=f[6]; if (!r) return {};
  const mg=f[5]?g:f[7]; if (!(mg>0)) return {};
  return r<0?{mk:-r,mg:Math.round(mg*10)/10,ma:1}:{mk:r,mg:Math.round(mg*10)/10};
}
/* one food's micronutrients (a MICRO_DEF-ordered array, holes kept), or null when there is no record for it */
function entryMicros(e){
  const r=microRefOf(e), rec=r&&MICROS[r.mk]; if (!rec) return null;
  const k=r.mg/100*(e.q||1), out=new Array(MICRO_DEF.length);
  rec.forEach((v,i)=>{ if (v!=null) out[i]=v*k; });
  return {v:out,ma:!!r.ma};
}
function dayMicros(list){
  const tot=new Array(MICRO_DEF.length).fill(0), seen=new Array(MICRO_DEF.length).fill(false), missing=[];
  let n=0, approx=0;
  for (const e of list){
    const m=entryMicros(e); if (!m){ missing.push(e.n); continue; }
    n++; if (m.ma) approx++;
    m.v.forEach((v,i)=>{ tot[i]+=v; seen[i]=true; });
  }
  return {tot,seen,n,approx,missing};
}
const fmtMicro=v=>v>=100?String(Math.round(v)):v>=10?String(Math.round(v*10)/10):String(Math.round(v*100)/100);
function microPanelHTML(list){
  if (!list.length) return `<div class="note" style="border-top:none">Log some food and its vitamins and minerals add up here.</div>`;
  if (!microReady()){ loadMicros(); return `<div class="note" style="border-top:none">${microState===3?"Couldn't load the micronutrient data.":'Loading micronutrient data…'}</div>`; }
  const m=dayMicros(list);
  let h=`<div class="note" style="border-top:none;padding-bottom:2px">Counted from <b style="color:var(--text)">${m.n} of ${list.length}</b> food${list.length===1?'':'s'} (USDA data)${m.approx?`, ${m.approx} of them estimated from a similar USDA food`:''}.${m.missing.length?` No micronutrient data for: ${esc(m.missing.slice(0,5).join(', '))}${m.missing.length>5?` and ${m.missing.length-5} more`:''}. Custom foods and a few restaurant and packaged items have none, so those totals run a little low.`:''}</div>`;
  let grp='';
  MICRO_DEF.forEach(([l,u,dv,g,lim],i)=>{
    if (g!==grp){ grp=g; h+=`<div class="mhead">${g}</div>`; }
    if (!m.seen[i]){ h+=`<div class="mrow"><div class="mt"><span>${l}</span><span style="color:var(--faint)">—</span></div></div>`; return; }
    const v=m.tot[i], pct=dv?v/dv*100:null;
    h+=`<div class="mrow"><div class="mt"><span>${l}</span><span><b>${fmtMicro(v)} ${u}</b>${pct!=null?`<em>${Math.round(pct)}%${lim?' of limit':''}</em>`:''}</span></div>
      ${pct!=null?`<div class="bar"><div class="barfill" style="width:${clamp(pct,0,100)}%;background:${lim&&pct>100?'var(--rust)':pct>=100?'var(--moss)':'var(--steel)'}"></div></div>`:''}</div>`;
  });
  return h+`<div class="note">Percentages are of the FDA Daily Value for adults (a 2,000 kcal diet). Your own needs differ with age, sex and training. Sodium, saturated fat and cholesterol are limits, not goals. Choline is measured less often than the rest, so it can run low.</div>`;
}
/* the compact list shown when a single food is opened in the day's list */
function entryMicroHTML(e){
  if (!microReady()){ loadMicros(); return `<div>${microState===3?"Couldn't load the micronutrient data.":'Loading micronutrient data…'}</div>`; }
  const m=entryMicros(e);
  if (!m) return `<div>No micronutrient data for this food.</div>`;
  const short=l=>l.replace('Pantothenic acid','Pantothenic').replace('Monounsaturated fat','Mono fat').replace('Polyunsaturated fat','Poly fat').replace('Saturated fat','Sat fat');
