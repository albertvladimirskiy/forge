/* ============================================================ fight camp == */
/* A dated fight changes what every session is for. Camp = fight date + weigh-in + target weight. It drives
   a phase label with what to prioritize, a weight-cut tracker against a straight-line path from where you
   started, and the briefing's "fight in N days". Weight guidance is deliberately conservative: the tracker
   flags paces that need a long water cut instead of coaching one. */
const CAMP_PHASES = [
  [57,'BASE','Build the engine and the skills. Volume is fine, heavy lifting stays in, sparring 1-2x a week.'],
  [29,'BUILD','Sharpen the gameplan. Rounds get specific to your opponent and ruleset. Lifting drops to maintenance: heavy but low volume.'],
  [15,'PEAK','Hardest sparring of camp happens here, then stops. Conditioning matches the fight\'s round structure.'],
  [8,'TAPER','Volume down, speed up. Short sharp rounds, no new techniques, nothing you could get hurt in.'],
  [1,'FIGHT WEEK','Light pads, mobility, sleep, food plan. Nothing new. Trust what you drilled.'],
  [0,'FIGHT DAY','Warm up early, stay loose, breathe. You already did the work.'],
];
let campEdit=false, campArm=false;
function campDaysOut(){ const c=S.camp; if (!c||!c.date) return null; return daysBetween(T,c.date); }
function campPhase(d){ for (const p of CAMP_PHASES) if (d>=p[0]) return p; return CAMP_PHASES[CAMP_PHASES.length-1]; }
function campBriefStat(){ const d=campDaysOut(); if (d==null||d<0) return null;
  return `<button class="brchip" data-act="camp-open" style="color:var(--rust)">${svg('swords',10,'var(--rust)')} ${d===0?'FIGHT DAY':`Fight in ${d} day${d===1?'':'s'}`}</button>`; }
/* where you "should" be today on a straight line from camp start to target at weigh-in */
function campPath(){
  const c=S.camp; if (!c||!c.target||!c.startW||!c.start||!c.weighIn) return null;
  const span=Math.max(1,daysBetween(c.start,c.weighIn)), el=clamp(daysBetween(c.start,T),0,span);
  return {span,el,today:c.startW+(c.target-c.startW)*el/span};
}
function campWeights(){ const c=S.camp; return S.log.filter(e=>e.weight!=null && e.date>=addDays(c.start,-14)).sort((a,b)=>a.date>b.date?1:-1); }
function campCutSVG(){
  const c=S.camp, pts=campWeights(); if (!c.target||!c.weighIn) return '';
  const start=addDays(c.start,-14), span=Math.max(1,daysBetween(start,c.weighIn));
  const ws=pts.map(p=>p.weight).concat([c.target,c.startW||c.target]);
  const lo=Math.min(...ws)-0.8, hi=Math.max(...ws)+0.8;
  const X=k=>clamp(daysBetween(start,k)/span*100,0,100), Y=w=>(1-(w-lo)/(hi-lo))*100;

  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.date).toFixed(2)},${Y(p.weight).toFixed(2)}`).join(' ');

function campAct(a,v){
  const c=S.camp, imp=isImp();
  switch(a){
    case 'camp-open': view='wlog'; wlSub='fights'; window.scrollTo(0,0); return;
    case 'camp-edit': campEdit=true; campArm=false; return;
    case 'camp-cancel': campEdit=false; return;
    case 'camp-save': {
      const g=id=>(document.getElementById(id)||{}).value||'';
      const date=g('cp_date'); if (!date){ toast('Pick the fight date'); return 'norender'; }
      if (date<T){ toast('Fight date is in the past'); return 'norender'; }
      const tw=num(g('cp_tw')), L=latestField('weight');
      const isNew=!c.date;
      Object.assign(c,{name:g('cp_name').trim(),date,weighIn:g('cp_wi')||addDays(date,-1),disc:g('cp_disc')||'boxing',
        target:tw!=null?Math.round((imp?tw/2.20462:tw)*100)/100:null});
      if (isNew||!c.start){ c.start=T; c.startW=L?L.weight:null; }
      if (!c.startW && L) c.startW=L.weight;
      campEdit=false; commit(); toast('Camp is on. Every session has a date now.'); return;
    }
    case 'camp-weigh': {
      const w=num((document.getElementById('cp_wt')||{}).value); if (w==null){ toast('Enter your weight'); return 'norender'; }
      const kg=imp?w/2.20462:w; if (!(kg>25&&kg<350)){ toast('That weight looks off'); return 'norender'; }
      const rec={...(S.log.find(x=>x.date===T)||{}),date:T,weight:Math.round(kg*100)/100};
      S.log=[...S.log.filter(x=>x.date!==T),rec].sort((x,y)=>x.date>y.date?1:-1);
      if (!c.startW) c.startW=rec.weight;
      commit(); toast('Weigh-in logged'); return;
    }
    case 'camp-cancelfight': if (!campArm){ campArm=true; return; } S.camp={}; campArm=false; commit(); toast('Camp cancelled'); return;
    case 'camp-res': c.result=v; commit(); return;
    case 'camp-close': (S.campHist=S.campHist||[]).push({...c}); S.camp={}; commit(); toast('Fight filed. On to the next one.'); return;
  }
}

function partnerList(){
  const by={};
  for (const k of Object.keys(S.fights)) for (const f of S.fights[k]) for (const n of String(f.partner||'').split(',').map(x=>x.trim()).filter(Boolean)){
    const key=n.toLowerCase(), e=by[key]||(by[key]={name:n,n:0,min:0,last:'',caught:'',worked:''});
    e.n++; e.min+=+f.min||0; if (k>=e.last){ e.last=k; e.name=n; e.caught=f.caught||e.caught; e.worked=f.worked||e.worked; }
  }
  return Object.values(by).sort((a,b)=>a.last<b.last?1:-1);
}
function lastWithPartner(name,before){
  const key=name.trim().toLowerCase(); let best=null;
  for (const k of Object.keys(S.fights)) if (k<before) for (const f of S.fights[k])
    if (String(f.partner||'').split(',').some(x=>x.trim().toLowerCase()===key) && (!best||k>best.k)) best={k,f};
  return best;
}

/* Five short steps on a fresh install so nothing runs on silent defaults (age 22, 178 cm...). Existing users

let obStep=0, obD=null;
function obInit(){
  const p=S.profile;

      ${Object.entries(PROGRAMS).map(([k,pr])=>`<button class="startopt ${d.program===k?'sel':''}" data-act="ob-set" data-v="program" data-v2="${k}"><b>${pr.n}</b><span>${esc(pr.d)}</span></button>`).join('')}
      <div class="note" style="padding:4px 0 0;border:none">Any day can still be swapped, edited into your own workout, or have fighting added on top.</div>`;
  } else {
    body=`<div class="obh">Your why</div>
      <p class="t">One sentence you'd want to read on your worst morning. It sits at the top of Today, every day.</p>
      <textarea data-ob="why" maxlength="280" style="min-height:96px" placeholder="e.g. So nobody I love ever has to wonder if I can protect them.">${esc(d.why)}</textarea>

function obAct(a,v,v2){
  const d=obD||(obInit(),obD);
  switch(a){
    case 'ob-set': {
      if (v==='unit' && d.unit!==v2){   // convert anything typed so far
        const h=num(d.height), w=num(d.weight);
        if (h!=null) d.height=String(Math.round((v2==='metric'?h*2.54:h/2.54)*10)/10);
        if (w!=null) d.weight=String(Math.round((v2==='metric'?w/2.20462:w*2.20462)*10)/10);
      }
      d[v]=v2; return;
    }
    case 'ob-back': obStep=Math.max(0,obStep-1); return;
    case 'ob-skip': S.meta.onboarded=true; commit(); toast('Skipped. Everything is under the gear icon.'); return;
    case 'ob-next': {
      if (obStep===1){
        const imp=d.unit==='imperial', age=num(d.age), h=num(d.height), w=num(d.weight);
        if (age!=null && !(age>=12&&age<=90)){ toast('Age looks off'); return 'norender'; }
        const cm=h==null?null:(imp?h*2.54:h), kg=w==null?null:(imp?w/2.20462:w);
        if (cm!=null && !(cm>120&&cm<230)){ toast(`Height looks off — ${imp?'inches':'cm'}?`); return 'norender'; }
        if (kg!=null && !(kg>30&&kg<300)){ toast('Weight looks off'); return 'norender'; }
      }
      if (obStep<4){ obStep++; return; }
      obFinish(); return;
    }
  }
}
function obFinish(){
  const d=obD, p=S.profile, imp=d.unit==='imperial';
  p.unit=d.unit; p.sex=d.sex; p.wake=d.wake||p.wake; p.sleep=d.sleep||p.sleep; p.trainPref=d.trainPref; p.program=d.program;
  const age=num(d.age), h=num(d.height), w=num(d.weight);
  if (age!=null) p.age=Math.round(age);
  if (h!=null) p.height=Math.round((imp?h*2.54:h)*10)/10;
  if (w!=null){ const kg=Math.round((imp?w/2.20462:w)*100)/100;
    S.log=[...S.log.filter(x=>x.date!==T),{...(S.log.find(x=>x.date===T)||{}),date:T,weight:kg}].sort((a,b)=>a.date>b.date?1:-1); }
  if ((d.why||'').trim()) S.motiv.why=d.why.trim();

function WeekStrip(){

  for (let o=-7;o<=7;o++){

/* ================================================================== rail == */
function DayRail(plan){
  const {wake,sleep,entries,def}=plan, span=sleep-wake, RH=520, px=RH/span;
  const hourStart=Math.ceil(wake/60), hourEnd=Math.floor(sleep/60);
  let hours='';
  for (let h=hourStart; h<=hourEnd; h++)
    hours+=`<div class="rhour" style="top:${(h*60-wake)*px}px"><span>${s2disp(h*60)}</span></div>`;

  /* Pack top-to-bottom (entries arrive sorted by start time) so blocks scheduled
     close together never visually collide: each block starts at its true time
     position unless that would land it closer than MINH+GAP to the block above,
     in which case it's nudged down just enough to stay legible. This can desync
     a block's pixel position from literal time-proportionality during a dense
     stretch of the day — an accepted trade for two-line labels never overlapping.
     Drag math (below) reads time from data-s/data-e, never from this top, so the
     desync never leaks into the reschedule flow. */
  const MINH=32, GAP=3;
  let prevBottom=-Infinity, railBottom=RH;
  const positioned = entries.map(e=>{
    const idealTop=clamp((e.s-wake)*px,0,RH-MINH);
    const top=Math.max(idealTop, prevBottom+GAP);
    const h=Math.max(MINH,(e.e-e.s)*px);
    prevBottom=top+h; railBottom=Math.max(railBottom,prevBottom);
    return {e,top,h};
  });

  const blocks = positioned.map(({e,top,h})=>{
    const movable=!e.fixed;
    const col = e.fixed?'var(--rule2)': e.id==='train'?DTYPE[def.type].c : e.kind==='mind'?'var(--plum)':e.kind==='meal'?'var(--moss)':'var(--amber)';
    return `<div class="rblk ${e.fixed?'lock':'drag'}" data-id="${e.id}" data-s="${e.s}" data-e="${e.e}"
      style="top:${top}px;height:${h}px;border-left-color:${col}" ${movable?'data-draggable="1"':''}>
      <div class="rblkT">${esc(e.l)}</div><div class="rblkS">${s2disp(e.s)}${movable?'':' · fixed'}</div>
    </div>`;
  }).join('');
  return `<div class="railwrap"><div class="rail" id="rail" data-wake="${wake}" data-span="${span}" data-px="${px}" style="height:${railBottom}px">
    <div class="rnow" id="rnow"></div>${hours}${blocks}</div></div>
    <div class="railhint">${svg('rot',11,'var(--faint)')} Drag a block to reschedule it. Locked blocks are fixed commitments.</div>`;
}

/* =========================================================== build: log == */
function ViewLog(){
  const p=S.profile, imp=p.unit==='imperial', wu=imp?'lb':'kg', lu=imp?'in':'cm';
  const L=latestField('weight');
  const conv=v=>imp?Math.round(v*2.20462*10)/10:v;
  const lconv=v=>imp?Math.round(v/2.54*10)/10:v;
  const seriesFor=k=>S.log.map(e=>{ if(e[k]==null) return null;
    return ['weight','squat','bench','dead','ohp'].includes(k)?Math.round(conv(e[k])*10)/10:e[k]; });
  const chartMap={weight:['weight','#E0A03A'],bf:['bf','#5C8CA8'],squat:['squat','#5C8CA8'],bench:['bench','#B4553A'],dead:['dead','#7C9A5E']};
  const [ck,cc]=chartMap[chartKey];
  const recent=[...S.log].sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
  /* pre-fill from whatever's already saved for today, so re-opening this
     tab to fix a typo (or just check what's already in) doesn't look like
     an empty form — the save handler already merges by date, this just
     makes what it'll merge WITH visible. Only today: nothing re-populates
     this on a manual date-field edit, so a past date still shows blank. */
  const todayRec=S.log.find(x=>x.date===T)||{};
  const pf=(k,cf)=>todayRec[k]!=null?(cf?cf(todayRec[k]):todayRec[k]):'';

  return `
    ${sect('plus','LOG A MEASUREMENT')}
    <div class="hint">Fill in whatever you measured - one field is enough. Saving the same date updates that entry. Fields below are pre-filled with what's already saved for today.</div>
    <div class="panel">
      <div class="grid2">
        <label class="f"><span>Date</span><input type="date" id="f_date" value="${T}"></label>
        <label class="f"><span>Weight (${wu})</span><input type="number" step="0.1" id="f_weight" inputmode="decimal" value="${pf('weight',conv)}"></label>
        <label class="f"><span>Body fat %</span><input type="number" step="0.1" id="f_bf" inputmode="decimal" value="${pf('bf')}"></label>
        <label class="f"><span>Waist (${lu})</span><input type="number" step="0.1" id="f_waist" inputmode="decimal" value="${pf('waist',lconv)}"></label>
        <label class="f"><span>Shoulders (${lu})</span><input type="number" step="0.1" id="f_shoulder" inputmode="decimal" value="${pf('shoulder',lconv)}"></label>
        <label class="f"><span>Resting HR</span><input type="number" id="f_rhr" inputmode="numeric" value="${pf('rhr')}"></label>
        <label class="f"><span>Sleep (h)</span><input type="number" step="0.1" id="f_sleep" inputmode="decimal" value="${pf('sleep')}"></label>
      </div>
      <div style="padding:14px 13px 2px;font-size:var(--fs-label);letter-spacing:.12em;color:var(--faint)">TOP SETS - 1RM OR HEAVIEST 5</div>
      <div class="grid2">
        <label class="f"><span>Squat (${wu})</span><input type="number" step="0.5" id="f_squat" inputmode="decimal" value="${pf('squat',conv)}"></label>
        <label class="f"><span>Bench (${wu})</span><input type="number" step="0.5" id="f_bench" inputmode="decimal" value="${pf('bench',conv)}"></label>
        <label class="f"><span>Deadlift (${wu})</span><input type="number" step="0.5" id="f_dead" inputmode="decimal" value="${pf('dead',conv)}"></label>
        <label class="f"><span>Press (${wu})</span><input type="number" step="0.5" id="f_ohp" inputmode="decimal" value="${pf('ohp',conv)}"></label>
        <label class="f"><span>Row (${wu})</span><input type="number" step="0.5" id="f_row" inputmode="decimal" value="${pf('row',conv)}"></label>
        <label class="f"><span>Pull-up added (${wu})</span><input type="number" step="0.5" id="f_pullup" inputmode="decimal" value="${pf('pullup',conv)}"></label>
      </div>
      <div style="padding:13px"><button class="btn" data-act="savelog">${svg('check',13,'var(--ink)',2.6)} SAVE ENTRY</button></div>
    </div>

    ${recent.length?`${sect('act','RECENT ENTRIES')}
    <div class="panel"><div class="tbl">
      <div class="tr th"><span>Date</span><span>Wt</span><span>BF%</span><span>Sq</span><span>Bn</span><span>DL</span><span></span></div>
      ${recent.map(e=>`<div class="tr"><span>${e.date.slice(5)}</span>
        <span>${e.weight!=null?conv(e.weight):'·'}</span><span>${e.bf??'·'}</span>
        <span>${e.squat!=null?Math.round(conv(e.squat)):'·'}</span>
        <span>${e.bench!=null?Math.round(conv(e.bench)):'·'}</span>
        <span>${e.dead!=null?Math.round(conv(e.dead)):'·'}</span>
        <button class="x" data-act="dellog" data-v="${e.date}" aria-label="Delete log entry for ${e.date}">${svg('x',12)}</button></div>`).join('')}
    </div><div class="note">Latest entry drives your standards and fuel targets below.</div></div>`:''}

    ${S.log.length?`${sect('trend','TREND')}
    <div class="panel">
      <div class="chips">${Object.keys(chartMap).map(k=>`<button class="chip ${chartKey===k?'on':''}" data-act="chart" data-v="${k}">${k==='bf'?'Body fat':k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
      ${sparkline(seriesFor(ck),cc,110,ck==='weight'?weightTrendSeries().map(v=>Math.round(conv(v)*10)/10):undefined)}
      ${ck==='weight'&&trendWeight()&&trendWeight().smoothed?`<div class="note">7-day average <b style="color:var(--text)">${conv(trendWeight().kg)} ${wu}</b> from ${trendWeight().n} weigh-ins · latest ${conv(trendWeight().raw)} ${wu}. Calorie and strength targets use the average.</div>`:''}
    </div>`:''}

    ${L&&L.weight?`${sect('target','STRENGTH STANDARDS')}
    <div class="hint">Auto-filled from your logged gym sets (estimated 1RM) or manual entries - whichever is higher.</div>
    <div class="panel">${LIFTS.map(s=>{
      const cur=bestLift(s.k),goal=trendWeight().kg*s.m,pct=cur?clamp(cur/goal*100,0,100):0;
      return `<div class="stand"><div class="standtop"><span style="font-weight:600">${s.l}</span>
        <span>${cur?Math.round(conv(cur)):'—'} <span style="color:var(--faint)">/ ${Math.round(conv(goal))} ${wu}</span></span></div>
        <div class="bar"><div class="barfill" style="width:${pct}%;background:${pct>=100?'var(--moss)':'var(--steel)'}"></div></div></div>`;}).join('')}
      <div class="note">Targets are multiples of current bodyweight, so they move as you do. All four at once is roughly the ceiling for a non-specialist running everything else in this program.</div></div>`:''}

  `;
}

  const phaseMap={
    measure:['MEASURE FIRST','var(--faint)'], lean:['LEAN OUT','var(--rust)'],

  return `

        <div class="eyebrow" style="color:${pc}">CURRENT DIRECTIVE · ${pl}</div>

      </div>
    </div>

/* ======================================================= build: meals ==== */
function MealSection(N){
  const match=bestMeal();
  return `
    ${sect('food','MEAL PLANS')}
    <div class="hint">Full days built from real foods. Tap one to see it, then log the whole day in one tap — or just one meal at a time. Adapt freely; these are patterns, not prescriptions.</div>
    ${MEALS.map(m=>{
      const f=mealFactor(m);
      const t=scaledTotals(m,f), open=openMeal===m.id, best=N&&m.id===match;
      const diff=N?t.kcal-N.kcal:null;
      return `<div class="acc-group">
        <button class="ahead" data-act="meal" data-v="${m.id}" aria-expanded="${open}" style="border-left:3px solid ${best?'var(--amber)':'var(--rule)'}">
          <div style="flex:1">
            <div class="an" style="font-size:var(--fs-form)">${esc(m.name)}${best?' <span class="badge" style="border-color:var(--amber);color:var(--amber)">BEST FIT</span>':''}</div>
            <div style="font-size:var(--fs-caption);color:var(--faint);letter-spacing:.05em;margin-top:4px">
              ${t.kcal} kcal · ${t.p}g protein${diff!=null?` · ${diff>0?'+':''}${diff} vs target`:''}</div>
          </div>
          ${open?svg('chevD',14,'var(--faint)'):svg('chev',14,'var(--faint)')}</button>
        ${open?`<div class="abody">
          ${m.slots.map((s,si)=>`<div class="mslot">
            <div class="mslothead"><span>${esc(s.w)}</span>
              <button class="chip" data-act="logslot" data-v="${m.id}" data-v2="${si}">LOG</button></div>
            ${s.items.map(([n,qq0])=>{ const it=FOODIDX[n]; const qq=scaleQ(qq0,f);
              return `<div class="mitem"><span style="flex:1">${qq!==1?`<b>${qq}×</b> `:''}${esc(n)}</span>
                <span style="color:var(--faint);font-size:var(--fs-detail)">${it?Math.round(it[1]*qq):'?'} kcal</span></div>`;}).join('')}
          </div>`).join('')}
          <div style="padding:12px 13px;display:flex;flex-direction:column;gap:9px">
            ${N&&Math.abs(mealTotals(m).kcal-N.kcal)>150?`<button class="btn ghost" data-act="mealscale">${f!==1?'SHOW ORIGINAL PORTIONS':'SCALE PORTIONS TO MY TARGET ('+N.kcal+' KCAL)'}</button>`:''}
            <button class="btn" data-act="logmeal" data-v="${m.id}">${svg('check',13,'var(--ink)',2.6)} LOG THE WHOLE DAY${f!==1?' — SCALED':''}</button></div>
          ${diff!=null&&diff<-450?`<div class="note" style="color:var(--amber)">This lands ${Math.abs(diff)} kcal under your target. Fine for an occasional lighter day, but not as your default — add a starch or a shake if you use it regularly.</div>`:''}
        </div>`:''}
      </div>`;}).join('')}
`;
}

/* ================================================================ render == */
let lastRenderedView=null;
/* Every action re-renders by replacing the whole #app tree, so anything the DOM was holding that isn't in S
   is lost unless render() carries it across: the exercise sheet's scroll position, the muscle/equipment chip
   rows' horizontal scroll, and half-typed fields in the custom-food, body-log and program-lift set forms. */
let scrollReset=false, lastRenderedDay=null;                               // set by actions that change what the sheet lists (muscle/equipment filter)
const KEEP_FIELD=/^(cf_|f_(?!date$)|sw_|sr_)/;            // f_date is left out on purpose: after saving, the date goes back to today
function render(){
  _memo=null;
  document.documentElement.dataset.text=(S.ui&&S.ui.text)||'';
  const y=window.scrollY;
  const scrollers=[...document.querySelectorAll('.sheetbody,.exchips')].map(el=>[el.scrollTop,el.scrollLeft,el.className]);
  const typed={};
  document.querySelectorAll('input[id],textarea[id]').forEach(el=>{
    if (KEEP_FIELD.test(el.id) && el.value!==el.defaultValue) typed[el.id]=[el.value,el.defaultValue];
  });
  // Any re-render (tapping a result, the g/oz chips) rebuilds the food-search <input>,
  // so capture where the cursor was, or it would snap back to the end of the text.
  const oldFq=document.getElementById('foodq');
  const fqSel=(oldFq&&document.activeElement===oldFq)?[oldFq.selectionStart,oldFq.selectionEnd]:null;
  let body=view==='today'?ViewToday():view==='plan'?ViewPlan():(view==='build'||view==='body')?ViewBuild()
    :view==='wlog'?ViewWorkoutLog():view==='mind'?ViewMind():ViewLedger();
  /* Every click/keystroke re-renders by replacing the whole #app tree — cheap and simple,
     but it means the .view wrapper is a brand-new DOM node every single time, and a CSS
     entrance animation on it would replay on every single interaction, not just when a tab
     is actually switched (that's the "whole screen flashes when I expand something or type
     in food search" report). Only tag it "entering" — and let it animate — when the tab
     itself just changed; every other re-render of the same tab skips it. */
  if (view!==lastRenderedView) body=body.replace('class="view wrap"','class="view wrap enter"');
  lastRenderedView=view;
  document.getElementById('app').innerHTML=Header()+'<main>'+body+'</main>'+restBar()+ExSheet()+TimerOverlay()+Onboarding()+Nav()+`<div class="toast ${toastMsg?'show':''}" style="${rest?'bottom:calc(132px + env(safe-area-inset-bottom))':''}">${toastInner()}</div>`;
  window.scrollTo(0,y);
  const fresh=[...document.querySelectorAll('.sheetbody,.exchips')];
  if (fresh.length===scrollers.length) fresh.forEach((el,i)=>{
    if (el.className!==scrollers[i][2]) return;
    if (!(scrollReset && el.classList.contains('sheetbody'))) el.scrollTop=scrollers[i][0];
    el.scrollLeft=scrollers[i][1];
  });
  scrollReset=false;
  const sameDay=lastRenderedDay===VD(); lastRenderedDay=VD();
  for (const id in typed){                           // only if the app didn't itself change that field's value in this render, and not across days
    const el=document.getElementById(id);
    if (sameDay && el && el.defaultValue===typed[id][1]) el.value=typed[id][0];
  }
  const strip=document.getElementById('strip');
  if (strip){
    const sel=strip.querySelector('.dcell.sel');
    if (sel) strip.scrollLeft = sel.offsetLeft - strip.offsetWidth/2 + sel.offsetWidth/2;
  }
  const rail=document.getElementById('rail'), rnow=document.getElementById('rnow');
  if (rail&&rnow){
    const wake=+rail.dataset.wake, px=+rail.dataset.px;
    const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
    rnow.style.top=clamp((mins-wake)*px,0,rail.offsetHeight)+'px';
  }
  document.body.classList.toggle('lock', !!document.querySelector('.sheet,.tmr,.ob'));
  hydratePhotos();
  const xq=document.getElementById('exq');
  if (xq && exFocus && view==='today'){
    xq.focus(); const l=xq.value.length; xq.setSelectionRange(l,l);
  }
  exFocus=false;                                     // one-shot: later renders must not pull the keyboard back up
  const fq=document.getElementById('foodq');
  if (fq && foodFocus && !xq){                         // the exercise sheet sits on top: never let the food box steal its keyboard
    fq.focus();
    const l=fq.value.length;
    const [s,e]=fqSel?[Math.min(fqSel[0],l),Math.min(fqSel[1],l)]:[l,l];
    fq.setSelectionRange(s,e);
  }
  foodFocus=false;                                   // one-shot, same reason
}

/* ========================================================= drag-to-time == */
let dragState=null;
document.addEventListener('pointerdown', e=>{
  const blk=e.target.closest('.rblk.drag[data-draggable="1"]'); if(!blk) return;
  const rail=document.getElementById('rail'); if(!rail) return;
  dragState={
    id:blk.dataset.id, startY:e.clientY, origTop:parseFloat(blk.style.top), origS:+blk.dataset.s,
    px:+rail.dataset.px, wake:+rail.dataset.wake, railH:rail.offsetHeight, el:blk
  };
  try{ blk.setPointerCapture(e.pointerId); }catch(err){}
  blk.classList.add('dragging');
});
document.addEventListener('pointermove', e=>{
  if(!dragState) return;
  const dy=e.clientY-dragState.startY;
  // Visual position tracks the finger 1:1; the committed time is always derived
  // from the block's true original start (data-s) plus the dragged delta, never
  // from this pixel top — so a block nudged for legibility in DayRail's packing
  // pass can't desync from the time it actually shows once you start dragging it.
  const top=clamp(dragState.origTop+dy,0,dragState.railH-32);
  dragState.el.style.top=top+'px';
  const mins=clamp(Math.round((dragState.origS+dy/dragState.px)/5)*5,0,1439);
  const lab=dragState.el.querySelector('.rblkS');
  if (lab) lab.textContent=s2disp(mins);
});
function endDrag(){
  if(!dragState) return;
  const dy=parseFloat(dragState.el.style.top)-dragState.origTop;
  const mins=clamp(Math.round((dragState.origS+dy/dragState.px)/5)*5,0,1439);
  dragState.el.classList.remove('dragging');
  day(VD()).nudge[dragState.id]=mins;
  commit();
  dragState=null;
  render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ================================================================ events == */
/* Destructive taps that can be taken back for a few seconds. The whole state is snapshotted just before; the toast
   offers UNDO only if the tap really changed something (the first tap of a tap-twice-to-confirm does not).
   Not included: deleting 90-day check-ins or past blocks, because their photos are erased from the phone for good. */
const UNDOABLE = {'w-del':'Set deleted','delset':'Set deleted','delfood':'Food removed','dellog':'Entry removed','w-discard':'Workout dropped',
  'w-rmex':'Exercise removed','f-del':'Session deleted','wl-delday':'Workout deleted','wl-rtdel':'Routine deleted','deloneoff':'Event removed',
  'deledit':'Commitment removed','delmyfood':'Removed from My foods'};
function doUndo(){
  if (!undoSnap) return;
  try{
    S=JSON.parse(undoSnap); undoSnap=null; toastUndo=false;
    normalizeCustom(); WEEK=WEEKS[S.profile.program]||WEEK_STD;
    editSet=null; gymEdit=null; armDiscard=false; armRm=null; armFight=null;
    commit(); render(); toast('Restored');
  }catch(e){ toast('Could not undo that'); }
}
document.addEventListener('click', e => {
  const el=e.target.closest('[data-act]'); if (!el) return;
  const a=el.dataset.act;
  if (a==='undo'){ doUndo(); return; }
  if (undoSnap){ undoSnap=null; toastUndo=false; }     // any other tap makes the old snapshot stale: undoing it would also revert what came after
  const before = UNDOABLE[a] ? JSON.stringify(S) : null;
  handleClick(e);
  if (before!=null && JSON.stringify(S)!==before){ undoSnap=before; toast(UNDOABLE[a],true); }
});
function handleClick(e){
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, v2 = el.dataset.v2;
  const d = day(VD());

  /* custom workouts, fighting and the workout log all live in the w- / f- / wl- action families */
  if (/^(w|f|wl)-/.test(a)){
    if (wAct(a,v,v2,el)!=='norender') render();
    return;
  }
  if (/^b-/.test(a)){ if (bAct(a,v,v2,el)!=='norender') render(); return; }
  if (/^t-/.test(a)){ if (tAct(a,v,v2,el)!=='norender') render(); return; }
  if (/^ob-/.test(a)){ if (obAct(a,v,v2,el)!=='norender') render(); return; }
  if (a==='fold'){ S.ui.fold[v]=!foldOpen(v); commit(); render(); return; }
  if (/^camp-/.test(a)){ if (campAct(a,v,v2,el)!=='norender') render(); return; }
  if (/^s-/.test(a)){ if (sAct(a,v,v2,el)!=='norender') render(); return; }
  if (/^ch-/.test(a)){ if (chAct(a,v,v2,el)!=='norender') render(); return; }
  if (a==='mm-sel'){ mmSel=mmSel===v?null:v; render(); return; }
  if (a==='mm-win'){ mmWin=+v||0; render(); return; }
  if (a==='mm-open'){ view='wlog'; wlSub='body'; mmSel=null; render(); window.scrollTo(0,0); return; }

  switch(a){
    case 'addoneoff': {
      const dt=document.getElementById('oo_d').value;
      const s=document.getElementById('oo_s').value, en=document.getElementById('oo_e').value;
      const l=document.getElementById('oo_l').value.trim()||'Event';
      const tg=document.getElementById('oo_t')?document.getElementById('oo_t').value:'';
      const sp=document.getElementById('oo_sp')?document.getElementById('oo_sp').value:'';
      if(!dt){ toast('Pick a date'); return; }
      if(!s||!en){ toast('Set both times'); return; }
      if(!S.extra[dt]) S.extra[dt]=[];
      const sN=m2s(s); let eN=m2s(en); if(eN<=sN) eN+=1440;
      const overlaps = [...(S.fixed[DOW[dowIdx(dt)]]||[]), ...S.extra[dt]]
        .some(c=>{ const cS=m2s(c.s); let cE=m2s(c.e); if(cE<=cS) cE+=1440; return sN<cE&&eN>cS; });
      S.extra[dt].push({s,e:en,l,t:tg,sp:tg==='physical'?sp:''});
      S.extra[dt].sort((a,b)=>m2s(a.s)-m2s(b.s));
      commit(); render();
      toast(overlaps?'Added — heads up, it overlaps something that day':'One-off added');
      return;
    }
    case 'deloneoff': {
      if (S.extra[v]){ S.extra[v].splice(+v2,1); if(!S.extra[v].length) delete S.extra[v]; }
      commit(); break;
    }
    case 'view': view=v; briefEdit=false; briefBrowse=false; editSet=null; gymEdit=null; exPickOpen=false; exCreate=false; armDiscard=false; armRm=null; if(v==='today') viewOff=0; shiftId=null; foodOpen=false; openMeal=null; importOpen=false; render(); window.scrollTo(0,0); return;
    case 'golog': view='build'; buildSub='log'; render(); window.scrollTo(0,0); return;

    /* ---- day preview navigation ---- */
    case 'daygo':
      viewOff=+v; shiftId=null; foodOpen=false; openBlock2=null; briefEdit=false; briefBrowse=false; render(); window.scrollTo(0,0); return;     // the quote editor/browser is tall: don't carry it to the next day; land on the top of the new day, not wherever the old one was scrolled
    case 'daygo2':
      viewOff=+v; view='today'; shiftId=null; foodOpen=false; openBlock2=null; render(); window.scrollTo(0,0); return;

    /* ---- build tab ---- */
    case 'buildsub': buildSub=v; openMeal=null; render(); window.scrollTo(0,0); return;
    case 'meal': openMeal = openMeal===v?null:v; mealScale=true; break;
    case 'mealscale': mealScale=!mealScale; break;
    case 'setgoal': S.profile.goal=v; commit(); break;
    case 'gearbar': S.cpref.bar[unitKey()]=+v; commit(); break;
    case 'gearplate': {
      const u=unitKey(), cur=platesAvail(), x=+v;

    case 'tour-ok': S.ui.seen[v]=1; commit(); break;

    case 'logmeal': {

        const g=foodGU==='oz'?amt*28.3495:amt, k=g/f[5];
        const r1=x=>Math.round(x*10)/10;
        const label=`${f[0]}, ${r1(amt)} ${foodGU}`;
        d.food.push({n:label,kcal:Math.round(f[1]*k),p:r1(f[2]*k),c:r1(f[3]*k),f:r1(f[4]*k),q:1,...microRef(f,g)});

    }
    case 'water': d.water=Math.max(0,Math.round((d.water||0)+(+v))); commit(); break;
    case 'delfood': d.food.splice(+v,1); foodRows.clear(); commit(); break;
    case 'addmyfood': case 'addrecent': {
      const f=a==='addmyfood'?S.myfoods[+v]:recentFoods()[+v]; if (!f) return;
      d.food.push({n:f.n,kcal:f.kcal,p:f.p,c:f.c,f:f.f,q:+v2||1,...(f.mk?{mk:f.mk,mg:f.mg,...(f.ma?{ma:1}:{})}:{})});
      commit(); foodFocus=true; render(); toast(`${f.n} added`); return;
    }
    case 'delmyfood': {
      const f=S.myfoods[+v]; if (!f) return;
      S.myfoods.splice(+v,1); commit(); foodFocus=true; render(); toast(`${f.n} removed from My foods`); return;
    }
    case 'copyyday': {
      const src=foodOf(addDays(VD(),-1));
      if (!src.length){ toast('Nothing logged the day before'); return; }
      src.forEach(f=>d.food.push({...f}));
      commit(); render(); toast(`${src.length} item${src.length>1?'s':''} copied`); return;
    }

    /* ---- plan / calendar ---- */
    case 'planday': planDay=v; editIdx=null; preset=null; copyMode=false; break;
    case 'preset': preset=preset===v?null:v; break;
    case 'editcmt': editIdx=+v; preset=null; break;
    case 'saveedit': {
      const s=document.getElementById('es').value, en=document.getElementById('ee').value,
            l=document.getElementById('el').value.trim()||'Commitment',
            t=(document.getElementById('et')||{}).value||'',
            sp=(document.getElementById('esp')||{}).value||'';
      if(!s||!en){ toast('Set both times'); return; }
      S.fixed[planDay][+v]={s,e:en,l,t,sp:t==='physical'?sp:''};
      S.fixed[planDay].sort((x,y)=>m2s(x.s)-m2s(y.s));
      editIdx=null; commit(); render(); toast('Saved'); return;
    }
    case 'deledit': S.fixed[planDay].splice(+v,1); editIdx=null; commit(); render(); toast('Removed'); return;
    case 'addcmt': {
      const s=document.getElementById('ns').value, en=document.getElementById('ne').value,
            l=document.getElementById('nl').value.trim()||preset||'Commitment',
            t=(document.getElementById('nt')||{}).value||'',
            sp=(document.getElementById('nsp')||{}).value||'';
      if(!s||!en){ toast('Set both times'); return; }
      S.fixed[planDay].push({s,e:en,l,t,sp:t==='physical'?sp:''});
      S.fixed[planDay].sort((x,y)=>m2s(x.s)-m2s(y.s));
      preset=null; commit(); render(); toast(`Added to ${DOWL[DOW.indexOf(planDay)]}`); return;
    }
    case 'copystart': copyMode=true; copySel={}; break;
    case 'copysel': copySel[v]=!copySel[v]; break;
    case 'copycancel': copyMode=false; break;
    case 'copygo': {
      const src=JSON.parse(JSON.stringify(S.fixed[planDay]));
      const targets=Object.keys(copySel).filter(k=>copySel[k]);
      if(!targets.length){ toast('Pick at least one day'); return; }
      targets.forEach(k=>S.fixed[k]=JSON.parse(JSON.stringify(src)));
      copyMode=false; commit(); render(); toast(`Copied to ${targets.length} day${targets.length>1?'s':''}`); return;
    }

    /* ---- body ---- */
    case 'chart': chartKey=v; break;
    case 'savelog': {
      const imp=S.profile.unit==='imperial';
      const g=id=>num((document.getElementById('f_'+id)||{}).value);
      const date=document.getElementById('f_date').value||T;
      const rec={...(S.log.find(x=>x.date===date)||{}),date};
      let any=false, rejected=[];
      // Weight and body-fat% feed physique()'s math directly (lean-mass and FFMI
      // targets, then every Fuel calorie/macro number) with no downstream guard
      // of their own — a mistyped weight doesn't just record wrong, it silently
      // breaks two other screens with numbers that look plausible but aren't.
      // Range-check here, once, rather than everywhere it's consumed.
      ['weight','squat','bench','dead','ohp','row','pullup'].forEach(k=>{
        const x=g(k); if(x==null) return;
        if(k==='weight'){ const kg=imp?x/2.20462:x; if(!(kg>10&&kg<400)){ rejected.push('weight'); return; } }
        rec[k]=imp?Math.round(x/2.20462*100)/100:x; any=true;
      });
      ['waist','shoulder'].forEach(k=>{const x=g(k); if(x!=null){rec[k]=imp?Math.round(x*2.54*10)/10:x; any=true;}});
      ['bf','rhr','sleep'].forEach(k=>{
        const x=g(k); if(x==null) return;
        if(k==='bf'&&!(x>=0&&x<=70)){ rejected.push('body fat %'); return; }
        rec[k]=x; any=true;
      });
      if(!any&&!rejected.length){ toast('Nothing entered yet'); return; }
      if(!any){ toast(`${rejected.join(' and ')} looked out of range for a real human value — nothing saved`); return; }
      S.log=[...S.log.filter(x=>x.date!==date),rec].sort((x,y)=>x.date>y.date?1:-1);
      commit(); render();
      toast(rejected.length ? `Saved the rest — ${rejected.join(' and ')} looked out of range and was skipped` : 'Saved - see Recent Entries');
      return;
    }
    case 'dellog': S.log=S.log.filter(x=>x.date!==v); commit(); render(); toast('Entry removed'); return;

    /* ---- mind / ledger / codex ---- */
    case 'track': openTrack=openTrack===v?null:v; break;
    case 'phase': openPhase=openPhase===+v?null:+v; break;
    case 'book': S.books[v]=((S.books[v]??0)+1)%3;
      if(S.books[v]===2) S.bookDates[v]=T; else delete S.bookDates[v];
      commit(); break;
    case 'tier': S.tiers[v]=+v2; commit(); break;
    case 'cap': S.capital[v]=!S.capital[v]; commit(); break;
    case 'reach': S.reach[T]=Math.max(0,(S.reach[T]||0)+(+v)); commit(); break;

    /* ---- progression ---- */
    case 'addset': {
      const ex=v, E=EXS[ex], rx=prescribe(ex), dk=VD()+'|g:'+ex, dr=cdraft[dk]||{};
      let w=inLoad((document.getElementById('sw_'+ex)||{}).value);
      let r=num((document.getElementById('sr_'+ex)||{}).value);
      if (w==null) w = rx&&rx.w!=null ? snapLoadKg(rx.w,ex) : null;   // log what the placeholder shows
      if (r==null) r = E.reps;
      if (w==null&&!E.added){ toast('Enter a weight'); return; }
      if (w==null) w=0;
      if (w<0 || r<1){ toast('Weight and reps must be positive'); return; }
      const ge=gymEdit&&gymEdit.ex===ex&&gymEdit.vd===VD()&&S.gym[VD()]&&S.gym[VD()][ex]&&S.gym[VD()][ex][gymEdit.i]?gymEdit:null;
      const rp=num(dr.rpe), flags=ns=>{ if (rp>0) ns.rpe=rp; else delete ns.rpe; if (dr.wu) ns.wu=1; else delete ns.wu; return ns; };
      if (ge){      // editing: needs real numbers, not the prescription a blank box would fall back to
        const rw=inLoad((document.getElementById('sw_'+ex)||{}).value), rr=num((document.getElementById('sr_'+ex)||{}).value);
        if ((rw==null&&!E.added) || rr==null){ toast('Enter weight and reps to save the change'); return; }
        const old=S.gym[VD()][ex][ge.i];
        S.gym[VD()][ex][ge.i]=flags({...old, w:Math.round((rw??0)*100)/100, r:Math.round(rr)});     // keeps p / dl from when it was logged
        delete cdraft[dk]; gymEdit=null; rebuildPR(ex); commit(); render(); toast(`Set ${ge.i+1} updated`); return;
      }
      if (!S.gym[VD()]) S.gym[VD()]={};
      if (!S.gym[VD()][ex]) S.gym[VD()][ex]=[];
      const set=flags({w:Math.round(w*100)/100, r:Math.round(r)});
      /* remember what the plan asked for going into today (ignoring today's own sets), so a lighter day can be told from a new baseline */
      const plan=prescribe(ex,VD());
      if (!set.wu && plan && plan.w>0 && ['progress','repeat','reset'].includes(plan.mode)) set.p=Math.round(snapLoadKg(plan.w,ex)*100)/100;
      if (deloadActive()) set.dl=1;
      S.gym[VD()][ex].push(set);
      delete cdraft[dk];
      const isPR = set.wu ? false : checkPR(ex, set.w, set.r, VD());
      ['sw_','sr_'].forEach(p=>{ const el=document.getElementById(p+ex); if (el) el.value=''; });
      commit();
      /* the same rest timer a custom workout uses: not after a warm-up, and in a superset only after its last exercise */
      const grp=Object.values(BLOCKEX).find(g=>g.length>1&&g.includes(ex));
      if (!set.wu && (!grp || grp[grp.length-1]===ex) && restFor(libOf(ex))>0) restStart(restFor(libOf(ex)));
      render();
      const n=workSets(S.gym[VD()][ex]).length;
      if (isPR){ toast(`New PR — ${dispExact(w)} × ${Math.round(r)}!`); try{navigator.vibrate&&navigator.vibrate([30,40,30]);}catch(e){} }
      else toast(set.wu?`Warm-up: ${dispExact(w)} × ${Math.round(r)}`:`Set ${n}: ${dispExact(w)} × ${Math.round(r)}`);
      return;
    }
    case 'delset': {
      gymEdit=null;
      if (S.gym[VD()] && S.gym[VD()][v]){
        S.gym[VD()][v].splice(+v2,1);
        if(!S.gym[VD()][v].length) delete S.gym[VD()][v];
        rebuildPR(v);
      }
      commit(); break;
    }
    case 'gedit': { gymEdit={ex:v,i:+v2,vd:VD()}; const st=((S.gym[VD()]||{})[v]||[])[+v2]; cdraft[VD()+'|g:'+v]={rpe:st&&st.rpe?String(st.rpe):'',wu:st&&st.wu?'1':''}; break; }
    case 'geditcancel': if (gymEdit) delete cdraft[gymEdit.vd+'|g:'+gymEdit.ex]; gymEdit=null; break;
    case 'g-step': {                                  // the − / + beside a program lift's weight and reps boxes
      const [ex,f]=v.split('|'), inp=document.getElementById((f==='w'?'sw_':'sr_')+ex); if (!inp) return;
      const cur=num(inp.value)!=null?num(inp.value):(f==='w'?(gRxW(ex)||0):EXS[ex].reps);
      inp.value=trimNum(Math.max(0,cur+fieldStep(f)*(+v2)));
      const p=document.getElementById('gplate_'+ex); if (p) p.textContent=platesText(num((document.getElementById('sw_'+ex)||{}).value)??gRxW(ex),libOf(ex));
      return;
    }
    case 'g-ramp': {
      const ex=v, E=exInfo(libOf(ex)), inp=document.getElementById('sw_'+ex);
      const target=num(inp&&inp.value)??gRxW(ex);
      if (!(target>0)){ toast('Enter your working weight first'); return; }
      const steps=warmupRamp(target,E,libOf(ex));
      if (!steps.length){ toast('Light enough to just start your first set'); return; }
      if (!S.gym[VD()]) S.gym[VD()]={};
      const list=S.gym[VD()][ex]=S.gym[VD()][ex]||[];
      steps.forEach(([w,r])=>list.push({w:wOut(String(w)),r,wu:1}));
      commit(); render(); toast(`${steps.length} warm-up sets added: ${steps.map(([w,r])=>w+'×'+r).join(', ')}`); return;
    }
    case 'g-hist': gHist=gHist===v?null:v; break;
    case 'painflag':
      if (S.flags[v]) delete S.flags[v]; else S.flags[v]=T;
      commit(); break;

    /* ---- deload ---- */
    case 'deloadgo': {
      S.deload.until=mondayOf(-1);
      commit(); render(); toast('Deload week started - 60% loads'); return;
    }
    case 'deloadskip': S.deload.snooze=mondayOf(0); commit(); break;

    /* ---- notifications ---- */
    case 'notif': {
      if (S.notif.on){ S.notif.on=false; commit(); render(); toast('Reminders off'); return; }
      if (!('Notification' in window)){ toast('This browser has no notification support'); return; }
      Notification.requestPermission().then(p=>{
        if (p==='granted'){ S.notif.on=true; commit(); startTicker();
          notify('FORGE','Reminders on. You will get a ping 15 minutes before each block.');
          render(); }
        else toast('Permission denied - enable in phone settings');
      });
      return;
    }

    case 'savenw': {
      const dt=document.getElementById('nw_d').value||T, val=num(document.getElementById('nw_v').value);
      if(val==null){ toast('Enter an amount'); return; }
      S.nw=[...S.nw.filter(x=>x.date!==dt),{date:dt,v:val}].sort((x,y)=>x.date>y.date?1:-1);
      commit(); render(); toast('Recorded'); return;
    }
    case 'export': { doBackup(); return; }
    /* in-app textarea instead of prompt() — multi-line paste into prompt()
       is unreliable on iOS Safari / home-screen PWAs, the app's primary
       target per the README, and a backup blob is well past one line. */
    case 'import': importOpen=true; importErr=''; break;
    case 'importcancel': importOpen=false; importErr=''; break;
    case 'importgo': {
      const txt=(document.getElementById('importtxt')||{}).value;
      if(!txt||!txt.trim()){ importErr='Paste the backup JSON first.'; break; }
      let parsed;
      try{ parsed=JSON.parse(txt); }
      catch(err){ importErr="That didn't parse as valid backup JSON — check nothing got cut off in the paste."; break; }
      // Valid JSON isn't the same as a valid backup: check the shape everything
      // else in the app depends on before overwriting live data with it. This
      // runs before S is touched, so a bad paste can never corrupt what's
      // already saved — only a shape check that passes gets to that line.
      const shapeOk = parsed && typeof parsed==='object' && !Array.isArray(parsed)
        && parsed.profile && typeof parsed.profile==='object' && typeof parsed.profile.height!=='undefined'
        && parsed.days && typeof parsed.days==='object' && !Array.isArray(parsed.days)
        && Array.isArray(parsed.log);
      if (!shapeOk){ importErr="That's valid JSON, but not a FORGE backup — it's missing profile/days/log. Nothing was changed; your current data is untouched."; break; }
      snapPut('undo-'+Date.now(),JSON.stringify(S)).then(snapDaily).catch(()=>{});   // today's state stays recoverable under "Undo a restore"
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),parsed);
      if (!(parsed.ui&&parsed.ui.seen)) S.ui=Object.assign({},S.ui,{seen:tourAllSeen()});         // restoring a backup is never a first run
      S.meta=Object.assign({},DEFAULTS.meta,S.meta||{}); S.meta.onboarded=true;   // restoring a backup is never a first run
      normalizeCustom();
      importOpen=false; importErr=''; commit(); render(); toast('Backup restored'); return;
    }
  }
  render();
}

/* live inputs - commit WITHOUT re-render so typing never loses focus */
document.addEventListener('input', e => {
  const t=e.target;
  if (undoSnap){ undoSnap=null; toastUndo=false; }       // typing after a delete also makes its undo stale
  if (t.id==='exq'){                                  // exercise search: swap only the result list so the keyboard stays up
    exQ=t.value; const r=document.getElementById('exres'); if (r){ r.innerHTML=exResultsHTML(); r.scrollTop=0; } return;
  }
  if (t.id==='bq'){                                   // quote search: swap only the list
    briefQ=t.value; briefLim=15; const r=document.getElementById('bqres'); if (r) r.innerHTML=bqResultsHTML(); return;
  }
  if (t.dataset && t.dataset.dr){                     // a set being typed: remember it, no re-render
    const [id,f]=t.dataset.dr.split('|'), dk=VD()+'|'+id;
    (cdraft[dk]=cdraft[dk]||{})[f]=t.value;
    if (f==='w'){ const p=document.getElementById('plate_'+id); if (p) p.textContent=platesText(num(t.value),id); }
    return;
  }
  if (/^sw_/.test(t.id||'')){ const ex=t.id.slice(3), p=document.getElementById('gplate_'+ex); if (p) p.textContent=platesText(num(t.value)??gRxW(ex),libOf(ex)); return; }
  if (t.dataset && t.dataset.ob){ if (obD) obD[t.dataset.ob]=t.value; return; }
  if (t.dataset && t.dataset.camp){ S.camp[t.dataset.camp]=t.value; commitSoon(); return; }
  if (t.dataset && t.dataset.chd){ if (chDraft) chDraft[t.dataset.chd]=t.value; return; }
  if (t.dataset && t.dataset.bm){ S.motiv[t.dataset.bm]=t.value; commitSoon(); return; }
  if (t.dataset && t.dataset.fd){ if (fdraft) fdraft[t.dataset.fd]=t.value; return; }
  if (t.dataset && t.dataset.exnote){ const k=t.dataset.exnote, v=t.value.slice(0,200); if (v.trim()) S.cpref.notes[k]=v; else delete S.cpref.notes[k]; commitSoon(); return; }
  if (t.dataset && t.dataset.cwin){ const cw=curCW(); if (cw){ cw[t.dataset.cwin]=t.value; commitSoon(); } return; }
  if (t.id==='foodq'){ foodQ=t.value; const r=document.getElementById('foodres'); if (r) r.innerHTML=foodResultsHTML(); return; }   // filter live, swap only the list
  if (t.id==='foodg'){ foodG=t.value; return; }                              // amount box: remember, no re-render
  const el=t.closest('[data-in]'); if(!el) return;
  const path=el.dataset.in, val=el.value;
  if (path.startsWith('rv.')){ day(VD()).rv[path.slice(3)]=val; commitSoon(); return; }
  if (path==='profile.heightD'){
    const n=num(val); if(n==null) return;
    S.profile.height=S.profile.unit==='imperial'?Math.round(n*2.54*10)/10:n;
    commitSoon(); return;                               // no render - this was the blank-screen bug
  }
  const key=path.split('.')[1];
  if (el.tagName==='SELECT') return;                    // selects handled on change
  S.profile[key]=(key==='age'||key==='commute')?(num(val)??S.profile[key]):val;
  commitSoon();                                             // still no render
});

/* selects + time pickers - safe to re-render after commit */
document.addEventListener('change', e => {
  const el=e.target.closest('[data-in]'); if(!el) return;
  if (el.tagName!=='SELECT' && el.type!=='time' && el.type!=='date') return;
  if ((el.type==='time'||el.type==='date') && !el.value) return;
  const key=el.dataset.in.split('.')[1];
  S.profile[key]=(key==='activity')?+el.value:el.value;
  commit(); render();
});


/* ========================================================= notifications == */
let tickerId=null; const fired={};
function notify(title,body){
  try{
    if (navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg=>{
        if (reg&&reg.showNotification) reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});
        else new Notification(title,{body});
      }).catch(()=>{ try{ new Notification(title,{body}); }catch(e){} });
    } else new Notification(title,{body});
  }catch(e){}
}
function checkNotif(){
  if (!S.notif.on||typeof Notification==='undefined'||Notification.permission!=='granted') return;
  const now=new Date(); const nowM=now.getHours()*60+now.getMinutes();
  const plan=buildDay(T);
  for (const e of plan.entries){
    if (e.fixed) continue;
    const d=day(T);
    const done = e.id==='train'?false : e.id==='news'?!!d.news : e.id==='mind'?!!d.mind : !!d.blocks[e.id];
    if (done) continue;
    if (nowM===e.s-15&&!fired[e.id+'p']){ fired[e.id+'p']=1; notify(e.l,'Starts in 15 minutes'); }
    if (nowM===e.s&&!fired[e.id+'n']){ fired[e.id+'n']=1; notify('Now: '+e.l, e.sub||''); }
  }
  try{
    if (navigator.setAppBadge){
      const left=plan.entries.filter(e=>!e.fixed&&e.e>nowM&&!(e.id==='news'?day(T).news:e.id==='mind'?day(T).mind:day(T).blocks[e.id])).length;
      left?navigator.setAppBadge(left):navigator.clearAppBadge();
    }
  }catch(e){}
}
function startTicker(){ if(tickerId) return; checkNotif(); tickerId=setInterval(checkNotif,45000); }

/* ================================================================== boot == */
(async function boot(){
  const saved=await Store.load();
  if (saved){
    S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),saved);
    if (!(saved.ui&&saved.ui.seen)) S.ui=Object.assign({},S.ui,{seen:tourAllSeen()});     // saved before the tour existed: not a first run
    S.profile=Object.assign({},DEFAULTS.profile,saved.profile||{});
    S.fixed=Object.assign({},DEFAULTS.fixed,saved.fixed||{});
    S.meta=Object.assign({},DEFAULTS.meta,saved.meta||{});
    Store.save(S);                                      // migrate old key forward
  }
  WEEK = WEEKS[S.profile.program] || WEEK_STD;
  normalizeCustom();
  { /* one-time migration: S.swap used to store a position in the active WEEK array,
       which meant a swap could silently resolve to a different workout after switching
       programs. Convert any leftover numeric values to the stable day id instead. */
    let migrated=false;
    for (const k in S.swap){ const v=S.swap[k];
      if (typeof v==='number'){ const d=WEEK[v]; S.swap[k]=d?d.id:undefined; if(!d) delete S.swap[k]; migrated=true; } }
    if (migrated) commit();
  }
  { /* one-time migration: Friday's "Barbell row — 4x10" block used to log under the
       same key as Wednesday's "Barbell row — 3x8" ('row'), on the premise they'd
       share one progression number — which showed Wednesday's 3x8 target on Friday's
       4x10 block. Now split into its own key (rowvol). Move anything already logged
       under 'row' on a Friday (the only weekday d8c can appear on) over to rowvol so
       it doesn't just vanish from the page it was actually logged on. */
    let rowMigrated=false;
    if (!S.meta.rowSplit) for (const k in S.gym){
      if (S.gym[k]&&S.gym[k].row&&dowIdx(k)===4){
        S.gym[k].rowvol=(S.gym[k].rowvol||[]).concat(S.gym[k].row);
        delete S.gym[k].row;
        rowMigrated=true;
      }
    }
    if (!S.meta.rowSplit && S.prs.row && dowIdx(S.prs.row.date)===4 &&
        (!S.prs.rowvol || S.prs.row.e1rm>S.prs.rowvol.e1rm)){
      S.prs.rowvol=S.prs.row; delete S.prs.row; rowMigrated=true;
    }
    /* run once only: the row exercise can now legitimately be logged on a Friday
       (swapped days, other programs), and re-running would keep moving it. */
    if (!S.meta.rowSplit){ S.meta.rowSplit=true; rowMigrated=true; }
    if (rowMigrated) commit();
  }
  if (S.meta.onboarded==null){
    S.meta.onboarded = !!saved && (S.log.length>0 || Object.keys(S.gym).length>0 || Object.keys(S.cust).length>0 || daysLogged()>0);
    commit();
  }
  if (!S.meta.start){
    const hasHistory = S.log.length>0 || Object.keys(S.gym).length>0 || daysLogged()>0;
    S.meta.start = hasHistory ? dkey(-30) : T;   // existing users skip the ramp entirely
    commit();
  }
  render();
  snapDaily().then(()=>{ if (view==='plan') render(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (S.notif.on&&typeof Notification!=='undefined'&&Notification.permission==='granted') startTicker();
  const ms=new Date(new Date().setHours(24,0,30,0))-new Date();
  const midnight=()=>{
    const busy=(tmrOpen && ['prep','work','rest'].includes(tmr.phase)) || Object.values(cdraft).some(d=>Object.values(d).some(x=>x));
    if (busy) setTimeout(midnight,60000); else location.reload();     // wait out a running round timer or a set that's typed but not logged
  };
  setTimeout(midnight,Math.max(ms,60000));
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='hidden') flushSave();
    if (document.visibilityState==='visible' && dkey()!==T) location.reload();
  });
  addEventListener('pagehide', flushSave);
})();
